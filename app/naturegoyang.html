    <label for="ce-t">따라 쓸 핵심 <span class="muted">(틀렸을 때 손으로 쓰는 답, 비우면 뒷면에서 뽑아)</span></label><input id="ce-t" name="t" maxlength="150" value="${esc(c.t||'')}" placeholder="${esc(answerKey(c.a))}">
    <label for="ce-h">힌트</label><input id="ce-h" name="h" value="${esc(c.h||'')}">
    <div class="row" style="margin-top:4px"><button type="submit" class="btn primary sm">저장</button><button type="button" class="btn sm" data-act="card-edit-cancel">취소</button><button type="button" class="btn ghost sm" data-act="card-drop" data-u="${u}" data-c="${c.id}">이 카드 빼기</button></div>
    <p class="hint">수식은 $...$로 써. 고쳐도 외운 기록은 그대로 남아.</p></form>`;
}
function cardBox(cs){
  if(!cs||!cs.queue.length) return '';
  const it=cs.queue[0], c=cardOf(it.u,it.id); if(!c) return '';
  const n=NODE[it.u];
  if(UI.cedit&&!UI.cedit.list&&UI.cedit.u===it.u&&UI.cedit.id===it.id) return `<div class="cardbox">${cardEditForm(it.u,c)}</div>`;
  const meta=`<div class="cb-meta"><span class="pill">${esc(c.k)}</span>${cs.mode==='review'?chip(n):''}<span class="mono cb-count">${cs.mode==='review'?`${cs.done} / ${cs.total}`:`남은 카드 ${cs.queue.length}`}</span></div>`;
  const front=`<div class="cb-q md" style="--dc:var(${DOM[n.d].c})">${md(c.q)}</div>`;
  const ans=`<div class="cb-a md">${md(c.a)}</div>${c.h?`<p class="cb-h">${inl(c.h)}</p>`:''}`;
  let body, note='', canEdit=true;
  if(cs.copy){
    body=`${ans}${cs.copy.typed?`<p class="cb-typed">${cs.copy.recall?'기억해서 쓴 답':'내가 적은 답'}: ${esc(cs.copy.typed)}</p>`:''}${copyForm('card-copy-form','card-copy',cardKey(c),cs.copy.recall?'기억과 달랐어. 보고 그대로 따라 써.':'보고 그대로 따라 써. 맞게 써야 넘어가.')}`;
    note='따라 쓴 카드는 조금 뒤에 다시 나와. 그때는 보지 않고 써야 해.';
  } else if(cs.recall?.[it.u+'/'+it.id]){
    canEdit=false; // the edit form shows the answer
    body=`<form class="reveal-form" id="card-recall-form"><label class="label" for="card-recall">아까 틀린 카드야. 보지 않고 써 봐</label><input id="card-recall" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="기억나는 대로 써"><div class="row" style="margin:0"><button type="submit" class="btn primary">확인 <kbd>Enter</kbd></button><button type="button" class="btn" data-act="card-giveup">모르겠어</button></div></form>`;
  } else if(!cs.revealed){
    body=`<form class="reveal-form" id="reveal-form"><label class="sr" for="card-typed">떠올린 답</label><input id="card-typed" autocomplete="off" placeholder="떠올린 답을 적어 봐 (안 적어도 돼)" value="${esc(cs.typed||'')}"><div><button type="submit" class="btn primary">답 보기 <kbd>Enter</kbd></button></div></form>`;
  } else {
    body=`${ans}${cs.typed?`<p class="cb-typed">내가 적은 답: ${esc(cs.typed)}</p>`:''}
       <div class="grades"><button type="button" class="btn g1" data-act="cg" data-g="1">몰랐어 <kbd>1</kbd></button><button type="button" class="btn g2" data-act="cg" data-g="2">헷갈렸어 <kbd>2</kbd></button><button type="button" class="btn primary" data-act="cg" data-g="3">알았어 <kbd>3</kbd></button></div>`;
    note='몰랐거나 헷갈렸으면 따라 쓰고, 조금 뒤에 보지 않고 다시 써.';
  }
  return `<div class="cardbox">${meta}${front}${body}<div class="cb-foot">${canEdit?`<button type="button" class="linkbtn" data-act="card-edit" data-u="${it.u}" data-c="${it.id}">이 카드 고치기</button>`:"<span></span>"}${note?`<span class="hint" style="margin:0">${note}</span>`:''}</div></div>`;
}
function cardsView(){
  const cs=UI.cs;
  const head=`<div class="study-top"><button type="button" class="btn ghost sm" data-act="back">← ${backLabel()}</button></div><header class="pagehead"><div><p class="eyebrow">간격 반복 · 암기 카드</p><h1>카드 복습</h1><p class="lede">먼저 떠올리고, 답을 보고, 솔직하게 채점해. 몰랐거나 헷갈린 카드는 그 자리에서 따라 쓰고, 조금 뒤에 다시 나오면 보지 않고 써야 해. 다음 간격도 짧아져.</p></div></header>`;
  if(!cs||cs.state==='loading') return head+`<div class="cards-wrap">${busy('카드를 불러오는 중')}</div>`;
  if(!cs.queue.length){
    const c=cs.counts;
    return head+`<div class="res card"><p class="eyebrow">카드 복습 끝</p><p class="res-score">${cs.total}<small> 장</small></p>
      <p>알았어 ${c[3]} · 헷갈렸어 ${c[2]} · 몰랐어 ${c[1]}</p>${cs.total===0?'<p class="muted">오늘 복습할 카드가 없어.</p>':''}
      <p class="hint">다음: ${esc(nextLabel())}</p>
      <div class="row"><button type="button" class="btn primary" data-act="next">이어하기 →</button><button type="button" class="btn" data-act="nav" data-view="today">오늘로</button></div></div>`;
  }
  const pct=cs.total?cs.done/cs.total*100:0;
  return head+`<div class="cards-wrap"><div class="cprog"><span>진행</span><span class="dbar"><i class="s" style="width:${pct}%"></i></span><span class="mono">${cs.done} / ${cs.total}</span></div>${cardBox(cs)}</div>`;
}

/* quiz */
function quizStep(sv,n){
  if(!rec(sv.id)?.cd) return `<div class="quiz-wrap"><div class="note">암기를 먼저 끝내야 확인 문제를 풀 수 있어.</div><div class="row"><button type="button" class="btn primary" data-act="step" data-step="cards">암기로 가기</button></div></div>`;
  const q=sv.quiz;
  if(!q||q.state==='loading') return `<div class="quiz-wrap">${busy('확인 문제 8개를 만드는 중',q?.t0,'stop-quiz','가장 유능한 모델이 생각하고 써서 1~2분쯤 걸려.')}</div>`;
  if(q.state==='nosample') return `<div class="quiz-wrap"><div class="note">${NOSAMPLE}</div></div>`;
  if(q.state==='error') return `<div class="quiz-wrap"><div class="note bad">${esc(q.err)}</div><div class="row"><button type="button" class="btn primary" data-act="retry-quiz">문제 다시 만들기</button></div></div>`;
  const it=q.items[q.i], r=q.res[q.i];
  const dots=`<ol class="qdots" aria-hidden="true">${q.items.map((x,i)=>{ const rr=q.res[i]; return `<li class="${rr?.void?'void':rr?.done?(rr.score>=0.7?'good':rr.score>0?'mid':'bad'):i===q.i?'cur':''}"></li>`; }).join('')}</ol>`;
  const meta=`<div class="qmeta"><span class="mono">문제 ${q.i+1} / ${q.items.length}</span><span class="pill">${esc(it.level||TYPE_LABEL[it.type])}</span><span>목표 ${it.obj+1}</span><span class="muted">모두 맞혀야 통과</span></div>`;
  const failed=q.res.some(x=>x?.done&&!x.void&&x.score<1);
  const failNote=failed&&r?.done&&!needCopy(it,r)&&q.i<q.items.length-1?'<div class="note bad" style="margin:14px 0 0">이번 회차는 이미 100점이 안 돼. 남은 문제는 연습으로 풀어도 되고, 지금 새 문제로 다시 도전해도 돼. <button type="button" class="btn sm" data-act="retry-quiz">새 문제로 다시</button></div>':'';
  return `<div class="quiz-wrap"><div class="qcard" style="--dc:var(${DOM[n.d].c})">${dots}${meta}<div class="qstem md">${md(it.q)}</div>${answerArea(it,r,'q')}${feedback(it,r,'q',q.i===q.items.length-1)}${failNote}</div></div>`;
}
function submitRow(ns, enabled, isForm){
  if(ns==='q') return `<div class="row"><button class="btn primary" ${isForm?'type="submit"':'type="button" data-act="q-submit"'}${enabled?'':' disabled'}>제출</button></div>`;
  const b=(sure,label,cls)=>`<button class="btn ${cls}" ${isForm?`type="submit" name="sure" value="${sure}"`:`type="button" data-act="rv-submit" data-sure="${sure}"`}${enabled?'':' disabled'}>${label}</button>`;
  return `<div class="row">${b(1,'확신하고 제출','primary')}${b(0,'헷갈리지만 제출','')}</div>`;
}
function answerArea(it, r, ns){
  const done=r?.done;
  if(it.type==='mcq'){
    return `<div class="choices">${it.choices.map((c,i)=>{ let cls=''; if(done){ if(i===it.answer) cls=' is-right'; else if(i===r.choice) cls=' is-wrong'; }
      return `<button type="button" class="choice${cls}" data-act="${ns}-pick" data-i="${i}" aria-pressed="${!done&&r?.pick===i}"${done?' disabled':''}><span class="mk">${MARKS[i]||i+1}</span><span>${inl(c)}</span></button>`; }).join('')}</div>${done?'':submitRow(ns,r?.pick!=null,false)}`;
  }
  if(it.type==='num'){
    return `<form class="ans-form" data-kind="num" data-ns="${ns}"><label class="label" for="${ns}-num">답을 숫자로 써 (예: 12.5, 3e8, 6.0×10^23)</label><div class="num-row"><input id="${ns}-num" name="num" inputmode="decimal" autocomplete="off" value="${done?esc(r.val):''}"${done?' disabled':''}><span class="unit">${esc(it.unit)}</span></div>${done?'':submitRow(ns,true,true)}</form>`;
  }
  return `<form class="ans-form" data-kind="short" data-ns="${ns}"><label class="label" for="${ns}-short">정확하게, 자기 말로 설명해</label><textarea id="${ns}-short" name="short" rows="6" placeholder="정의의 핵심 요소를 빠짐없이 넣어서 써 봐."${done||r?.grading?' disabled':''}>${esc(r?.text||'')}</textarea>${done?'':r?.grading?`<div class="row">${busy('채점하는 중',r.t0)}</div>`:'<div class="row"><button type="submit" class="btn primary">채점받기</button></div>'}${r?.err?`<p class="note bad" style="margin-top:10px">${esc(r.err)}</p>`:''}</form>`;
}
function feedback(it, r, ns, last, extra=''){
  if(!r?.done) return '';
  const voidBtn=ns==='q'?(r.void?'<span class="pill">채점에서 뺐어</span>':'<button type="button" class="linkbtn" data-act="q-void">이 문제가 잘못됐어 · 채점에서 빼기</button>'):'<span></span>';
  const next=needCopy(it,r)
    ? `${copyForm('copy-form',`${ns}-copy`,itemKey(it),'틀린 문제는 핵심을 그대로 따라 써야 넘어가.',`data-ns="${ns}"`)}${ns==='q'?`<div class="row">${voidBtn}</div>`:''}`
    : `<div class="row">${voidBtn}<button type="button" class="btn primary" data-act="${ns}-next">${last?'결과 보기':'다음 문제 →'}</button></div>`;
  if(it.type==='short'){
    const g=r.grade||{}, hit=g.hit||[];
    return `<div class="fb"><div class="fb-h"><span class="pill ${r.score>=1?'good':'bad'}">${r.score>=1?'통과':'보완 필요'}</span><span>${esc(g.feedback||'')}</span></div>
      ${it.rubric.length?`<ul class="rubric">${it.rubric.map((x,i)=>`<li class="${hit.includes(i)?'hit':'miss'}">${hit.includes(i)?'담음':'빠짐'} · ${inl(x)}</li>`).join('')}</ul>`:''}
      ${g.wrong?`<p><b>바로잡기</b> ${inl(g.wrong)}</p>`:''}
      ${it.model?`<details><summary>모범 답안 보기</summary><div class="md">${md(it.model)}</div></details>`:''}${next}</div>`;
  }
  const ok=r.score>=1;
  const ans=it.type==='mcq'?`${MARKS[it.answer]} ${inl(it.choices[it.answer])}`:`${esc(fmtNum(it.answer))} ${esc(it.unit)}`;
  return `<div class="fb"><div class="fb-h"><span class="pill ${ok?'good':'bad'}">${ok?'정답':'오답'}</span>${ok?'':`<span>정답: ${ans}</span>`}</div><div class="md">${md(it.why)}</div>${extra}${next}</div>`;
}
function resultStep(sv,n){
  const R=sv.result;
  if(!R) return '';
  if(R.inconclusive) return `<div class="res card"><p class="eyebrow">판정 보류</p><h2>채점에서 뺀 문제가 많아서 판정을 못 했어</h2><p class="muted">새 문제로 다시 풀자. 기록은 바뀌지 않았어.</p><div class="row"><button type="button" class="btn primary" data-act="retry-quiz">새 문제로 다시</button></div></div>`;
  const pct=Math.round(R.score*100);
  if(R.passed&&!R.mastered){ const c=bookStats(n.id);
    return `<div class="res card"><p class="eyebrow">확인 통과</p><p class="res-score">${pct}<small>점</small></p><h2>교재 문제가 남았어</h2><p class="muted">교재 문제 ${c.total}개 가운데 ${c.solo}개를 혼자 풀었어. 모두 혼자 풀면 「${esc(n.t)}」 단원이 숙달돼.</p><div class="row"><button type="button" class="btn primary" data-act="step" data-step="book">교재 문제로 →</button><button type="button" class="btn" data-act="nav" data-view="today">오늘로</button></div></div>`; }
  const head=R.passed
    ? `<p class="eyebrow">숙달</p><p class="res-score">${pct}<small>점</small></p><h2>「${esc(n.t)}」 단원을 숙달했어</h2><p class="muted">카드는 내일부터, 응용 복습은 ${fmtRel(rec(n.id).nx)}부터 나와. 카드 간격이 모두 3주를 넘으면 단단함이 돼.</p>`
    : `<p class="eyebrow">아직</p><p class="res-score">${pct}<small>점</small></p><h2>100점이 아니라서 아직 숙달이 아니야</h2><p class="muted">틀린 문제의 목표를 확인해. 다시 도전하면 그 목표를 더 많이 묻는 새 문제 8개가 나와. 다음 단원은 이 단원을 100점으로 통과해야 열려.</p>`;
  const bars=`<div class="objbars">${n.obj.map((o,i)=>{ const v=R.byObj[i]; if(v==null) return ''; const p=Math.round(v*100);
    return `<div class="objbar${v<0.7?' low':''}"><span>${i+1}. ${esc(o)}</span><span class="dbar"><i class="m" style="width:${p}%"></i></span><span class="mono">${p}%</span></div>`; }).join('')}</div>`;
  const unl=R.unlocked.length?`<p class="label">새로 열린 단원</p><div class="chips">${R.unlocked.map(id=>chip(NODE[id])).join('')}</div>`:'';
  const btns=R.passed
    ? `<button type="button" class="btn primary" data-act="next">이어하기 →</button><button type="button" class="btn" data-act="nav" data-view="today">오늘로</button>`
    : `<button type="button" class="btn primary" data-act="retry-quiz">새 문제로 다시 도전</button><button type="button" class="btn" data-act="to-lesson">설명 다시 보기</button>`;
  return `<div class="res card">${head}${bars}${unl}${R.passed?`<p class="hint">다음: ${esc(nextLabel())}</p>`:''}<div class="row">${btns}</div></div>`;
}

/* unit review */
function reviewView(){
  const rv=UI.review;
  const head=`<div class="study-top"><button type="button" class="btn ghost sm" data-act="back">← ${backLabel()}</button></div><header class="pagehead"><div><p class="eyebrow">간격 반복 · ${rv.ids.length}개 단원</p><h1>응용 복습</h1><p class="lede">숙달한 단원을 다른 각도에서 다시 꺼내. 확신했는지도 같이 고르면 다음 간격이 거기에 맞춰져.</p></div></header>`;
  if(rv.state==='loading') return head+`<div class="quiz-wrap">${busy(`복습 문제 ${rv.ids.length}개를 만드는 중`,rv.t0,'stop-review','가장 유능한 모델이 생각하고 써서 1~2분쯤 걸려.')}</div>`;
  if(rv.state==='nosample') return head+`<div class="note">${NOSAMPLE}</div>`;
  if(rv.state==='error') return head+`<div class="quiz-wrap"><div class="note bad">${esc(rv.err)}</div><div class="row"><button type="button" class="btn primary" data-act="retry-review">다시 만들기</button></div></div>`;
  if(rv.state==='done') return head+reviewSummary(rv);
  const it=rv.items[rv.i], r=rv.res[rv.i], n=NODE[it.id];
  const dots=`<ol class="qdots" aria-hidden="true">${rv.items.map((x,i)=>{ const rr=rv.res[i]; return `<li class="${rr?.done?(rr.score?'good':'bad'):i===rv.i?'cur':''}"></li>`; }).join('')}</ol>`;
  const extra=r?.done?`<p class="fb-next">${r.score?(r.sure?'확신하고 맞혔어.':'맞혔지만 헷갈렸어.'):'틀렸어. 흔들림으로 표시하고 내일 다시 낼게.'} ${r.score?`다음 응용 복습은 ${fmtRel(rec(n.id).nx)}.`:''}</p>`:'';
  return head+`<div class="quiz-wrap"><div class="qcard" style="--dc:var(${DOM[n.d].c})">${dots}<div class="qmeta"><span class="mono">${rv.i+1} / ${rv.items.length}</span>${chip(n)}</div><div class="qstem md">${md(it.q)}</div>${answerArea(it,r,'rv')}${feedback(it,r,'rv',rv.i===rv.items.length-1,extra)}</div></div>`;
}
function reviewSummary(rv){
  const c=rv.res.filter(r=>r?.score).length, more=dueList().length;
  return `<div class="res card"><p class="eyebrow">응용 복습 끝</p><p class="res-score">${c}<small> / ${rv.items.length} 정답</small></p>
    <ul class="rlist">${rv.items.map((it,i)=>{ const r=rv.res[i]||{}; return `<li>${chip(NODE[it.id])}<span class="pill ${r.score?'good':'bad'}">${r.score?(r.sure?'확신 정답':'헷갈린 정답'):'오답'}</span><span class="muted">다음 ${fmtRel(rec(it.id).nx)}</span></li>`; }).join('')}</ul>
    <p class="hint">틀린 단원은 흔들림으로 표시되고 내일 다시 나와. 설명과 카드를 다시 보고 확인 문제를 통과하면 회복돼.</p>
    <p class="hint">다음: ${esc(nextLabel())}</p>
    <div class="row"><button type="button" class="btn primary" data-act="next">이어하기 →</button><button type="button" class="btn" data-act="nav" data-view="today">오늘로</button></div></div>`;
}

/* 오답 다시 보기 화면: 떠올리기(써 봐도 됨) → 정답·해설 → 스스로 채점 */
function startMisReview(){
  UI.sel=null; enter('mreview');
  const q=dueMistakes().sort((a,b)=>misDay(a)-misDay(b)||a.t-b.t).slice(0,MIS_MAX).map(m=>m.id);
  UI.mr={queue:q, i:0, revealed:false, typed:'', ok:0, total:q.length};
  render(); window.scrollTo(0,0);
}
function mreviewView(){
  const mr=UI.mr;
  const head=`<div class="study-top"><button type="button" class="btn ghost sm" data-act="back">← ${backLabel()}</button></div><header class="pagehead"><div><p class="eyebrow">간격 반복 · 오답 노트</p><h1>오답 다시 보기</h1><p class="lede">전에 틀린 문제야. 먼저 답을 떠올리고(써 봐도 돼), 정답을 보고 솔직하게 채점해. 세 번 이어 맞히면 졸업이야.</p></div></header>`;
  if(!mr) return head;
  while(mr.i<mr.queue.length&&!S.mistakes.items.some(x=>x.id===mr.queue[mr.i])) mr.i++;
  if(mr.i>=mr.queue.length) return head+`<div class="res card"><p class="eyebrow">오답 다시 보기 끝</p><p class="res-score">${mr.ok}<small> / ${mr.total} 맞힘</small></p>

/* 큰 개념 잇기: 한 큰 개념의 숙달 단원이 3개가 되면, 그 뒤로는 지난 정리보다 4개 늘 때마다 이어하기가 새 단원 앞에서 연결 정리를 보여 준다.
   본 정리는 stats.ideas에 남겨, 숙달 단원이 그대로면 큰 개념 화면에서 다시 만들지 않고 보여 준다. */
function ideaKnown(k){ return NODES.filter(n=>n.ideas.includes(k)&&known(n.id)).length; }
function ideaDue(){
  if(!ENV.sample) return null;
  const seen=S.stats.ideas||{}; let best=null, gap=0;
  for(const k of Object.keys(IDEAS)){ const kn=ideaKnown(k), last=seen[k]?.n||0, g=kn-last; if(kn>=3&&g>=(last?4:3)&&g>gap){ best=k; gap=g; } }
  return best;
}

/* 확인 문제 은행(26.11.25 영신 "미리 만들어 검산"): quiz/<id>에 검산한 문제(단원당 30여 개)가 있으면 회차마다
   def 2·app 3·calc 2·explain 1을 뽑는다. 지난 두 회차에 낸 문제는 피하고, 지난번 약했던 목표와 덜 나온 목표를 먼저 고르고,
   객관식 보기 순서는 섞는다. 은행이 없거나 읽지 못하면 예전처럼 그 자리에서 만든다. */
const QUIZ_BANK={};
async function getQuizBank(u){
  if(u in QUIZ_BANK) return QUIZ_BANK[u];
  if(!ENV.db) return null;
  try{ const s=await withTimeout(ENV.db.doc('quiz/'+u).get(),8000); const d=s.exists?s.data():null; return (QUIZ_BANK[u]=Array.isArray(d?.items)?d.items.filter(x=>x&&!x.x):null); }
  catch(e){ return null; }
}
function drawQuiz(u, bank){
  const r=rec(u)||{}, recent=new Set(r.qu||[]), miss=new Set(r.miss||[]), nobj=NODE[u].obj.length, rnd=new Map(bank.map(x=>[x.id,Math.random()]));
  const out=[], used=new Set(), objN={};
  const cost=x=>(recent.has(x.id)?10:0)-(miss.has(x.obj)?3:0)+(objN[x.obj]||0)*2+rnd.get(x.id);
  for(const [s,n] of [['def',2],['app',3],['calc',2],['explain',1]]) for(let k=0;k<n;k++){
    const c=bank.filter(x=>x.slot===s&&!used.has(x.id)).sort((a,b)=>cost(a)-cost(b))[0]; if(!c) break;
    used.add(c.id); objN[c.obj]=(objN[c.obj]||0)+1; out.push(c); }
  return out.map(x=>{ const it=normItem(x,nobj); if(!it) return null; it.bid=x.id;
    if(it.type==='mcq'){ const ch=it.choices, ord=ch.map((_,i)=>[i,Math.random()]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]); it.choices=ord.map(i=>ch[i]); it.answer=ord.indexOf(it.answer); }
    return it; }).filter(Boolean);
}
function prefetchQuiz(sv){ if(ENV.sample&&!sv.quiz&&rec(sv.id)?.cd) genQuiz(sv,true); }
async function genQuiz(sv, bg){
  if(sv.quiz&&(sv.quiz.state==='loading'||sv.quiz.state==='ready')){ if(!bg) render(); return; }
  if(!ENV.sample){ sv.quiz={state:'nosample'}; if(!bg) render(); return; }
  const Q=sv.quiz={state:'loading',t0:Date.now()};
  if(!bg) render();
  if(!CARDS[sv.id]) await getCards(sv.id).catch(()=>null);
  const ctl=new AbortController(); Q.ctl=ctl;
  try{
    let items=null;
    const bank=await getQuizBank(sv.id);
    if(bank&&bank.length>=12){ items=drawQuiz(sv.id,bank); if(items.length>=6){ const r=ensure(sv.id); r.qu=[...items.map(x=>x.bid),...(r.qu||[])].slice(0,16); save('progress'); Q.bank=true; } else items=null; }
    if(!items) items=asArray(await ENV.sample.json(quizPrompt(sv),{signal:ctl.signal, cache:false})).map(x=>normItem(x,NODE[sv.id].obj.length)).filter(Boolean).slice(0,10);
    if(items.length<6) throw {code:'invalid_json'};
    Object.assign(Q,{state:'ready', items, i:0, res:[]});
  }catch(e){ Object.assign(Q,{state:'error', err:sampleErr(e)}); }
  if(UI.study===sv&&sv.step==='quiz'&&sv.quiz===Q) render();
}
function gradeCard(g){
  const cs=UI.cs; if(!cs||!cs.revealed||cs.copy||!cs.queue.length) return;
  const it=cs.queue[0], key=it.u+'/'+it.id, m=cst(it.u);
  if(cs.mode==='learn'){
    if(g===3){ cs.queue.shift(); m[it.id]=cardFirst(cs.tried[key]||3); }
    else cs.tried[key]=Math.min(cs.tried[key]||3,g);
    bump('k');
  } else {
    if(!(key in cs.graded)){ cs.graded[key]=g; cs.counts[g]++; cs.done++; applyCardReview(m,it.id,g); bump('k'); }
    if(g===3) cs.queue.shift();
  }
  if(g!==3){
    const c=cardOf(it.u,it.id);
    if(c&&typeKey(cardKey(c))) cs.copy={g, typed:cs.typed};

function finishQuiz(){

  const byObj=n.obj.map((_,i)=>{ const js=valid.filter(j=>q.items[j].obj===i); return js.length? js.reduce((a,j)=>a+(q.res[j]?.score||0),0)/js.length : null; });

async function genReview(rv){
  if(!ENV.sample){ rv.state='nosample'; render(); return; }
  const ctl=new AbortController(); rv.ctl=ctl; rv.state='loading'; rv.t0=Date.now(); render();
  try{
    const by={};
    for(const x of asArray(await ENV.sample.json(reviewPrompt(rv.ids),{signal:ctl.signal, cache:false}))){

    rv.state='ready';

function fixHere(sv){
  const R=sv.reader, L=sv.lesson;
  if(!R||!L.md) return {page:0, of:0, sec:'', at:''};
  const ch=readChunks(sv), N=ch.length;
  if(R.whole) return {page:0, of:N, sec:'전체 보기', at:''};
  const c=ch[Math.min(R.i,N-1)]||{};
  const at=c.type==='book'?`교재 문제 목표 ${c.o}`:String(c.body||c.q||'').replace(/```[\s\S]*?```/g,' [그림] ').replace(/[#*>`|]/g,'').replace(/\s+/g,' ').trim().slice(0,160);
  return {page:R.i+1, of:N, sec:[c.sec,c.sub].filter(Boolean).join(' · '), at};
}

function mixQuotaLeft(){ const y=S.stats.days[dayKey(dayStart()-DAY)]||{}, t=S.stats.days[dayKey()]||{}; return Math.max(0,Math.min(30,Math.max(5,y.gq||0))-(t.mq||0)); }

function mixPool(all){
  const t=dnum(), due=[], fresh={};
  for(const n of ORDER){ const u=n.id; if(!known(u)||!hasBook(u)) continue; if(!all&&(rec(u).ma||0)>=dayStart()) continue;
    const m=bget(u); for(const p of mixList(u)){ const e=m[p.k], ck=u+'::'+p.k;

function mixBundle(all){
  const P=mixPool(all), n=all?5:Math.min(5,mixQuotaLeft()); if(n<=0) return [];
  const q=P.due.slice(0,Math.min(2,n)), day=String(dnum());
  const gs=Object.keys(P.fresh).sort((a,b)=>hashStr(a+day)-hashStr(b+day)).map(g=>P.fresh[g].slice());
  while(q.length<n&&gs.some(g=>g.length)) for(const g of gs){ if(q.length>=n) break; if(g.length) q.push(g.shift()); } // 묶음마다 돌아가며 하나씩

}

/* calculator: math.js, loaded the first time it opens; arithmetic only (no solver, no symbolic derivative) */
let MATHJS=null;
function loadMath(){
  if(MATHJS) return MATHJS;
  MATHJS=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.9.1/math.min.js';
    s.onload=()=>{ try{
      const m=window.math.create(window.math.all), ev=m.evaluate;
      m.import({integ(f,a,b,n){ n=Math.max(2,Math.round(n||1000)); if(n%2) n++; const h=(b-a)/n; let s=f(a)+f(b); for(let i=1;i<n;i++) s+=(i%2?4:2)*f(a+i*h); return s*h/3; }});
      const shut={}; for(const f of ['import','createUnit','evaluate','parse','compile','simplify','simplifyConstant','simplifyCore','rationalize','derivative','polynomialRoot','lsolve','lusolve','usolve','lsolveAll','usolveAll','resolve','symbolicEqual']) shut[f]=function(){ throw new Error(`${f}는 계산기에서 쓰지 않아`); };
      m.import(shut,{override:true}); res({m,ev});
    }catch(e){ MATHJS=null; rej(e); } };
    s.onerror=()=>{ MATHJS=null; s.remove(); rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return MATHJS;
}

/* answers: same text (keeping brackets, which decide open or closed intervals) or the same number */
const ansNorm=s=>deTex(String(s||'')).normalize('NFKC').replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/∞|무한대|infinity|inf/gi,'∞').replace(/≤|=</g,'<=').replace(/≥|=>/g,'>=').toLowerCase();
const strictNum=s=>{ const t=String(s).trim().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/,/g,'').replace(/[×x*]10\^?\(?(-?\d+)\)?/i,'e$1'); return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)?parseFloat(t):NaN; };
function bkSame(a,b){ const x=ansNorm(a), y=ansNorm(b); if(x&&x===y) return true; const p=strictNum(a), q=strictNum(b); return !isNaN(p)&&!isNaN(q)&&Math.abs(p-q)<=Math.max(Math.abs(q)*0.005,1e-12); }

/* a bundle of five: today's re-solves first (at most two), then new problems in book order.
   o: only that objective's problems (opened from the lesson). Without o, new problems wait for 암기; re-solves never wait. */
function bkBundle(u,o){
  const m=bget(u), t=dnum(), L=o?gateList(u).filter(p=>p.o===o):gateList(u), open=!!o||!!rec(u)?.cd;
  const due=L.filter(p=>{ const e=m[p.k]; return e&&!pdone(e)&&(e.d||0)<=t; }), fresh=open?L.filter(p=>!m[p.k]):[];
  const q=due.slice(0,2); for(const p of fresh){ if(q.length>=5) break; q.push(p); } for(const p of due.slice(2)){ if(q.length>=5) break; q.push(p); }
  return q.map(p=>p.k);
}
const bkStart=(u,o)=>({u, o:o||0, q:bkBundle(u,o), i:0, out:{}, Ps:{}, P:null});

// 묶음의 열쇠는 단원 묶음이면 문제 열쇠, 섞어 풀기면 '단원::문제 열쇠'. P는 자기 단원(u)과 묶음(B)을 지녀서,
// 판정을 기다리는 사이 다른 단원을 열어도 결과가 제 단원에 적힌다(26.11.25 검토).

    B.Ps[ck]={ck, u, k, B, p, base:e?{...e}:null, redo:!!e&&!pdone(e)&&(e.d||0)<=dnum(), imgs:[], wimgs:[], text:'', ans:'', work:'',

async function shrinkImage(file){
  try{
    const bm=await createImageBitmap(file), k=Math.min(1,1600/Math.max(bm.width,bm.height));

    const c=document.createElement('canvas'); c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k);

  }catch(e){ return file; }
}

/* flow: 사진 → 내 답·풀이 → (책 답 맞춰 보기 | Claude 독립 풀이 → 읽은 문제 확인 → 견주기·재판정) → 기록 */
const bkBusy=P=>['solving','judging','checking'].includes(P.phase)||P.hinting;
async function bkSubmit(){
  const sv=UI.study, B=sv?.bk, P=B&&bkCur(B); if(!P||bkBusy(P)||P.phase!=='edit') return;
  // 책 뒤 답과 맞춰 볼 때는 문제를 몰라도 견줄 수 있다(문제 사진은 Claude가 풀거나 힌트를 줄 때만 꼭 필요하다)
  const byBook=P.mode==='book'&&canBook(P);
  if(!byBook&&!P.imgs.length&&!P.text.trim()){ toast('문제 사진을 올리거나 문제를 글로 적어 줘.'); return; }
  if(!P.ans.trim()){ toast('답을 적어 줘.'); $('#bk-ans')?.focus(); return; }
  if(P.redo&&!P.work.trim()&&!P.wimgs.length){ toast('다시 풀기는 풀이도 같이 내야 해. 풀이를 적거나 찍어 줘.'); $('#bk-work')?.focus(); return; }
  P.tries++; P.err=''; P.verdict=null;
  if(P.mode==='book'&&canBook(P)){ P.phase='bookans'; render(); requestAnimationFrame(()=>$('#bk-bookans')?.focus()); return; }
  if(!ENV.sample){ P.tries--; P.err=NOSAMPLE; render(); return; }
  if(P.solve&&P.readOk) return bkJudge(P);
  await bkSolve(P);
}
async function bkSolve(P){
  const ctl=new AbortController(); P.ctl=ctl; P.phase='solving'; P.t0=Date.now(); render();
  try{
    const x=await ENV.sample.json(solvePrompt(P.u,P),{images:P.imgs.map(i=>i.blob), signal:ctl.signal, cache:false});
    if(!x||typeof x.answer!=='string'||!x.answer.trim()) throw {code:'invalid_json'};
    P.solve={read:String(x.read||''), answer:String(x.answer), steps:Array.isArray(x.steps)?x.steps.map(String).slice(0,14):[], key:cleanKey(x.key), conf:+x.confidence||0};
    P.phase='confirm';
  }catch(e){ P.phase='edit'; P.err=sampleErr(e); P.solve=null; P.tries=Math.max(0,P.tries-1); }
  if(UI.study?.bk?.P===P) render();
}
async function bkJudge(P, reason){
  const u=P.u;
  // two answers found apart that agree need no second call, unless the first solver was unsure
  if(!reason&&P.solve.conf>=0.8&&bkSame(P.ans,P.solve.answer)) return bkOutcome(P,'correct','네 답이 Claude가 따로 푼 답과 같아.');
  const ctl=new AbortController(); P.ctl=ctl; P.phase='judging'; P.t0=Date.now(); render();
  try{
    const x=await ENV.sample.json(judgePrompt(u,P,reason),{images:[...P.imgs,...P.wimgs].map(i=>i.blob), signal:ctl.signal, cache:false});
    let v=['correct','wrong','hold'].includes(x?.verdict)?x.verdict:'hold';
    if(v!=='hold'&&(+x.confidence||0)<0.8) v='hold';
    if(reason&&v==='wrong') v='hold';                       // 이의 뒤에도 갈리면 보류(12절 ⑥)
    const g=x?.gap, gap=g&&prereqList(u).includes(g.unit)?{unit:g.unit, o:Math.max(0,Math.min(2,Math.round(+g.objective||0))), why:String(g.why||'')}:null;
    bkOutcome(P,v,String(x?.why||''),gap);
  }catch(e){ P.phase=P.verdict?'done':'edit'; P.err=sampleErr(e); if(!P.verdict) P.tries=Math.max(0,P.tries-1); render(); }
}
async function bkBookCompare(bookAns){
  const sv=UI.study, P=sv?.bk?.P; bookAns=String(bookAns||'').trim(); if(!P||P.phase!=='bookans') return;
  if(!bookAns){ toast('책 답을 적어 줘.'); return; }
  if(bkSame(P.ans,bookAns)) return bkOutcome(P,'correct','책 답과 같아.');
  if(!ENV.sample) return bkOutcome(P,'wrong','책 답과 달라.');
  // a different spelling of the same answer? Claude only decides whether the two are the same
  const ctl=new AbortController(); P.ctl=ctl; P.phase='checking'; P.t0=Date.now(); render();
  try{
    const x=await ENV.sample.json(equivPrompt(P.u,P,bookAns),{images:P.imgs.map(i=>i.blob), signal:ctl.signal, cache:false});
    const v=x?.same==='yes'?'correct':x?.same==='no'?'wrong':'hold';
    bkOutcome(P,v,String(x?.why||'')||(v==='wrong'?'책 답과 달라.':''));
  }catch(e){ P.phase='bookans'; P.err=sampleErr(e); render(); }
}
// the one-line rule: only a first submission without help counts at once; anything else comes back a day later
function bkOutcome(P, v, why, gap){
  const u=P.u, m=bset(u), e={...(m[P.k]||{})};
  e.n=(e.n||0)+1; e.t=Date.now(); if(P.hints) e.h=Math.max(e.h||0,P.hints);
  if(v==='correct') e.s=P.hints?'help':(P.tries===1&&(!P.base||P.redo))?'solo':'self';
  else e.s=v==='hold'?'hold':'wrong';
  // 보류도 내일 다시 나온다(예전에는 다시 나올 길이 없어 숙달이 영영 막혔다, 26.11.25 검토)

  const B=sv.bk, P=mixPool(sv.all), left=sv.all?P.count:Math.min(P.count,mixQuotaLeft()), done=(S.stats.days[dayKey()]||{}).mq||0;
  const bar=`<div class="bk-bar"><div class="bk-bar-h"><span>오늘 섞어 푼 문제 <b class="mono">${done}</b>${sv.all?'':` / 오늘 몫 ${done+left}`}</span><span class="muted">남은 섞어 풀 문제 ${P.count}</span></div></div>`;
  const rule=`<p class="hint">숙달한 단원들의 짝꿍 문제(숙달 문제의 쌍둥이, 대개 짝수 번)를 단원·절을 섞어서 풀어. 몰아 풀 때보다 오래 남아. 판정 규칙은 교재 문제와 같고, ${sv.all?'이 단계의 섞어 풀 문제를 다 풀어야 다음 단계가 열려.':'단계를 닫으려면 그 단계의 섞어 풀 문제까지 모두 혼자 풀어야 해.'}</p>`;
  if(B.q[B.i]) return bkPanel(sv,B,bar,rule);
  const more=sv.all?P.count>0:left>0&&P.count>0, solo=Object.values(B.out).filter(s=>s==='solo').length;
  return `<div class="quiz-wrap">${bar}<div class="card bk-end"><p class="eyebrow">묶음 끝</p><h2>${B.q.length}문제를 섞어 풀었어</h2><p class="muted">이번 묶음에서 혼자 푼 문제 ${solo}개.${more?'':' 오늘 몫은 여기까지야.'}</p><div class="row">${more?'<button type="button" class="btn primary" data-act="bk-more">한 묶음 더</button>':''}<button type="button" class="btn${more?'':' primary'}" data-act="next">이어하기 →</button><button type="button" class="btn ghost" data-act="nav" data-view="today">오늘로</button></div></div>${rule}</div>`;
}

function dropCard(u, cid){
  const items=CARDS[u]; if(!items) return;
  const c=items.find(x=>x.id===cid); if(!c) return;
  if(liveItems(u).length<=3){ toast('카드는 최소 3장은 남겨야 해.'); return; }
  c.x=true; delete cst(u)[cid]; putCards(u); save('cards');
  if(UI.cs){ const h=UI.cs.queue[0]; if(h&&h.u===u&&h.id===cid){ UI.cs.copy=null; UI.cs.revealed=false; UI.cs.typed=''; } if(UI.cs.recall) delete UI.cs.recall[u+'/'+cid]; UI.cs.queue=UI.cs.queue.filter(q=>!(q.u===u&&q.id===cid)); }
  UI.cedit=null; checkCardsDone(u); render(); toast('카드를 뺐어.');
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const act=el.dataset.act, id=el.dataset.id, sv=UI.study, rv=UI.review;
  switch(act){
    case 'nav': UI.sel=null; go(el.dataset.view); break;
    case 'sel': select(id); break;
    case 'close': select(null); break;
    case 'filter': UI.filter=el.dataset.d; UI.filterTouched=true; render(); break;
    case 'learn': openStudy(id,'learn'); break;
    case 'test': openStudy(id,'test'); break;
    case 'back': UI.sel=null; go(UI.prev); break;
    case 'step': if(sv) goStep(sv,el.dataset.step); break;
    case 'regen': if(sv&&!STORED.has(`lessons/${sv.id}`)) loadLesson(sv,true); break;
    case 'reload-lesson': if(sv) loadLesson(sv,false); break;
    case 'stop-lesson': sv?.lesson?.ctl?.abort(); break;
    case 'stop-cards': sv?.cards?.ctl?.abort(); break;
    case 'stop-quiz': sv?.quiz?.ctl?.abort(); break;
    case 'stop-review': rv?.ctl?.abort(); break;
    case 'stop-idea': UI.idea?.ctl?.abort(); break;
    case 'retry-cards': sv.cards=null; loadCards(sv,false,false); break;
    case 'regen-cards': if(sv&&!cardEntries(sv.id).length){ delete CARDS[sv.id]; sv.cards=null; if(UI.cs?.unit===sv.id) UI.cs=null; loadCards(sv,false,true); } break;
    case 'to-lesson': sv.mode='learn'; goStep(sv,'lesson'); break;
    case 'retry-quiz': { const q=sv.quiz;
      if(q?.state==='ready'&&!sv.result){ const miss=[...new Set(q.items.map((it,j)=>{ const x=q.res[j]; return x?.done&&!x.void&&x.score<1?it.obj:-1; }).filter(v=>v>=0))];
        if(miss.length){ const r=ensure(sv.id); r.miss=miss; r.at=(r.at||0)+1; bump('q',q.res.filter(x=>x?.done&&!x.void).length); save('progress'); save('stats'); } }
      sv.quiz=null; sv.result=null; goStep(sv,'quiz'); break; }
    case 'next': UI.sel=null; runNext(); break;
    case 'rd-next': rdNext(); break;
    case 'rd-prev': rdPrev(); break;
    case 'rd-ok': if(sv?.reader){ sv.reader.passed[sv.reader.i]=true; rdNext(); } break;
    case 'rd-again': if(sv?.reader) rdAgain(); break;
    case 'rd-go': if(sv?.reader){ const R=sv.reader, j=+el.dataset.i; if(R.free||j<=R.max){ R.i=j; R.toc=false; R.revealed=false; R.typed=''; paintLesson(); scrollToReader(); } } break;
    case 'rd-toc': if(sv?.reader){ sv.reader.toc=!sv.reader.toc; paintLesson(); } break;
    case 'fix-note': sendFix(); break;
    case 'rd-whole': if(sv?.reader){ sv.reader.whole=!sv.reader.whole; paintLesson(); scrollToReader(); } break;
    case 'cg': gradeCard(+el.dataset.g); break;
    case 'card-edit': UI.cedit={u:el.dataset.u, id:el.dataset.c, list:!!el.dataset.list}; render(); { const f=$('#ce-a'); if(f) f.focus(); } break;
    case 'card-edit-cancel': UI.cedit=null; render(); focusCard(); break;
    case 'card-drop': dropCard(el.dataset.u, el.dataset.c); break;
    case 'card-review': startCardReview(); break;
    case 'q-pick': { const q=sv.quiz; (q.res[q.i] ||= {}).pick=+el.dataset.i; render(); break; }
    case 'q-submit': { const q=sv.quiz, it=q.items[q.i], r=(q.res[q.i] ||= {}); if(r.pick==null) break;
      r.choice=r.pick; r.score=r.choice===it.answer?1:0; r.done=true;
      if(!r.score) logMistake(sv.id,it.q,`${MARKS[r.choice]} ${it.choices[r.choice]}`,`${MARKS[it.answer]} ${it.choices[it.answer]}`,it.why);
      render(); if(!r.score) focusCopy(); break; }
    case 'q-void': { const q=sv.quiz, r=q.res[q.i]; if(!r) break; r.void=true;
      // 은행 문제를 빼면 고칠 점으로 남겨 Claude가 은행을 고치게 한다
      { const it=q.items[q.i]; if(it.bid&&ENV.db) ENV.db.collection('fixes').add({u:sv.id, no:NODE[sv.id].no, title:NODE[sv.id].t, page:0, of:0, sec:'확인 문제 은행', at:it.bid, text:`확인 문제 ${it.bid}를 채점에서 뺐어. 문제나 정답을 확인해 줘.`, q:String(it.q).slice(0,1000), a:String(r.val??r.choice??'').slice(0,500), state:'open', reply:'', ts:Date.now()}).catch(()=>{}); } const qt=String(q.items[q.i].q).slice(0,500); S.mistakes.items=S.mistakes.items.filter(m=>!(m.n===sv.id&&m.q===qt)); save('mistakes'); render(); toast('이 문제는 채점에서 뺐어.'); break; }
    case 'q-next': { const q=sv.quiz; if(needCopy(q.items[q.i],q.res[q.i])){ toast('먼저 핵심을 따라 써.'); focusCopy(); break; } if(q.i>=q.items.length-1) finishQuiz(); else { q.i++; render(); } break; }
    case 'bk-go': bkSubmit(); break;
    case 'bk-read-ok': { const P=sv?.bk?.P; if(P?.solve&&P.phase==='confirm'){ P.readOk=true; bkJudge(P); } break; }
    case 'bk-read-no': { const P=sv?.bk?.P; if(P&&P.phase==='confirm'){ P.solve=null; P.readOk=false; P.phase='edit'; P.tries=Math.max(0,P.tries-1); P.err='이 문제만 크게 다시 찍거나, 문제를 글로 적어 줘.'; render(); } break; }
    case 'bk-to-claude': { const P=sv?.bk?.P; if(P&&P.phase==='bookans'){ P.mode='claude'; P.phase='edit'; P.tries=Math.max(0,P.tries-1); bkSubmit(); } break; }
    case 'bk-again': { const P=sv?.bk?.P; if(P?.phase==='done'&&P.verdict?.v==='wrong'){ P.phase='edit'; P.verdict=null; P.appeal=false; render(); requestAnimationFrame(()=>$('#bk-ans')?.focus()); } break; }
    case 'bk-appeal': { const P=sv?.bk?.P; if(P?.phase==='done'){ P.appeal=!P.appeal; render(); if(P.appeal) requestAnimationFrame(()=>$('#bk-why')?.focus()); } break; }
    case 'bk-next': bkNext(); break;
    case 'bk-more': if(sv?.mode==='mix'){ const q=mixBundle(sv.all); if(!q.length){ toast('지금 섞어 풀 문제가 없어.'); break; } sv.bk={u:null, mix:true, o:0, q, i:0, out:{}, Ps:{}, P:null}; render(); window.scrollTo(0,0); }
      else if(sv){ sv.bk=bkStart(sv.id,sv.bk?.o); render(); window.scrollTo(0,0); } break;
    case 'bk-obj': openObjBook(sv,+el.dataset.o); break;
    case 'bk-read': backToLesson(sv); break;
    case 'g-play': gPlay(el.dataset.g, el.dataset.gv); break;
    case 'bk-later': bkLater(); break;
    case 'bk-hint': bkHint(); break;
    case 'bk-hint-no': { const P=sv?.bk?.P; if(P){ P.hintAsk=false; render(); } break; }
    case 'bk-stop': sv?.bk?.P?.ctl?.abort(); break;
    case 'bk-img-del': { const P=sv?.bk?.P; if(P&&P.phase==='edit'){ const L=el.dataset.w==='1'?P.wimgs:P.imgs, x=L.splice(+el.dataset.i,1)[0]; if(x) URL.revokeObjectURL(x.url); render(); } break; }
    case 'bk-calc': { const C=(UI.calc ||= {open:false, lines:[], scope:{}, draft:''}); C.open=!C.open;
      if(C.open&&!C.ready){ C.loading=true; loadMath().then(()=>{ C.ready=true; C.loading=false; render(); requestAnimationFrame(()=>$('#bk-calc-in')?.focus()); },()=>{ C.loading=false; C.open=false; toast('계산기를 불러오지 못했어. 연결을 확인해 줘.'); render(); }); }
      render(); break; }
    case 'review': startReview(); break;
    case 'review-one': startReview([id]); break;
    case 'retry-review': genReview(rv); break;
    case 'rv-pick': (rv.res[rv.i] ||= {}).pick=+el.dataset.i; render(); break;
    case 'rv-submit': { const it=rv.items[rv.i], r=rv.res[rv.i]; if(r?.pick==null) break; reviewAnswer(r.pick===it.answer, el.dataset.sure==='1'); break; }
    case 'rv-next': if(needCopy(rv.items[rv.i],rv.res[rv.i])){ toast('먼저 핵심을 따라 써.'); focusCopy(); break; } if(rv.i>=rv.items.length-1){ rv.state='done'; } else rv.i++; render(); window.scrollTo(0,0); break;
    case 'card-giveup': cardRecall('',true); break;
    case 'idea': runIdea(el.dataset.k); break;
    case 'mr-show': if(UI.mr){ UI.mr.typed=$('#mr-try')?.value||''; UI.mr.revealed=true; render(); } break;
    case 'mr-grade': misGrade(el.dataset.v==='1'); break;
    case 'idea-skip': { const k=el.dataset.k; (S.stats.ideas ||= {})[k]={...(S.stats.ideas[k]||{}), n:ideaKnown(k), at:Date.now()}; save('stats'); runNext(); } break;
    case 'mis-del': S.mistakes.items=S.mistakes.items.filter(m=>m.id!==el.dataset.k); save('mistakes'); render(); break;
    case 'reset-ask': UI.resetAsk=true; render(); break;
    case 'reset-no': UI.resetAsk=false; render(); break;
    case 'reset-do': S.profile=null; S.progress={nodes:{}}; S.cards={u:{}}; S.stats={days:{}}; S.mistakes={items:[]}; for(const t of [1,2,3,4]) S['book'+t]={u:{}}; DOCS.forEach(save); UI.resetAsk=false; UI.cs=null; go('today'); toast('학습 기록을 모두 지웠어.'); break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target; e.preventDefault();
  if(f.id==='ob-form'){
    const fd=new FormData(f);
    S.profile={focus:fd.get('focus')||'all', goal:+(fd.get('goal')||60), started:Date.now()};
    save('profile'); render(); window.scrollTo(0,0);
    return;
  }
  if(f.id==='chat-form'){ const t=$('#chat-input'); const v=t.value; t.value=''; sendChat(v); return; }
  if(f.id==='chk-form'){ const R=UI.study?.reader; if(R){ R.typed=$('#chk-typed')?.value.trim()||''; R.revealed=true; paintLesson(); } return; }
  if(f.id==='reveal-form'){ if(UI.cs){ UI.cs.typed=$('#card-typed')?.value.trim()||''; UI.cs.revealed=true; render(); } return; }
  if(f.id==='card-copy-form'){ cardCopy($('#card-copy')?.value||''); return; }
  if(f.id==='card-recall-form'){ cardRecall($('#card-recall')?.value||'',false); return; }
  if(f.id==='copy-form'){
    const ns=f.dataset.ns, box=ns==='q'?UI.study?.quiz:UI.review; if(!box?.items) return;
    const it=box.items[box.i], r=box.res[box.i]; if(!needCopy(it,r)) return;
    if(!sameKey(f.querySelector('.copy-in')?.value||'',itemKey(it))){ toast('아직 달라. 보이는 그대로 써 봐.'); return; }
    r.copied=true; render(); requestAnimationFrame(()=>$(`[data-act="${ns}-next"]`)?.focus({preventScroll:true}));
    return;
  }
  if(f.id==='bk-book-form'){ bkBookCompare($('#bk-bookans')?.value||''); return; }
  if(f.id==='bk-calc-form'){ const v=$('#bk-calc-in')?.value||''; if(UI.calc) UI.calc.draft=''; calcRun(v); return; }
  if(f.id==='bk-copy-form'){
    const P=UI.study?.bk?.P; if(!P) return;
    if(!sameKey(f.querySelector('.copy-in')?.value||'',f.dataset.key)){ toast('아직 달라. 보이는 그대로 써 봐.'); return; }
    P.copied=true; render(); requestAnimationFrame(()=>$('[data-act="bk-next"]')?.focus({preventScroll:true})); return;
  }
  if(f.id==='bk-appeal-form'){
    const P=UI.study?.bk?.P, why=$('#bk-why')?.value.trim()||''; if(!P) return;
    if(!why){ toast('이유를 한 줄 적어 줘.'); return; }
    P.appeal=false; if(P.solve) bkJudge(P, why); else bkOutcome(P,'hold',`이의: ${why}`); return;
  }
  if(f.id==='card-edit-form'){
    const u=f.dataset.u, c=(CARDS[u]||[]).find(x=>x.id===f.dataset.c); if(!c) return;
    const q=f.elements.q.value.trim(), a=f.elements.a.value.trim();
    if(!q||!a){ toast('앞면과 뒷면은 비울 수 없어.'); return; }
    c.q=q; c.a=a; c.t=deTex(f.elements.t.value).slice(0,150); c.h=f.elements.h.value.trim(); putCards(u); UI.cedit=null; render(); focusCard(); toast('카드를 고쳤어.');
    return;
  }
  if(f.classList.contains('ans-form')){
    const ns=f.dataset.ns, kind=f.dataset.kind;
    if(kind==='short'){ gradeShort(UI.study,f.elements.short.value); return; }
    const raw=f.elements.num.value, v=parseNum(raw);
    if(isNaN(v)){ toast('숫자로 써 줘. 예: 12.5, 3e8, 6.0×10^23'); return; }
    if(ns==='q'){
      const sv=UI.study, q=sv.quiz, it=q.items[q.i], r=(q.res[q.i] ||= {});
      r.val=raw; r.score=Math.abs(v-it.answer)<=Math.max(Math.abs(it.answer)*it.tol,1e-12)?1:0; r.done=true;
      if(!r.score) logMistake(sv.id,it.q,`${raw} ${it.unit}`,`${fmtNum(it.answer)} ${it.unit}`,it.why);
      render(); if(!r.score) focusCopy();
    } else {
      const it=UI.review.items[UI.review.i];
      // Enter로 낸 것(submitter 없음)은 '확신하고 제출'로 치지 않는다
      reviewAnswer(Math.abs(v-it.answer)<=Math.max(Math.abs(it.answer)*it.tol,1e-12), !!e.submitter&&e.submitter.value==='1', raw);
    }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.type==='file'&&(t.id==='bk-img'||t.id==='bk-wimg')){ bkAddImages(t.id==='bk-wimg', t.files); t.value=''; return; }
  if(t.name==='bk-mode'){ const P=UI.study?.bk?.P; if(P) P.mode=t.value; return; }
  if(!S.profile||t.type!=='radio') return;
  if(t.name==='pf-focus'){ S.profile.focus=t.value; save('profile'); }
  else if(t.name==='pf-goal'){ S.profile.goal=+t.value; delete S.profile.daily; save('profile'); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.sel){ select(null); return; }
  if(e.isComposing||e.keyCode===229) return; // 한글 조합 중의 Enter는 글자를 끝내는 키다
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chat-input'){ e.preventDefault(); $('#chat-form').requestSubmit(); return; }
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const rdOn=UI.view==='study'&&UI.study?.step==='lesson'&&UI.study.reader&&!UI.study.reader.whole;
  if(rdOn&&!inField&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==='ArrowLeft'){ e.preventDefault(); rdPrev(); return; }
    if(e.key==='ArrowRight'||((e.key===' '||e.key==='Enter')&&!/^(BUTTON|A|SUMMARY)$/.test(e.target.tagName))){ e.preventDefault(); const b=$('.rd-next'); if(b&&!b.disabled) rdNext(); return; }
  }
  // 1·2·3은 지금 화면에 보이는 카드에만(다른 단원·복습의 숨은 카드를 채점하지 않게)
  const cs=UI.cs, cardOn=cs&&cs.queue?.length&&!UI.cedit&&((UI.view==='cards'&&cs.mode==='review')||(UI.view==='study'&&UI.study?.step==='cards'&&cs.mode==='learn'&&cs.unit===UI.study.id));
  if(!cardOn||e.metaKey||e.ctrlKey||e.altKey) return;
  if(!UI.cs.revealed){ if(!inField&&e.target.tagName!=='BUTTON'&&$('#reveal-form')&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); $('#reveal-form').requestSubmit(); } return; }
  if(!inField&&['1','2','3'].includes(e.key)){ e.preventDefault(); gradeCard(+e.key); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='chk-typed'&&UI.study?.reader) UI.study.reader.typed=e.target.value;
  { const P=UI.study?.bk?.P, f={'bk-ans':'ans','bk-work':'work','bk-text':'text','bk-hl':'hintLine'}[e.target.id]; if(P&&f) P[f]=e.target.value; }
  if(e.target.id==='bk-calc-in'&&UI.calc) UI.calc.draft=e.target.value;
  if(e.target.classList?.contains('copy-in')){ const f=e.target.form; if(f) f.classList.toggle('ok',sameKey(e.target.value,f.dataset.key)); }
});
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(ROUTES.includes(h)&&h!==UI.view){ UI.view=h; render(); } });
let rsT; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(UI.view==='map') drawLinks(); },120); });
setInterval(()=>{ document.querySelectorAll('[data-t0]').forEach(el=>{ const o=el.querySelector('.el'); if(o) o.textContent=Math.max(0,Math.round((Date.now()-(+el.dataset.t0))/1000))+'초'; }); },1000);

{ const h=location.hash.slice(1); if(ROUTES.includes(h)) UI.view=h; }
READY=boot();
