<title>과학고양</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{
  /* Layout: sticky top bar + one working column. The unit map is a periodic-table grid: 5 domain blocks (19 tile columns) x 4 tiers. */
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9;
  --ink:#111923; --ink-2:#465364; --ink-3:#7C8998; --line:#D0D7E0; --line-2:#E2E7ED;
  --focus:#1F5EFF; --on-fill:#FFFFFF;
  --d-f:#5A687B; --d-p:#2A58D6; --d-c:#C25F0C; --d-b:#1D8653; --d-e:#7444C2;
  --good:#1B8348; --warn:#A5680F; --bad:#C2352A;
  --shadow:0 12px 32px rgb(16 26 38 / .14);
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-read:"Noto Serif KR","AppleMyungjo","Batang",serif;
  --font-mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1218; --surface:#151C25; --surface-2:#1B2430;
  --ink:#E4EBF3; --ink-2:#A3AFBD; --ink-3:#6E7B8A; --line:#2B3644; --line-2:#222C38;
  --focus:#7FA4FF; --on-fill:#0D1218;
  --d-f:#98A6B8; --d-p:#7495FF; --d-c:#F09A4E; --d-b:#4FC68A; --d-e:#B391F2;
  --good:#4CC57E; --warn:#E3AA3E; --bad:#F06C60;
  --shadow:0 12px 32px rgb(0 0 0 / .5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#151C25; --surface-2:#1B2430;
  --ink:#E4EBF3; --ink-2:#A3AFBD; --ink-3:#6E7B8A; --line:#2B3644; --line-2:#222C38;
  --focus:#7FA4FF; --on-fill:#0D1218;
  --d-f:#98A6B8; --d-p:#7495FF; --d-c:#F09A4E; --d-b:#4FC68A; --d-e:#B391F2;
  --good:#4CC57E; --warn:#E3AA3E; --bad:#F06C60;
  --shadow:0 12px 32px rgb(0 0 0 / .5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
h1,h2,h3{text-wrap:balance}
kbd{font:500 10.5px/1 var(--font-mono); padding:2px 4px; border:1px solid currentColor; border-radius:3px; opacity:.6}

/* top bar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1440px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; align-items:center; gap:20px; min-height:58px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; font:700 16px/1 var(--font-ui); color:var(--ink); background:none; border:0; padding:0; cursor:pointer; white-space:nowrap}
.brand-tile{position:relative; width:32px; height:35px; border:1.5px solid var(--ink); border-radius:3px; display:grid; place-items:center; font:700 14px/1 var(--font-ui); padding-top:4px}
.brand-tile i{position:absolute; top:3px; left:4px; font:500 8px/1 var(--font-mono); font-style:normal}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin-left:auto; max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; border:0; background:none; padding:9px 12px; font:500 14px/1 var(--font-ui); color:var(--ink-2); border-radius:6px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
.tab:hover{color:var(--ink); background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--ink); font-weight:600; box-shadow:inset 0 -2px 0 var(--ink); border-radius:6px 6px 0 0}
.badge{font:600 11px/1 var(--font-mono); padding:3px 6px; border-radius:99px; background:var(--warn); color:var(--surface)}
@media (max-width:720px){ .tabs{margin-left:0; width:100%; padding-bottom:4px} .topbar-in{gap:6px; padding-block:10px 0} }
.banner{background:color-mix(in srgb,var(--warn) 13%,var(--surface)); border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,var(--surface)); font-size:13.5px; color:var(--ink)}
.banner-in{max-width:1440px; margin:0 auto; padding-block:9px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}

main{max-width:1240px; margin:0 auto; padding-block:28px 72px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
main.view-map{max-width:1480px}

/* type */
h1{font:700 clamp(25px,3vw,33px)/1.25 var(--font-ui); letter-spacing:-.015em; margin:0}
.eyebrow{font:500 12px/1.4 var(--font-mono); letter-spacing:.05em; color:var(--ink-3); margin:0 0 8px}
.lede{color:var(--ink-2); max-width:64ch; margin:10px 0 0; font-size:15.5px}
.hint{font-size:13px; color:var(--ink-3); margin:8px 0 0}
.label{font:600 12px/1.4 var(--font-ui); color:var(--ink-3); letter-spacing:.03em; margin:0 0 8px; display:block}
.pagehead{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px}

/* controls */
.btn{appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 14px/1.2 var(--font-ui); padding:11px 16px; border-radius:7px; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 84%,var(--surface))}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px; font-size:13px}
.btn.danger{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.linkbtn{appearance:none; background:none; border:0; padding:0; font:500 13px/1.4 var(--font-ui); color:var(--ink-3); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:16px}
.pill{display:inline-flex; align-items:center; font:600 11.5px/1 var(--font-ui); padding:5px 8px; border-radius:99px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line-2); white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 13%,var(--surface)); color:var(--good); border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface)); color:var(--warn); border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface)); color:var(--bad); border-color:transparent}
.note{padding:12px 14px; border-radius:8px; background:var(--surface-2); color:var(--ink-2); font-size:14px; margin:0 0 12px}
.note.bad{background:color-mix(in srgb,var(--bad) 9%,var(--surface)); color:var(--ink)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:22px}
.busy{display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px dashed var(--line); border-radius:8px; color:var(--ink-2); font-size:14px; flex-wrap:wrap; background:var(--surface)}
.busy .el{color:var(--ink-3); font-size:12.5px}
.spin{display:inline-block; width:15px; height:15px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--ink); animation:spin .9s linear infinite; flex:none; vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:11px 16px; border-radius:8px; font-size:14px; z-index:60; max-width:calc(100% - 32px); box-shadow:var(--shadow)}
textarea,input[type="text"],input:not([type]){width:100%; font:15px/1.6 var(--font-ui); color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:8px; padding:10px 12px; resize:vertical}
textarea:focus,input:focus{outline:none; border-color:var(--ink)}

/* element tiles */
.tile{--dc:var(--d-f); position:relative; width:var(--tw,68px); height:var(--th,76px); display:flex; flex-direction:column; justify-content:space-between; padding:5px 6px 6px; border-radius:4px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink-3); font-family:var(--font-ui); text-align:left; cursor:pointer; transition:opacity .15s, transform .15s, border-color .15s}
button.tile:hover{transform:translateY(-1px); border-color:var(--dc)}
.t-no{font:500 10px/1 var(--font-mono)}
.t-sym{font:700 calc(var(--tw,68px) * .33)/1 var(--font-ui); letter-spacing:-.02em}
.t-name{font:500 10px/1.15 var(--font-ui); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.t-due{position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--warn); box-shadow:0 0 0 2px var(--surface)}
.tile.s-locked{border-style:dashed}
.tile.s-ready{border-color:var(--dc); background:var(--surface); color:var(--ink)}
.tile.s-ready .t-sym{color:var(--dc)}
.tile.s-learning{border-color:var(--dc); color:var(--ink); background:linear-gradient(to top,color-mix(in srgb,var(--dc) 26%,var(--surface)) 50%,var(--surface) 50%)}
.tile.s-learning .t-sym{color:var(--dc)}
.tile.s-mastered,.tile.s-shaky,.tile.s-solid{border-color:var(--dc); background:var(--dc); color:var(--on-fill)}
.tile.s-solid{box-shadow:inset 0 0 0 2px var(--dc), inset 0 0 0 3.5px var(--on-fill)}
.tile.s-shaky::after{content:""; position:absolute; left:-1.5px; bottom:-1.5px; border-style:solid; border-width:14px 0 0 14px; border-color:transparent transparent transparent var(--bad)}
.tile.lg{--tw:104px; --th:116px; cursor:default; padding:8px 10px 10px; flex:none}
.tile.lg .t-no{font-size:12px}
.tile.lg .t-name{font-size:12px}
.tile.lg .t-due{top:8px; right:8px}
.tile.lg.s-solid{box-shadow:inset 0 0 0 3px var(--dc), inset 0 0 0 5px var(--on-fill)}

.chip{--dc:var(--d-f); display:inline-flex; align-items:center; gap:8px; padding:3px 10px 3px 3px; border:1px solid var(--line); border-radius:6px; background:var(--surface); font:500 13px/1.3 var(--font-ui); color:var(--ink); cursor:pointer; max-width:100%; text-align:left}
.chip:hover{border-color:var(--dc)}
.chip .c-sym{width:27px; height:27px; border-radius:4px; display:grid; place-items:center; font:700 11.5px/1 var(--font-ui); border:1.5px solid var(--dc); color:var(--dc); flex:none; background:var(--surface)}
.chip .c-t{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip small{display:block; font-size:11px; color:var(--ink-3)}
.chip.s-mastered .c-sym,.chip.s-shaky .c-sym,.chip.s-solid .c-sym{background:var(--dc); color:var(--on-fill)}
.chip.s-solid .c-sym{box-shadow:inset 0 0 0 1.5px var(--on-fill)}
.chip.s-shaky .c-sym{box-shadow:inset -4px -4px 0 -2px var(--bad)}
.chip.s-learning .c-sym{background:linear-gradient(to top,color-mix(in srgb,var(--dc) 30%,var(--surface)) 50%,var(--surface) 50%)}
.chip.s-locked .c-sym{border-style:dashed; border-color:var(--line); color:var(--ink-3)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.more{align-self:center; font-size:13px; color:var(--ink-3)}

/* today */
.today-grid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start}
.col{display:grid; gap:20px; min-width:0}
@media (max-width:920px){ .today-grid{grid-template-columns:minmax(0,1fr)} }
.step-h{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.step-h h2{font:700 18px/1.2 var(--font-ui); margin:0}
.step-h .pill{margin-left:auto}
.step-n{font:600 12px/1 var(--font-mono); width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ink); display:grid; place-items:center; flex:none}
.newc{display:grid; grid-template-columns:auto minmax(0,1fr); gap:22px; align-items:start}
@media (max-width:520px){ .newc{grid-template-columns:minmax(0,1fr)} }
.newc-t{font:700 22px/1.3 var(--font-ui); margin:0}
.newc-q{font:600 17px/1.6 var(--font-read); color:var(--ink-2); margin:6px 0 12px}
.objs-mini{margin:0; padding-left:1.15em; color:var(--ink-2); font-size:14px}
.objs-mini li{margin:3px 0}
.phase{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0; padding:0; list-style:none; font-size:12.5px}
.phase li{padding:4px 9px; border-radius:99px; border:1px solid var(--line); color:var(--ink-3)}
.phase li.done{border-color:transparent; background:color-mix(in srgb,var(--good) 13%,var(--surface)); color:var(--good)}
.phase li.on{border-color:var(--ink); color:var(--ink); font-weight:600}
.alt{margin-top:20px; padding-top:16px; border-top:1px solid var(--line-2)}
.hero{border-color:color-mix(in srgb,var(--ink) 45%,var(--line))}
.next-t{font:700 22px/1.35 var(--font-ui); margin:0}
.next-s{font:600 16px/1.6 var(--font-read); color:var(--ink-2); margin:6px 0 0}
.strip{display:flex; gap:4px; overflow-x:auto; padding:6px 4px 10px; margin:18px -4px 0; --tw:58px; --th:64px}
.strip .tile{flex:none}
.lprog{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; font-size:12.5px; color:var(--ink-2); margin-top:6px}
.side h3{font:700 15px/1.3 var(--font-ui); margin:0 0 14px}
.big-line{margin:0 0 14px; font-size:14px; color:var(--ink-2)}
.big-line b{font-size:26px; color:var(--ink); font-weight:600; margin-right:2px}
.prows{display:grid; gap:10px}
.prow{display:grid; grid-template-columns:74px minmax(0,1fr) 44px; gap:10px; align-items:center; font-size:13px}
.prow.cur span:first-child{font-weight:700}
.pr-c{text-align:right; color:var(--ink-2); font-size:12px}
.dbar{display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--line-2)}
.dbar i{display:block; height:100%}
.dbar .s{background:var(--ink)}
.dbar .m{background:color-mix(in srgb,var(--ink) 55%,var(--surface))}
.dbar .l{background:color-mix(in srgb,var(--ink) 22%,var(--surface))}
.legend-s{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; font-size:12px; color:var(--ink-3)}
.legend-s span{display:inline-flex; align-items:center; gap:5px}
.sw{display:inline-block; width:10px; height:10px; border-radius:2px}
.sw.s{background:var(--ink)}
.sw.m{background:color-mix(in srgb,var(--ink) 55%,var(--surface))}
.sw.l{background:color-mix(in srgb,var(--ink) 22%,var(--surface))}
.act{display:grid; grid-template-columns:repeat(14,1fr); gap:4px; align-items:end; height:78px; border-bottom:1px solid var(--line)}
.act-col{position:relative; display:flex; flex-direction:column-reverse; height:100%}
.act-col i{display:block; width:100%; border-radius:2px 2px 0 0}
.act-col .a-q{background:var(--ink)}
.act-col .a-k{background:color-mix(in srgb,var(--ink) 30%,var(--surface))}
.act-col .a-n{position:absolute; top:-2px; left:50%; transform:translateX(-50%); font:600 10px/1 var(--font-mono); color:var(--good)}
.act-x{display:flex; justify-content:space-between; font:500 11px/1 var(--font-mono); color:var(--ink-3); margin-top:6px}
.sw.a-q{background:var(--ink)}
.sw.a-k{background:color-mix(in srgb,var(--ink) 30%,var(--surface))}

/* onboarding */
.onboard{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:32px; align-items:start}
@media (max-width:920px){ .onboard{grid-template-columns:minmax(0,1fr)} }
.onboard h1{font-size:clamp(26px,3.4vw,36px)}
.loop{list-style:none; padding:0; margin:26px 0 0; display:grid; gap:2px; counter-reset:lp}
.loop li{display:grid; grid-template-columns:30px 54px minmax(0,1fr); gap:10px; align-items:baseline; padding:12px 0; border-top:1px solid var(--line); counter-increment:lp}
.loop li::before{content:counter(lp); font:600 13px/1 var(--font-mono); color:var(--ink-3)}
.loop span{color:var(--ink-2); font-size:14.5px}
.mini-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:22px}
fieldset{border:0; padding:0; margin:0 0 20px; min-width:0}
legend{font:700 14.5px/1.3 var(--font-ui); margin-bottom:10px; padding:0}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{position:relative; display:block}
.opt input{position:absolute; opacity:0; pointer-events:none}
.opt-b{display:flex; flex-direction:column; gap:2px; padding:10px 13px; border:1.5px solid var(--line); border-radius:8px; cursor:pointer; background:var(--surface); font-size:14px}
.opt input:checked + .opt-b{border-color:var(--ink); background:var(--surface-2)}
.opt input:focus-visible + .opt-b{outline:2px solid var(--focus); outline-offset:2px}

/* map */
.map-tools{display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px 24px; align-items:center; margin-bottom:18px}
.filters{display:flex; flex-wrap:wrap; gap:6px}
.fbtn{--dc:var(--ink); display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font:500 13px/1 var(--font-ui); cursor:pointer}
.fbtn i{width:9px; height:9px; border-radius:2px; background:var(--dc)}
.fbtn[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); font-weight:600}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--ink-3); align-items:center}
.legend span{display:inline-flex; align-items:center; gap:6px}
.lgd{--dc:var(--ink-2); display:inline-block; width:14px; height:15px; border-radius:2px; border:1.5px solid var(--line); background:var(--bg)}
.lgd.s-locked{border-style:dashed}
.lgd.s-ready{border-color:var(--dc); background:var(--surface)}
.lgd.s-learning{border-color:var(--dc); background:linear-gradient(to top,color-mix(in srgb,var(--dc) 35%,var(--surface)) 50%,var(--surface) 50%)}
.lgd.s-mastered{border-color:var(--dc); background:var(--dc)}
.lgd.s-solid{border-color:var(--dc); background:var(--dc); box-shadow:inset 0 0 0 1.5px var(--surface)}
.lgd.s-shaky{border-color:var(--dc); background:linear-gradient(45deg,var(--bad) 30%,var(--dc) 30%)}
.lg-due{width:8px; height:8px; border-radius:50%; background:var(--warn)}
.pt-wrap{--tg:4px; --tierw:46px; --tw:clamp(54px, calc((min(100vw, 1480px) - 56px - var(--tierw) - 70px - 14 * var(--tg)) / 19), 74px); --th:calc(var(--tw) * 1.12); position:relative; overflow-x:auto; padding:4px 4px 10px; margin-inline:-4px}
.pt{position:relative; z-index:1; display:grid; column-gap:14px; row-gap:16px; width:max-content}
.pt-links{position:absolute; top:0; left:0; pointer-events:none; z-index:0; overflow:visible}
.lk{fill:none; stroke-width:1.7}
.lk.pre{stroke:var(--ink-2); stroke-dasharray:4 3}
.lk.post{stroke:var(--ink)}
.pt-dh{--dc:var(--ink); border-top:3px solid var(--dc); padding-top:7px; display:flex; justify-content:space-between; align-items:baseline; gap:6px; font:700 13px/1.2 var(--font-ui); white-space:nowrap}
.pt-dh .mono{font-weight:500; font-size:11.5px; color:var(--ink-3)}
.pt-tier{display:flex; flex-direction:column; gap:3px; padding-top:6px; border-top:1px solid var(--line)}
.pt-tier b{font:600 22px/1 var(--font-mono)}
.pt-tier span{font-size:11px; color:var(--ink-3)}
.pt-cell{display:grid; gap:var(--tg); align-content:start}
.pt.has-sel .tile{opacity:.3}
.pt.has-sel .tile.rel{opacity:1}
.tile.sel{outline:2.5px solid var(--ink); outline-offset:2px}

/* drawer */

const GREEK_NAME={}; for(const [k,v] of Object.entries(GREEK)) if(!GREEK_NAME[v]) GREEK_NAME[v]=k.replace(/^var/,'');
function texPlain(t){
  t=t.replace(/\\([A-Za-z]+)/g,(m,w)=>GREEK[w]??TEXSYM[w]??m); // symbols first, before unwrapping glues letters onto them (\circ\text{C})
  for(let i=0,prev='';i<8&&prev!==t;i++){ // innermost braces first, so nested fractions and scripts unwrap
    prev=t;
    t=t.replace(/\\(?:mathrm|text|textrm|mathbf|mathit|mathsf|operatorname|vec|boldsymbol|bar|hat|tilde|dot|ddot|overline|underline)\s*\{([^{}]*)\}/g,'$1')
      .replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(m,a,b)=>[a,b].map(x=>/^[^\s+\-−=/]+$/.test(x)?x:`(${x})`).join('/'))
      .replace(/\\sqrt\s*\{([^{}]*)\}/g,'√($1)')
      .replace(/([_^])\{([^{}]*)\}/g,'$1$2');
  }
  return t.replace(/\\([A-Za-z]+)/g,(m,w)=>GREEK[w]??TEXSYM[w]??w)
    .replace(/\\[,;:! ]/g,' ').replace(/\\\\/g,' ').replace(/\\([%#&])/g,'$1').replace(/[{}]/g,'').replace(/([_^])\s+/g,'$1');
}
function deTex(s){
  return String(s||'')
    .replace(/\$\$?([^$]+)\$\$?/g,(m,t)=>texPlain(t))
    .replace(/\[\[([a-z]-[a-z]+)(?:\|([^\]]+))?\]\]/g,(m,id,l)=>l||NODE[id]?.t||id)
    .replace(/\*\*|__|`/g,'').replace(/\s+/g,' ').trim();
}

  let x=String(s||'').normalize('NFKC');

    .replace(/[−–—]/g,'-').replace(/[×*]/g,'x')
    .replace(/\.(?!\d)/g,'')

    while(stack.length){ const x=stack.pop(); for(const p of NODE[x].pre){ if(!feeds.has(p)){ feeds.add(p); stack.push(p); } } }
  }
  const ratio={};
  for(const d of DKEYS){ const ns=NODES.filter(n=>n.d===d); ratio[d]=ns.filter(n=>known(n.id)).length/ns.length; }
  const grp=n=> st(n.id)==='learning'?0 : focus==='all'?1 : n.d===focus?1 : feeds.has(n.id)?2 : 3;
  return pool.sort((a,b)=>grp(a)-grp(b)||a.tier-b.tier||(focus==='all'?ratio[a.d]-ratio[b.d]:0)||a.no-b.no);
}

/* mastery and spaced repetition */
function applyCheck(id, score, missed){
  const lockedBefore=new Set(NODES.filter(n=>st(n.id)==='locked').map(n=>n.id));
  const r=ensure(id); r.at=(r.at||0)+1; r.sc=score; r.ls=Date.now();
  const wasKnown=known(id), passed=score>=PASS-1e-9;
  if(passed){ r.s='mastered'; r.rp=Math.max(1,r.rp||0); r.iv=Math.max(3,r.iv||0); r.ez=r.ez||2.5; r.nx=dayStart()+r.iv*DAY; r.ma=r.ma||Date.now(); r.miss=[]; }
  else { if(known(id)){ r.s='shaky'; r.nx=dayStart()+DAY; } else r.s='learning'; r.miss=missed; }
  if(passed&&!wasKnown) bump('n');
  const unlocked=NODES.filter(n=>lockedBefore.has(n.id)&&st(n.id)==='ready').map(n=>n.id);
  save('progress'); save('stats');
  return {passed, unlocked};
}
function onReview(id, correct, sure){
  const r=ensure(id); r.ls=Date.now();
  if(!correct){ r.lp=(r.lp||0)+1; r.ez=Math.max(1.3,(r.ez||2.5)-0.2); r.rp=0; r.iv=1; r.s='shaky'; r.nx=dayStart()+DAY; return; }
  r.rp=(r.rp||0)+1;
  if(sure){ r.ez=Math.min(3,(r.ez||2.5)+0.05); r.iv=Math.max((r.iv||1)+1,Math.round((r.iv||1)*r.ez)); }
  else { r.ez=Math.max(1.3,(r.ez||2.5)-0.15); r.iv=Math.max(1,Math.round((r.iv||1)*1.2)); }
  r.s='mastered'; r.nx=dayStart()+r.iv*DAY;
}
function applyCardReview(m,id,g){
  let [iv,ez,,rp,lp]=m[id]||[1,2.5,dnum(),0,0];
  if(g===1){ lp++; ez=Math.max(1.3,ez-0.2); iv=1; rp=0; }
  else if(g===2){ ez=Math.max(1.3,ez-0.15); iv=Math.max(1,Math.round(iv*1.2)); rp++; }
  else { iv=Math.max(iv+1,Math.round(iv*ez)); rp++; }
  m[id]=[iv,+ez.toFixed(2),dnum()+iv,rp,lp];
}

/* ============ markdown + math ============ */
function tex(s,d){
  try{ if(window.katex) return katex.renderToString(String(s),{displayMode:d, output:'mathml', throwOnError:false, strict:'ignore', trust:false}); }catch(e){}
  return `<code class="tex">${esc(s)}</code>`;
}
function inl(s){
  s=String(s??''); const keep=[];
  const put=h=>{ keep.push(h); return `\u0001${keep.length-1}\u0002`; };
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,a)=>put(tex(a,true)))
     .replace(/\\\((.+?)\\\)/g,(m,a)=>put(tex(a,false)))
     .replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g,(m,a)=>put(tex(a,false)));
  s=esc(s)
    .replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?![*\w])/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[\[([a-z]-[a-z]+)(?:\|([^\]]+))?\]\]/g,(m,id,label)=>{
      const n=NODE[id]; if(!n) return label||id;
      return `<button type="button" class="xref" data-act="sel" data-id="${id}" style="--dc:var(${DOM[n.d].c})"><span>${n.sym}</span>${label||esc(n.t)}</button>`;
    });
  return s.replace(/\u0001(\d+)\u0002/g,(m,i)=>keep[+i]);
}
function tableHTML(rows){
  const isSep=r=>/^[\s|:\-]+$/.test(r)&&r.includes('-');
  const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  const rs=rows.filter(r=>!isSep(r)).map(cells); if(!rs.length) return '';
  const [h,...b]=rs;
  return `<div class="tbl"><table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${b.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function layerOf(txt){
  const parts=txt.match(/직관|통상|엄밀/g); if(!parts) return null;
  const rest=txt.replace(/직관|통상|엄밀/g,'').replace(/적으로는|적으로|하게는|하게|으로는|으로|에서는|의|은|는|=|·|,|\/|\(|\)|:|\s|\*/g,'');
  if(rest) return null;
  const uniq=[...new Set(parts)];
  return {parts:uniq, cls:uniq.includes('엄밀')?'rig':uniq.includes('통상')?'std':'int'};
}
function md(src){
  const L=String(src??'').replace(/\r/g,'').split('\n'); const out=[];
  let para=[], list=null, quote=[], table=[], layer=false;
  const fp=()=>{ if(para.length){ out.push(`<p>${inl(para.join(' '))}</p>`); para=[]; } };
  const fl=()=>{ if(list){ out.push(list.t==='ol'?`<ol start="${list.start}">`:'<ul>'); out.push(list.items.map(x=>`<li>${inl(x)}</li>`).join('')); out.push(`</${list.t}>`); list=null; } };
  const fq=()=>{ if(quote.length){ out.push(`<blockquote>${md(quote.join('\n'))}</blockquote>`); quote=[]; } };
  const ft=()=>{ if(table.length){ out.push(tableHTML(table)); table=[]; } };
  const flush=()=>{ fp(); fl(); fq(); ft(); };
  const closeLayer=()=>{ if(layer){ flush(); out.push('</div>'); layer=false; } };
  for(let i=0;i<L.length;i++){
    const raw=L[i], l=raw.trim(); let m;
    if(!l){ flush(); continue; }
    const open = l.startsWith('$$') ? ['$$','$$'] : l.startsWith('\\[') ? ['\\[','\\]'] : null;
    if(open){
      flush(); let body=l.slice(2).trimEnd();
      if(body.endsWith(open[1])) body=body.slice(0,-2);
      else{ const acc=[body]; while(i+1<L.length){ i++; const t=L[i].trim(); if(t.endsWith(open[1])){ acc.push(t.slice(0,-2)); break; } acc.push(L[i]); } body=acc.join('\n'); }
      out.push(`<div class="math-block">${tex(body,true)}</div>`); continue;
    }
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){
      flush(); closeLayer();
      const txt=m[2].replace(/\s#+$/,'').trim(), lv=Math.min(4,Math.max(2,m[1].length));
      const ly=lv>=3?layerOf(txt):null;
      if(ly){ out.push(`<div class="layer l-${ly.cls}"><p class="ly-h">${ly.parts.map(p=>`<span class="ly">${p}</span>`).join('<span class="ly-eq">=</span>')}</p>`); layer=true; }
      else out.push(`<h${lv}>${inl(txt)}</h${lv}>`);
      continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){ flush(); out.push('<hr>'); continue; }
    if(l.startsWith('>')){ fp(); fl(); ft(); quote.push(l.replace(/^>\s?/,'')); continue; }
    if(l.startsWith('|')){ fp(); fl(); fq(); table.push(l); continue; }
    if((m=l.match(/^[-*•]\s+(.*)$/))){ fp(); fq(); ft(); if(!list||list.t!=='ul'){ fl(); list={t:'ul',items:[]}; } list.items.push(m[1]); continue; }
    if((m=l.match(/^(\d+)[.)]\s+(.*)$/))){ fp(); fq(); ft(); if(!list||list.t!=='ol'){ fl(); list={t:'ol',items:[],start:+m[1]}; } list.items.push(m[2]); continue; }
    if(list&&/^\s{2,}/.test(raw)){ list.items[list.items.length-1]+=' '+l; continue; }
    fl(); fq(); ft(); para.push(l);
  }
  flush(); closeLayer(); return out.join('');
}

설명의 층위
- "원리"에서 각 학습 목표는 아래 세 층으로 설명한다. 각 층은 #### 제목으로 시작한다.
  #### 직관 — 머릿속에 그림이 그려지는 이해. 일상의 장면이나 비유를 쓰되, 그 비유가 어디까지 맞고 어디서 틀리는지도 밝힌다.
  #### 통상 — 교과서 수준의 표준 설명. 정확한 정의, 핵심 식, 기호와 단위.
  #### 엄밀 — 정확한 진술. 전제와 적용 범위, 성립하지 않는 경우, 짧은 유도나 근거, 더 정확한 이론에서 어떻게 고쳐지는지.
- 두 층 이상이 사실상 같은 내용이면 반복하지 말고 합쳐서 "#### 직관·통상", "#### 통상·엄밀", "#### 직관·통상·엄밀"처럼 하나의 제목으로 쓴다. 억지로 층을 나누지 않는다.

뒤 단원의 개념
- 정확하게 말하려면 학습자가 아직 배우지 않은 뒤 단원의 개념이 필요할 때가 있다. 그 개념을 피하려고 사실을 단순화해 틀리게 말하지 않는다. 뒤 개념을 그대로 쓰되 지금 이해에 필요한 만큼만 한두 문장으로 풀어 주고, 그 개념을 제대로 다루는 단원을 [[id]]로 가리킨다.
- 근사나 단순화한 모형을 쓸 때는 어디까지 맞는지, 더 정확한 이론에서 어떻게 고쳐지는지 밝히고 그 단원을 [[id]]로 가리킨다.
- 본문에서 가리킬 수 있는 단원 id: ${NODES.slice().sort(byNo).filter(m=>m.id!==id).map(m=>`${m.id}=${m.t}`).join(', ')}

용어와 정의
- 용어는 처음 나올 때 **한글**(漢字, English) 꼴로 쓴다. 예: **가속도**(加速度, acceleration), **알짜힘**(net force). 한자어가 아니면 한자를 빼고, 한자는 정확한 표준 자형으로 쓴다.
- 정의는 짧아도 철저하게 쓴다. 정의 문장 하나만 떼어 읽어도 무엇을 가리키는지, 어떤 조건에서 성립하는지 완결되어야 한다. 그대로 외울 수 있게 한 문장으로 쓰고, 앞뒤 문맥에 기대지 않는다.
- 한정어를 지킨다. "주로", "대개", "일반적으로", "~일 수 있다", "이상 기체에서", "온도가 일정할 때"처럼 사실이 요구하는 한정어와 조건은 빼지 않는다. 한정어를 빼서 단정하면 틀린 문장이다.

형식 규칙
- 큰 제목은 이 순서 그대로: ## 핵심 질문, ## 원리, ## 예제, ## 흔한 오개념, ## 연결, ## 요약
- "핵심 질문": 이 질문이 왜 중요한지 2~3문장. 답은 뒤에서 한다.
- "원리": 학습 목표마다 ### 소제목을 두고, 그 아래에 층 제목(####)을 쓴다.
- 정의하는 용어는 **굵게** 쓴다.
- 기호를 처음 쓸 때 뜻과 SI 단위를 밝힌다. 수식은 LaTeX로, 문장 안은 $...$, 따로 보일 때는 한 줄에 $$...$$.
- "예제": 실제 수치를 넣은 단계별 풀이 1~2개. 정성적인 단원이면 구체적인 상황 분석.
- "흔한 오개념": 2~3개를 "- **오해:** … → **사실:** …" 형식으로.
- "연결": 다른 단원을 가리킬 때는 [[id]] 표기를 쓴다. '연결'에서는 아래 목록의 단원을 쓴다(본문에서 뒤 개념을 가리킬 때는 위 전체 목록을 쓴다).
${related(n).map(m=>`  ${m.id} = ${m.t}`).join('\n')}
- "요약": 반드시 외워야 할 핵심 4~6개를 글머리표로.
- 각 학습 목표의 마지막에는 점검 블록을 둔다. 방금 읽은 내용의 핵심(정의나 핵심 관계)을 떠올리게 하는 짧은 질문 하나와 정답을 정확히 이 형식으로 쓴다:
  #### 점검
  **Q.** 질문 한 문장
  **A.** 정답 한두 문장
- 학습자는 한 화면에 한 덩어리씩 넘기며 읽는다. 문단은 3~4문장으로 짧게 끊고, 각 층(####)은 600자 안쪽으로 쓴다.
- 분량은 공백 포함 3000~5000자. 인사말·맺음말·이모지 없이 첫 제목부터 바로 시작한다.`;
}
function cardsPrompt(id, lesson){
  const n=NODE[id];
  return `자연과학 단원 "${n.t}"을 마스터하기 위해 반드시 외워야 할 것을 빠짐없이 암기 카드로 만들어라.
[분야와 단계] ${DOM[n.d].name} · ${TIERS[n.tier].label} (${TIERS[n.tier].desc})
[학습 목표]
${n.obj.map((o,i)=>`${i+1}. ${o}`).join('\n')}
${lesson?`[학습자가 읽은 설명]\n${lesson.slice(0,7000)}\n`:''}
규칙
- kind는 다음 중 하나: "정의"(용어의 정확한 정의), "기호"(기호·단위의 뜻), "법칙"(법칙·공식과 성립 조건), "상수"(상수·대표 값과 단위), "분류"(종류·구분·순서 목록), "사실"(꼭 알아야 할 사실·명칭·수치).
- 이 단계에서 외워야 할 것만, 그러나 빠짐없이. 보통 12~25장.
- q(앞면)는 정확한 인출을 요구하는 질문이다. 예: "알짜힘의 정의는?", "기호 μ_k의 뜻과 단위는?", "뉴턴 제2법칙을 식으로 쓰고, 성립 조건을 말하라."
- a(뒷면)는 외울 수 있게 짧고 정확하게. 수식은 $...$ LaTeX.
- 용어 카드와 정의 카드의 a에는 용어를 한글(漢字, English) 꼴로 쓴다. 예: 가속도(加速度, acceleration). 한자어가 아니면 한자를 뺀다.
- 정의는 짧아도 철저하게: 정의 문장 하나만으로 무엇을 가리키는지, 어떤 조건에서 성립하는지 완결되어야 한다. "주로", "대개", "~일 수 있다", "온도가 일정할 때" 같은 한정어와 조건은 사실이 그러하면 절대 빼지 않는다.
- t는 이 카드를 틀렸을 때 학습자가 손으로 따라 써서 외울 핵심 답이다. ${KEY_RULE} 예: "물체에 작용하는 모든 힘의 벡터 합", "F_net = ma", "6.022×10^23 /mol".
- hint에는 헷갈리기 쉬운 점이나 외우는 요령을 한 줄로 쓴다. 없으면 빈 문자열.
- 한국 교과서 표준 용어를 쓰고, 설명에 나온 용어와 표기를 그대로 맞춘다.
JSON 배열 하나로만 답하라: [{"kind":"정의","q":"앞면","a":"뒷면","t":"따라 쓸 핵심","hint":""}]`;
}
function quizPrompt(sv){
  const n=NODE[sv.id], missed=rec(sv.id)?.miss||[], cards=liveItems(sv.id);
  return `자연과학 단원 "${n.t}"의 숙달 여부를 판정할 확인 문제 8개를 만들어라. 이 코스는 이해를 넘어 정확한 지식과 적용을 요구하는 마스터 과정이고, 학습자는 8문제를 모두 맞혀야 숙달로 인정된다. 그러므로 정답이 분명히 하나이고 해석이 갈리지 않는 문제만 내라.
[분야와 단계] ${DOM[n.d].name} · ${TIERS[n.tier].label}
[핵심 질문] ${n.q}
[학습 목표] (번호는 0부터)
${n.obj.map((o,i)=>`${i}. ${o}`).join('\n')}
[학습자가 외운 카드]
${cards.slice(0,30).map(c=>`- ${c.q} → ${c.a}`).join('\n')||'(없음)'}
${sv.mode==='test'?'[상황] 학습자는 설명을 읽지 않고 이 단원을 이미 안다고 판단했다. 외운 문장만으로는 풀 수 없는 문제로 진짜 숙달을 가려내라.':'[상황] 학습자는 설명을 읽고 카드를 외웠다. 설명의 문장을 그대로 묻지 말고 정확한 지식과 적용을 확인하라.'}${missed.length?`\n[지난 시도에서 약했던 목표] ${missed.join(', ')}번. 이 목표를 다른 상황으로 더 물어라.`:''}

구성
- 1~2번: 정의·기호·법칙을 정확히 아는지 가리는 객관식. 오답 보기는 정답과 아주 비슷하지만 핵심 요소 하나가 틀린 진술로 만든다.
- 3~5번: 처음 보는 상황에 적용하거나 분석하는 객관식. 오답 보기는 실제로 흔한 오개념으로 만든다.
- 6~7번: 계산이 자연스러운 단원이면 수치 답 문제("num"), 아니면 적용 객관식.
- 8번: 자기 말로 정확히 설명하는 서술형("short"). 채점 요소에 정의의 핵심 요소를 넣는다.
- 보기는 4개, 정답 위치는 고르게 섞는다. 모든 학습 목표가 최소 두 번 나오게 하고, 각 문제의 obj에 목표 번호를 적는다.
- 내기 전에 문제와 정답이 과학적으로 정확한지, 정답이 하나뿐인지 스스로 검토한다.
- 정답 보기와 모범 답안의 정의는 그것만으로 완결되게 쓰고, 사실이 요구하는 한정어("주로", "대개", "~일 수 있다", 성립 조건)를 빼지 않는다. 한정어 하나의 차이로 오답 보기를 만들 수 있다.
- key는 학습자가 이 문제를 틀렸을 때 손으로 따라 써서 외울 핵심 한 줄이다. 정답의 요점이나 꼭 외울 정의·관계를 쓴다. ${KEY_RULE}
- 한국어로 쓰고 수식은 $...$ LaTeX로 쓴다.

JSON 배열 하나로만 답하라. 원소 형식:
{"type":"mcq","obj":0,"level":"정확성","q":"문제","choices":["보기","보기","보기","보기"],"answer":2,"why":"정답 근거와 오답이 틀린 이유","key":"따라 쓸 핵심"}
{"type":"num","obj":1,"level":"계산","q":"문제(답의 단위를 밝힐 것)","answer":12.5,"tol":0.02,"unit":"m/s","why":"풀이 과정","key":"따라 쓸 핵심(쓴 식이나 관계)"}
{"type":"short","obj":2,"level":"설명","q":"문제","rubric":["채점 요소","채점 요소","채점 요소"],"model":"모범 답안","key":"따라 쓸 핵심"}
answer는 choices의 0부터 시작하는 번호, tol은 허용 상대 오차다. level은 정확성·적용·분석·계산·설명 중 하나다.`;
}

[문제] ${it.q}
[채점 요소]
${it.rubric.map((r,i)=>`${i}. ${r}`).join('\n')}

${ids.map(id=>{ const n=NODE[id]; return `- ${id} | ${n.t} | ${n.obj.join(' / ')}`; }).join('\n')}

[핵심 질문] ${n.q}
[학습 목표] ${n.obj.join(' / ')}
[학습자가 읽는 설명]
${(lesson||'(설명 없음)').slice(0,6000)}`;

function ideaPrompt(k, ns){
  const I=IDEAS[k];
  return `자연과학의 큰 개념 "${I.name}: ${I.line}"을 축으로, 학습자가 숙달한 다음 단원들이 어떻게 하나의 흐름으로 이어지는지 정리하라. 교과서 문체(해라체)로 쓴다.
[학습자가 숙달한 단원] (학습 순서)
${ns.map(n=>`- ${n.id} = ${n.t} (${DOM[n.d].name}): ${n.q}`).join('\n')}
형식: 한국어 마크다운. 제목은 "## 한 문장 요약", "## 연결의 흐름", "## 분야를 넘는 같은 원리", "## 생각해 볼 질문" 순서로 쓴다.
- "연결의 흐름"에서는 단원을 [[id]]로 가리키며, 앞 단원이 뒤 단원을 어떻게 가능하게 하는지 순서대로 잇는다.
- "분야를 넘는 같은 원리"에서는 서로 다른 분야의 단원 쌍 2~3개를 골라, 같은 원리가 어떻게 다른 모습으로 나타나는지 비교한다.
- "생각해 볼 질문"은 여러 단원을 함께 써야 답할 수 있는 질문 2개. 답은 쓰지 않는다.
- 1500~2500자, 수식은 $...$ LaTeX, 인사말 없이 바로 시작한다.`;
}
function normItem(x, nobj){
  if(!x||typeof x.q!=='string'||!x.q.trim()) return null;
  const obj=Number.isInteger(+x.obj)&&+x.obj>=0&&+x.obj<nobj? +x.obj : 0;
  const level=String(x.level||''), key=cleanKey(x.key);
  if(x.type==='mcq'&&Array.isArray(x.choices)&&x.choices.length>=2&&x.choices.length<=6&&Number.isInteger(+x.answer)&&+x.answer>=0&&+x.answer<x.choices.length)
    return {type:'mcq', obj, level, q:x.q, choices:x.choices.map(String), answer:+x.answer, why:String(x.why||''), key};
  if(x.type==='num'&&x.answer!==''&&x.answer!=null&&isFinite(+x.answer))
    return {type:'num', obj, level, q:x.q, answer:+x.answer, tol:Math.min(0.2,Math.max(0.005,+x.tol||0.02)), unit:String(x.unit||''), why:String(x.why||''), key};
  if(x.type==='short')
    return {type:'short', obj, level, q:x.q, rubric:Array.isArray(x.rubric)?x.rubric.map(String):[], model:String(x.model||''), key};
  return null;
}
const asArray=a=>Array.isArray(a)?a:(a?.items||a?.questions||a?.cards||[]);
function parseNum(s){
  s=String(s).trim().replace(/\s+/g,'').replace(/−/g,'-').replace(/,/g,'').replace(/[×x*]10\^?\(?(-?\d+)\)?/i,'e$1');
  const v=parseFloat(s); return isFinite(v)?v:NaN;
}

function relClass(id){ if(!UI.sel) return ''; if(id===UI.sel) return ' sel rel'; return (NODE[UI.sel].pre.includes(id)||UNLOCKS[UI.sel].includes(id))?' rel':''; }
function updateMapSel(){

  pt.classList.toggle('has-sel',!!id);
  pt.querySelectorAll('.tile').forEach(t=>{ t.classList.toggle('sel',t.dataset.id===id); t.classList.toggle('rel',rel.has(t.dataset.id)); });
}
function drawLinks(){
  const wrap=$('#pt-wrap'), svg=$('#pt-links'); if(!wrap||!svg) return;
  const id=UI.sel; svg.innerHTML='';
  const W=wrap.scrollWidth, H=wrap.scrollHeight;
  svg.setAttribute('width',W); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(!id||UI.view!=='map') return;
  const box=wrap.getBoundingClientRect();
  const c=nid=>{ const el=wrap.querySelector(`.tile[data-id="${nid}"]`); if(!el) return null; const r=el.getBoundingClientRect(); return {x:r.left-box.left+wrap.scrollLeft+r.width/2, y:r.top-box.top+wrap.scrollTop+r.height/2}; };
  const me=c(id); if(!me) return;
  const curve=(a,b,cls)=>{ const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, k=.16; return `<path class="lk ${cls}" d="M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${(mx-(b.y-a.y)*k).toFixed(1)},${(my+(b.x-a.x)*k).toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}"></path>`; };
  let h='';
  NODE[id].pre.forEach(p=>{ const a=c(p); if(a) h+=curve(a,me,'pre'); });
  UNLOCKS[id].forEach(u=>{ const b=c(u); if(b) h+=curve(me,b,'post'); });
  svg.innerHTML=h;
}

/* one-screen reader: the lesson is cut into chunks; a new chunk needs reading time, each goal ends with a checkpoint */
let rdTimer=0;
function plainLen(s){ return String(s||'').replace(/\$\$[\s\S]*?\$\$/g,'수식수식수식').replace(/\$[^$\n]+\$/g,'수식').replace(/[#*>|`\-:]/g,'').replace(/\s+/g,'').length; }
const dwellOf=c=>c.type==='check'?0:Math.min(35,Math.max(3,Math.round(plainLen(c.body)/10)));
const opensMath=l=>(l.startsWith('$$')&&!(l.length>2&&l.endsWith('$$')))||(l.startsWith('\\[')&&!l.endsWith('\\]'));
function chunkLesson(src){
  const lines=String(src||'').replace(/\r/g,'').split('\n'), out=[];
  let sec='', sub='', cur=null, inMath=false;
  const push=()=>{
    if(!cur) return;

    cur=null;
  };
  const start=type=>{ push(); cur={type, sec, sub, grp:sec+'|'+sub, body:[], q:'', a:'', mode:''}; };
  for(const raw of lines){
    const l=raw.trim();
    if(inMath){ cur.body.push(raw); if(l.includes('$$')||l.includes('\\]')) inMath=false; continue; }
    const m=l.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const lv=m[1].length, txt=m[2].replace(/\s#+$/,'').trim();
      if(lv<=2){ sec=txt; sub=''; start('text'); continue; }
      if(lv===3){ sub=txt; start('text'); continue; }
      if(/^점검/.test(txt)){ start('check'); continue; }
      start('text'); cur.body.push(raw); continue;
    }
    if(!cur) start('text');
    if(cur.type==='check'){
      const q=l.match(/^(?:\*\*)?Q\s*[.:)]\s*(?:\*\*)?\s*(.*)$/i), a=l.match(/^(?:\*\*)?A\s*[.:)]\s*(?:\*\*)?\s*(.*)$/i);

      continue;
    }
    if(opensMath(l)) inMath=true;
    cur.body.push(raw);
  }
  push();
  const res=[];
  for(const c of out){
    if(c.type!=='text'||plainLen(c.body.join('\n'))<=900){ res.push({...c, body:c.type==='text'?c.body.join('\n'):''}); continue; }
    const head=/^#{4,}\s/.test((c.body[0]||'').trim())?c.body[0]:null;

      if(im){ p.push(raw); if(l.includes('$$')||l.includes('\\]')) im=false; continue; }
      if(opensMath(l)) im=true;
      if(!l){ if(p.length){ paras.push(p.join('\n')); p=[]; } continue; }
      p.push(raw);
    }
    if(p.length) paras.push(p.join('\n'));

    const flush=()=>{ if(acc.length){ res.push({...c, body:(head?head+'\n\n':'')+acc.join('\n\n')}); acc=[]; len=0; } };

    flush();

}
function ensureReader(sv){

function readerHTML(sv){
  const L=sv.lesson, R=sv.reader, chunks=chunkLesson(L.md), N=chunks.length;
  const streaming=L.state==='streaming'||L.state==='writing';
  if(!N) return '';

  const c=chunks[R.i], complete=!(streaming&&R.i===N-1), isNew=!R.free&&R.i>=R.max;
  if(complete&&R.shown[R.i]==null) R.shown[R.i]=Date.now();

  if(c.type==='check'){

    body=`<div class="rd-check"><p class="eyebrow">점검${c.sub?` · ${esc(c.sub)}`:''}</p><div class="cb-q md">${md(c.q)}</div>${
      !R.revealed&&!done
      ?`<form id="chk-form" class="reveal-form"><label class="sr" for="chk-typed">떠올린 답</label><input id="chk-typed" autocomplete="off" placeholder="떠올린 답을 적어 봐 (안 적어도 돼)" value="${esc(R.typed)}"><div><button type="submit" class="btn">답 보기</button></div></form>`

  const r=rec(sv.id)||{};
  return `<div class="reader" id="reader">
    <div class="rd-top"><span class="eyebrow" style="margin:0">${R.toc?'목차':esc(c.sec||'설명')}</span><span class="rd-tools"><button type="button" class="linkbtn" data-act="rd-toc">${R.toc?'목차 닫기':'목차'}</button>${(R.free||r.rd)?'<button type="button" class="linkbtn" data-act="rd-whole">전체 보기</button>':''}${L.state==='done'&&ENV.sample&&!STORED.has(`lessons/${sv.id}`)?'<button type="button" class="linkbtn" data-act="regen">다시 쓰기</button>':''}<span class="mono rd-count">${R.i+1} / ${N}${streaming?'+':''}</span></span></div>
    <div class="rd-bar" role="group" aria-label="장 이동">${segs}</div>
    <div class="rd-body">${R.toc?tocHTML(chunks,R):body}</div>
  </div>
  <div class="reader-spacer" aria-hidden="true"></div>
  <div class="rd-navbar"><div class="rd-navin"><div class="rd-nav"><button type="button" class="btn ghost rd-prev" data-act="rd-prev"${R.i===0?' disabled':''}>← 이전 장</button><button type="button" class="btn primary rd-next" data-act="rd-next"${canNext?'':' disabled'} aria-label="${wait>0?'읽을 시간이 지나면 켜져':label}">${fill}<span class="rd-lbl">${label}</span></button></div></div></div>`;
}
function tocHTML(chunks,R){

function wholeHTML(sv){

function scrollToReader(){ const el=$('#reader'); if(!el) return; const top=el.getBoundingClientRect().top; if(top<70||top>window.innerHeight*0.4) window.scrollTo({top:Math.max(0,top+window.scrollY-80)}); }

function checksPrompt(n, subs, src){
  return `자연과학 단원 "${n.t}"의 설명을 읽은 학습자가 각 소단원 끝에서 풀 점검 질문을 만들어라. 소단원마다 하나씩, 방금 읽은 핵심(정의나 핵심 관계)을 정확히 떠올리게 하는 짧은 질문과 정답이다. 질문은 한 문장, 정답은 한두 문장, 수식은 $...$ LaTeX로 쓴다.
[소단원 제목]
${subs.map(s=>`- ${s}`).join('\n')}
[설명]
${src.slice(0,9000)}

async function ensureChecks(sv){
  const L=sv.lesson;
  if(!L.md||/^####\s*점검/m.test(L.md)||sv.checksBusy||!ENV.sample||L.state!=='done') return;
  const subs=[...L.md.matchAll(/^###\s+(.+)$/gm)].map(m=>m[1].trim()); if(!subs.length) return;

    const items=arr.filter(x=>x&&x.q&&x.a&&x.sub).map(x=>({sub:String(x.sub).trim(), q:String(x.q).trim(), a:String(x.a).trim()}));
    if(!items.length||sv.lesson!==L) return;

    for(const line of L.md.split('\n')){ const m=line.match(/^(#{2,3})\s+(.+)$/); if(m){ flushCheck(); if(m[1]==='###') pending=m[2].trim(); } out.push(line); }
    flushCheck();

    L.md=out.join('\n'); putLesson(sv.id,L.md);

    if(UI.study===sv) paintLesson();
  }catch(e){}
  finally{ sv.checksBusy=false; }
}
function chatLog(sv){

}

/* cards */
function cardsStep(sv,n){

  if(C.state==='nosample') return `<div class="cards-wrap"><div class="note">${NOSAMPLE}</div></div>`;
  if(C.state==='error') return `<div class="cards-wrap"><div class="note bad">${esc(C.err)}</div><div class="row"><button type="button" class="btn primary" data-act="retry-cards">카드 다시 만들기</button></div></div>`;
  const items=liveItems(n.id), m=S.cards.u[n.id]||{}, learned=items.filter(c=>m[c.id]).length;
  if(learned<items.length) startLearnSession(n.id);

    : cardBox(cs);
  return `<div class="cards-wrap">${prog}${body}${cardList(n.id)}</div>`;

function cardList(u){

  }).join('')}</ol>${!cardEntries(u).length&&ENV.sample&&!STORED.has(`cards/${u}`)?'<div class="row"><button type="button" class="btn sm" data-act="regen-cards">카드 전체 다시 만들기</button></div>':''}</details>`;

function cardEditForm(u,c){

    <p class="hint">수식은 $...$로 써. 고쳐도 외운 기록은 그대로 남아.</p></form>`;

function cardBox(cs){
  if(!cs||!cs.queue.length) return '';
  const it=cs.queue[0], c=cardOf(it.u,it.id); if(!c) return '';
  const n=NODE[it.u];
  if(UI.cedit&&!UI.cedit.list&&UI.cedit.u===it.u&&UI.cedit.id===it.id) return `<div class="cardbox">${cardEditForm(it.u,c)}</div>`;
  const meta=`<div class="cb-meta"><span class="pill">${esc(c.k)}</span>${cs.mode==='review'?chip(n):''}<span class="mono cb-count">${cs.mode==='review'?`${cs.done} / ${cs.total}`:`남은 카드 ${cs.queue.length}`}</span></div>`;
  const front=`<div class="cb-q md" style="--dc:var(${DOM[n.d].c})">${md(c.q)}</div>`;
  const ans=`<div class="cb-a md">${md(c.a)}</div>${c.h?`<p class="cb-h">${inl(c.h)}</p>`:''}`;
  let body, note='', canEdit=true;

    body=`${ans}${cs.copy.typed?`<p class="cb-typed">${cs.copy.recall?'기억해서 쓴 답':'내가 적은 답'}: ${esc(cs.copy.typed)}</p>`:''}${copyForm('card-copy-form','card-copy',cardKey(c),cs.copy.recall?'기억과 달랐어. 보고 그대로 따라 써.':'보고 그대로 따라 써. 맞게 써야 넘어가.')}`;
    note='따라 쓴 카드는 조금 뒤에 다시 나와. 그때는 보지 않고 써야 해.';
  } else if(cs.recall?.[it.u+'/'+it.id]){
    canEdit=false; // the edit form shows the answer
    body=`<form class="reveal-form" id="card-recall-form"><label class="label" for="card-recall">아까 틀린 카드야. 보지 않고 써 봐</label><input id="card-recall" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="기억나는 대로 써"><div class="row" style="margin:0"><button type="submit" class="btn primary">확인 <kbd>Enter</kbd></button><button type="button" class="btn" data-act="card-giveup">모르겠어</button></div></form>`;
  } else if(!cs.revealed){
    body=`<form class="reveal-form" id="reveal-form"><label class="sr" for="card-typed">떠올린 답</label><input id="card-typed" autocomplete="off" placeholder="떠올린 답을 적어 봐 (안 적어도 돼)" value="${esc(cs.typed||'')}"><div><button type="submit" class="btn primary">답 보기 <kbd>Enter</kbd></button></div></form>`;
  } else {
    body=`${ans}${cs.typed?`<p class="cb-typed">내가 적은 답: ${esc(cs.typed)}</p>`:''}
       <div class="grades"><button type="button" class="btn g1" data-act="cg" data-g="1">몰랐어 <kbd>1</kbd></button><button type="button" class="btn g2" data-act="cg" data-g="2">헷갈렸어 <kbd>2</kbd></button><button type="button" class="btn primary" data-act="cg" data-g="3">알았어 <kbd>3</kbd></button></div>`;
    note='몰랐거나 헷갈렸으면 따라 쓰고, 조금 뒤에 보지 않고 다시 써.';
  }
  return `<div class="cardbox">${meta}${front}${body}<div class="cb-foot">${canEdit?`<button type="button" class="linkbtn" data-act="card-edit" data-u="${it.u}" data-c="${it.id}">이 카드 고치기</button>`:"<span></span>"}${note?`<span class="hint" style="margin:0">${note}</span>`:''}</div></div>`;

/* quiz */
function quizStep(sv,n){
  if(!rec(sv.id)?.cd) return `<div class="quiz-wrap"><div class="note">암기를 먼저 끝내야 확인 문제를 풀 수 있어.</div><div class="row"><button type="button" class="btn primary" data-act="step" data-step="cards">암기로 가기</button></div></div>`;
  const q=sv.quiz;
  if(!q||q.state==='loading') return `<div class="quiz-wrap">${busy('확인 문제 8개를 만드는 중',q?.t0,'stop-quiz','가장 유능한 모델이 생각하고 써서 1~2분쯤 걸려.')}</div>`;
  if(q.state==='nosample') return `<div class="quiz-wrap"><div class="note">${NOSAMPLE}</div></div>`;
  if(q.state==='error') return `<div class="quiz-wrap"><div class="note bad">${esc(q.err)}</div><div class="row"><button type="button" class="btn primary" data-act="retry-quiz">문제 다시 만들기</button></div></div>`;
  const it=q.items[q.i], r=q.res[q.i];
  const dots=`<ol class="qdots" aria-hidden="true">${q.items.map((x,i)=>{ const rr=q.res[i]; return `<li class="${rr?.void?'void':rr?.done?(rr.score>=0.7?'good':rr.score>0?'mid':'bad'):i===q.i?'cur':''}"></li>`; }).join('')}</ol>`;
  const meta=`<div class="qmeta"><span class="mono">문제 ${q.i+1} / ${q.items.length}</span><span class="pill">${esc(it.level||TYPE_LABEL[it.type])}</span><span>목표 ${it.obj+1}</span><span class="muted">모두 맞혀야 통과</span></div>`;
  const failed=q.res.some(x=>x?.done&&!x.void&&x.score<1);
  const failNote=failed&&r?.done&&!needCopy(it,r)&&q.i<q.items.length-1?'<div class="note bad" style="margin:14px 0 0">이번 회차는 이미 100점이 안 돼. 남은 문제는 연습으로 풀어도 되고, 지금 새 문제로 다시 도전해도 돼. <button type="button" class="btn sm" data-act="retry-quiz">새 문제로 다시</button></div>':'';
  return `<div class="quiz-wrap"><div class="qcard" style="--dc:var(${DOM[n.d].c})">${dots}${meta}<div class="qstem md">${md(it.q)}</div>${answerArea(it,r,'q')}${feedback(it,r,'q',q.i===q.items.length-1)}${failNote}</div></div>`;
}
function submitRow(ns, enabled, isForm){
  if(ns==='q') return `<div class="row"><button class="btn primary" ${isForm?'type="submit"':'type="button" data-act="q-submit"'}${enabled?'':' disabled'}>제출</button></div>`;
  const b=(sure,label,cls)=>`<button class="btn ${cls}" ${isForm?`type="submit" name="sure" value="${sure}"`:`type="button" data-act="rv-submit" data-sure="${sure}"`}${enabled?'':' disabled'}>${label}</button>`;
  return `<div class="row">${b(1,'확신하고 제출','primary')}${b(0,'헷갈리지만 제출','')}</div>`;
}
function answerArea(it, r, ns){
  const done=r?.done;
  if(it.type==='mcq'){
    return `<div class="choices">${it.choices.map((c,i)=>{ let cls=''; if(done){ if(i===it.answer) cls=' is-right'; else if(i===r.choice) cls=' is-wrong'; }
      return `<button type="button" class="choice${cls}" data-act="${ns}-pick" data-i="${i}" aria-pressed="${!done&&r?.pick===i}"${done?' disabled':''}><span class="mk">${MARKS[i]||i+1}</span><span>${inl(c)}</span></button>`; }).join('')}</div>${done?'':submitRow(ns,r?.pick!=null,false)}`;
  }
  if(it.type==='num'){
    return `<form class="ans-form" data-kind="num" data-ns="${ns}"><label class="label" for="${ns}-num">답을 숫자로 써 (예: 12.5, 3e8, 6.0×10^23)</label><div class="num-row"><input id="${ns}-num" name="num" inputmode="decimal" autocomplete="off" value="${done?esc(r.val):''}"${done?' disabled':''}><span class="unit">${esc(it.unit)}</span></div>${done?'':submitRow(ns,true,true)}</form>`;
  }
  return `<form class="ans-form" data-kind="short" data-ns="${ns}"><label class="label" for="${ns}-short">정확하게, 자기 말로 설명해</label><textarea id="${ns}-short" name="short" rows="6" placeholder="정의의 핵심 요소를 빠짐없이 넣어서 써 봐."${done||r?.grading?' disabled':''}>${esc(r?.text||'')}</textarea>${done?'':r?.grading?`<div class="row">${busy('채점하는 중',r.t0)}</div>`:'<div class="row"><button type="submit" class="btn primary">채점받기</button></div>'}${r?.err?`<p class="note bad" style="margin-top:10px">${esc(r.err)}</p>`:''}</form>`;
}
function feedback(it, r, ns, last, extra=''){
  if(!r?.done) return '';
  const voidBtn=ns==='q'?(r.void?'<span class="pill">채점에서 뺐어</span>':'<button type="button" class="linkbtn" data-act="q-void">이 문제가 잘못됐어 · 채점에서 빼기</button>'):'<span></span>';
  const next=needCopy(it,r)
    ? `${copyForm('copy-form',`${ns}-copy`,itemKey(it),'틀린 문제는 핵심을 그대로 따라 써야 넘어가.',`data-ns="${ns}"`)}${ns==='q'?`<div class="row">${voidBtn}</div>`:''}`
    : `<div class="row">${voidBtn}<button type="button" class="btn primary" data-act="${ns}-next">${last?'결과 보기':'다음 문제 →'}</button></div>`;
  if(it.type==='short'){
    const g=r.grade||{}, hit=g.hit||[];
    return `<div class="fb"><div class="fb-h"><span class="pill ${r.score>=1?'good':'bad'}">${r.score>=1?'통과':'보완 필요'}</span><span>${esc(g.feedback||'')}</span></div>
      ${it.rubric.length?`<ul class="rubric">${it.rubric.map((x,i)=>`<li class="${hit.includes(i)?'hit':'miss'}">${hit.includes(i)?'담음':'빠짐'} · ${inl(x)}</li>`).join('')}</ul>`:''}
      ${g.wrong?`<p><b>바로잡기</b> ${inl(g.wrong)}</p>`:''}
      ${it.model?`<details><summary>모범 답안 보기</summary><div class="md">${md(it.model)}</div></details>`:''}${next}</div>`;
  }
  const ok=r.score>=1;
  const ans=it.type==='mcq'?`${MARKS[it.answer]} ${inl(it.choices[it.answer])}`:`${esc(fmtNum(it.answer))} ${esc(it.unit)}`;
  return `<div class="fb"><div class="fb-h"><span class="pill ${ok?'good':'bad'}">${ok?'정답':'오답'}</span>${ok?'':`<span>정답: ${ans}</span>`}</div><div class="md">${md(it.why)}</div>${extra}${next}</div>`;
}
function resultStep(sv,n){
  const R=sv.result;
  if(!R) return '';
  if(R.inconclusive) return `<div class="res card"><p class="eyebrow">판정 보류</p><h2>채점에서 뺀 문제가 많아서 판정을 못 했어</h2><p class="muted">새 문제로 다시 풀자. 기록은 바뀌지 않았어.</p><div class="row"><button type="button" class="btn primary" data-act="retry-quiz">새 문제로 다시</button></div></div>`;
  const pct=Math.round(R.score*100);
  const head=R.passed
    ? `<p class="eyebrow">숙달</p><p class="res-score">${pct}<small>점</small></p><h2>「${esc(n.t)}」 단원을 숙달했어</h2><p class="muted">카드는 내일부터, 응용 복습은 ${fmtRel(rec(n.id).nx)}부터 나와. 카드 간격이 모두 3주를 넘으면 단단함이 돼.</p>`
    : `<p class="eyebrow">아직</p><p class="res-score">${pct}<small>점</small></p><h2>100점이 아니라서 아직 숙달이 아니야</h2><p class="muted">틀린 문제의 목표를 확인해. 다시 도전하면 그 목표를 더 많이 묻는 새 문제 8개가 나와. 다음 단원은 이 단원을 100점으로 통과해야 열려.</p>`;
  const bars=`<div class="objbars">${n.obj.map((o,i)=>{ const v=R.byObj[i]; if(v==null) return ''; const p=Math.round(v*100);
    return `<div class="objbar${v<0.7?' low':''}"><span>${i+1}. ${esc(o)}</span><span class="dbar"><i class="m" style="width:${p}%"></i></span><span class="mono">${p}%</span></div>`; }).join('')}</div>`;
  const unl=R.unlocked.length?`<p class="label">새로 열린 단원</p><div class="chips">${R.unlocked.map(id=>chip(NODE[id])).join('')}</div>`:'';
  const btns=R.passed
    ? `<button type="button" class="btn primary" data-act="next">이어하기 →</button><button type="button" class="btn" data-act="nav" data-view="today">오늘로</button>`
    : `<button type="button" class="btn primary" data-act="retry-quiz">새 문제로 다시 도전</button><button type="button" class="btn" data-act="to-lesson">설명 다시 보기</button>`;
  return `<div class="res card">${head}${bars}${unl}${R.passed?`<p class="hint">다음: ${esc(nextLabel())}</p>`:''}<div class="row">${btns}</div></div>`;
}

/* unit review */
function reviewView(){
  const rv=UI.review;
  const head=`<div class="study-top"><button type="button" class="btn ghost sm" data-act="back">← ${backLabel()}</button></div><header class="pagehead"><div><p class="eyebrow">간격 반복 · ${rv.ids.length}개 단원</p><h1>응용 복습</h1><p class="lede">숙달한 단원을 다른 각도에서 다시 꺼내. 확신했는지도 같이 고르면 다음 간격이 거기에 맞춰져.</p></div></header>`;
  if(rv.state==='loading') return head+`<div class="quiz-wrap">${busy(`복습 문제 ${rv.ids.length}개를 만드는 중`,rv.t0,'stop-review','가장 유능한 모델이 생각하고 써서 1~2분쯤 걸려.')}</div>`;
  if(rv.state==='nosample') return head+`<div class="note">${NOSAMPLE}</div>`;
  if(rv.state==='error') return head+`<div class="quiz-wrap"><div class="note bad">${esc(rv.err)}</div><div class="row"><button type="button" class="btn primary" data-act="retry-review">다시 만들기</button></div></div>`;
  if(rv.state==='done') return head+reviewSummary(rv);
  const it=rv.items[rv.i], r=rv.res[rv.i], n=NODE[it.id];

async function loadLesson(sv, regen){

function afterLesson(sv){ ensureChecks(sv); if(!sv.cards) loadCards(sv,true,false); }
async function loadCards(sv, bg, force){
  if(sv.cards&&(sv.cards.state==='loading'||sv.cards.state==='ready')){ if(!bg) render(); return; }
  const id=sv.id, C=sv.cards={state:'loading', t0:Date.now()};
  if(!bg) render();
  const cached=force?null:await getCards(id);
  if(sv.cards!==C) return;
  if(cached){ C.state='ready'; }
  else if(!ENV.sample){ C.state='nosample'; }
  else{
    const ctl=new AbortController(); C.ctl=ctl;
    try{
      const lesson=sv.lesson?.md||lessonCached(id)||await getLesson(id)||'';
      const arr=asArray(await ENV.sample.json(cardsPrompt(id,lesson),{signal:ctl.signal, cache:false}));
      const items=arr.filter(x=>x&&typeof x.q==='string'&&typeof x.a==='string'&&x.q.trim()&&x.a.trim()).slice(0,30)
        .map((x,i)=>({id:'c'+String(i+1).padStart(2,'0'), k:KINDS.includes(x.kind)?x.kind:'사실', q:x.q.trim(), a:x.a.trim(), ...(cleanKey(x.t)?{t:cleanKey(x.t)}:{}), h:String(x.hint||'').trim()}));
      if(items.length<5) throw {code:'invalid_json'};
      CARDS[id]=items; putCards(id); C.state='ready';
    }catch(e){ C.state='error'; C.err=sampleErr(e); }
  }
  if(C.state==='ready'){ checkCardsDone(id); if(rec(id)?.cd) prefetchQuiz(sv); }
  if(UI.study===sv&&sv.step==='cards'){ render(); focusCard(); }
}
// Cards without a key (t) — the pre-made, reviewed ones in content/ — use a key taken from the answer (answerKey).
// The app does not ask the model for keys: that would write unreviewed text into the reviewed cards/<id> docs.
function startLearnSession(u){
  if(UI.cs&&UI.cs.mode==='learn'&&UI.cs.unit===u&&UI.cs.queue.length) return;
  const m=S.cards.u[u]||{};
  UI.cs={mode:'learn', unit:u, queue:liveItems(u).filter(c=>!m[c.id]).map(c=>({u,id:c.id})), revealed:false, typed:'', tried:{}, recall:{}, copy:null};

function checkCardsDone(u){
  const items=liveItems(u); if(!items.length) return false;
  const m=S.cards.u[u]||{};
  if(items.every(c=>m[c.id])){ const r=ensure(u); if(!r.cd){ r.cd=1; save('progress'); } return true; }

function prefetchQuiz(sv){ if(ENV.sample&&!sv.quiz&&rec(sv.id)?.cd) genQuiz(sv,true); }
async function genQuiz(sv, bg){
  if(sv.quiz&&(sv.quiz.state==='loading'||sv.quiz.state==='ready')){ if(!bg) render(); return; }
  if(!ENV.sample){ sv.quiz={state:'nosample'}; if(!bg) render(); return; }
  const Q=sv.quiz={state:'loading',t0:Date.now()};
  if(!bg) render();
  if(!CARDS[sv.id]) await getCards(sv.id);
  const ctl=new AbortController(); Q.ctl=ctl;
  try{
    const items=asArray(await ENV.sample.json(quizPrompt(sv),{signal:ctl.signal, cache:false})).map(x=>normItem(x,NODE[sv.id].obj.length)).filter(Boolean).slice(0,10);
    if(items.length<6) throw {code:'invalid_json'};
    Object.assign(Q,{state:'ready', items, i:0, res:[]});
  }catch(e){ Object.assign(Q,{state:'error', err:sampleErr(e)}); }
  if(UI.study===sv&&sv.step==='quiz'&&sv.quiz===Q) render();
}
function gradeCard(g){
  const cs=UI.cs; if(!cs||!cs.revealed||cs.copy||!cs.queue.length) return;
  const it=cs.queue[0], key=it.u+'/'+it.id, m=cst(it.u);
  if(cs.mode==='learn'){
    if(g===3){ cs.queue.shift(); const first=!cs.tried[key]; m[it.id]=[first?2:1,2.5,dnum()+(first?2:1),1,0]; }
    else cs.tried[key]=true;
    bump('k');
  } else {
    if(!(key in cs.graded)){ cs.graded[key]=g; cs.counts[g]++; cs.done++; applyCardReview(m,it.id,g); bump('k'); }
    if(g===3) cs.queue.shift();
  }
  if(g!==3){
    const c=cardOf(it.u,it.id);
    if(c&&typeKey(cardKey(c))) cs.copy={g, typed:cs.typed};
    else { const cur=cs.queue.shift(); cs.queue.splice(Math.min(g===1?3:5,cs.queue.length),0,cur); } // nothing typeable to copy: just bring it back later
  }
  afterCard(cs,it.u);
}
function afterCard(cs,u){
  cs.revealed=false; cs.typed='';
  if(cs.mode==='learn'&&!cs.queue.length&&checkCardsDone(u)&&UI.study) prefetchQuiz(UI.study);
  save('cards'); save('stats');
  render(); focusCard();
}
// a missed card: copy it once with the answer in view, then it comes back and must be written from memory
function cardCopy(val){
  const cs=UI.cs; if(!cs?.copy||!cs.queue.length) return;
  const it=cs.queue[0], c=cardOf(it.u,it.id); if(!c) return;
  if(!cardKeyOk(val,c)){ toast('아직 달라. 보이는 그대로 써 봐.'); return; }
  const cur=cs.queue.shift(), g=cs.copy.g;
  (cs.recall ||= {})[cur.u+'/'+cur.id]=true;
  cs.queue.splice(Math.min(g===1?3:5,cs.queue.length),0,cur);
  cs.copy=null; afterCard(cs,cur.u);
}
function cardRecall(val, giveUp){
  const cs=UI.cs; if(!cs||cs.copy||!cs.queue.length) return;
  const it=cs.queue[0], key=it.u+'/'+it.id, c=cardOf(it.u,it.id); if(!c||!cs.recall?.[key]) return;
  if(!giveUp&&!val.trim()){ toast('기억나는 만큼 써 봐. 모르면 \'모르겠어\'를 눌러.'); return; }
  if(!giveUp&&cardKeyOk(val,c)){
    delete cs.recall[key]; cs.queue.shift();
    if(cs.mode==='learn'){ cst(it.u)[it.id]=[1,2.5,dnum()+1,1,0]; bump('k'); }
    toast('맞았어.'); afterCard(cs,it.u); return;
  }
  cs.copy={g:1, typed:giveUp?'':val, recall:true}; render(); focusCard();
}
async function startCardReview(){
  UI.sel=null; enter('cards');
  const cs=UI.cs={mode:'review', state:'loading', queue:[], revealed:false, typed:'', recall:{}, copy:null, graded:{}, done:0, total:0, counts:{1:0,2:0,3:0}};
  render(); window.scrollTo(0,0);
  await READY;
  const due=dueCards(), units=[...new Set(due.map(d=>d.u))];
  await Promise.all(units.map(u=>getCards(u)));
  const by={};
  due.forEach(d=>{ if(cardOf(d.u,d.id)) (by[d.u] ||= []).push({u:d.u,id:d.id}); else if(CARDS[d.u]) delete cst(d.u)[d.id]; });
  const qs=Object.values(by), out=[];
  while(qs.some(q=>q.length)) qs.forEach(q=>{ if(q.length) out.push(q.shift()); });
  cs.queue=out.slice(0,80); cs.total=cs.queue.length; cs.state='ready';

  if(UI.cs===cs){ render(); focusCard(); }
}
function finishQuiz(){
  const sv=UI.study, q=sv.quiz, n=NODE[sv.id];
  const valid=q.items.map((it,j)=>j).filter(j=>!q.res[j]?.void);
  if(valid.length<6){ sv.result={inconclusive:true}; sv.step='result'; render(); window.scrollTo(0,0); return; }
  const score=valid.reduce((a,j)=>a+(q.res[j]?.score||0),0)/valid.length;
  const byObj=n.obj.map((_,i)=>{ const js=valid.filter(j=>q.items[j].obj===i); return js.length? js.reduce((a,j)=>a+(q.res[j]?.score||0),0)/js.length : null; });
  const missed=byObj.map((v,i)=>v!=null&&v<0.7?i:-1).filter(i=>i>=0);
  bump('q',valid.length);
  const out=applyCheck(sv.id,score,missed);
  sv.result={score, byObj, ...out}; sv.step='result';
  render(); window.scrollTo(0,0);
}
async function gradeShort(sv, text){
  const q=sv.quiz, it=q.items[q.i], r=(q.res[q.i] ||= {});
  if(text.trim().length<15){ toast('조금 더 자세히 써 줘. 두세 문장이면 돼.'); return; }
  r.text=text; r.err=''; r.grading=true; r.t0=Date.now(); render();
  if(!ENV.sample){ r.grading=false; r.err=NOSAMPLE; render(); return; }
  try{
    const g=await ENV.sample.json(gradePrompt(NODE[sv.id],it,text),{cache:false});
    const sc=Math.max(0,Math.min(1,Number(g?.score)||0));
    const hit=(Array.isArray(g?.hit)?g.hit:[]).map(Number), wrong=String(g?.wrong||'').trim();
    const allHit=it.rubric.length?it.rubric.every((_,i)=>hit.includes(i)):sc>=0.9;
    const pass=g?.pass!==false&&allHit&&!wrong;
    r.grade={hit, wrong, feedback:String(g?.feedback||''), raw:sc};
    r.score=pass?1:0; r.done=true;
    if(!pass) logMistake(sv.id,it.q,text,it.model,[r.grade.feedback,wrong].filter(Boolean).join('\n\n'));
  }catch(e){ r.err=sampleErr(e); }
  r.grading=false;
  if(UI.study===sv){ render(); if(r.done&&r.score<1) focusCopy(); }
}
function interleave(ids){
  const by={}; ids.forEach(id=>{ (by[NODE[id].d] ||= []).push(id); });
  const qs=Object.values(by), out=[];
  while(qs.some(q=>q.length)) qs.forEach(q=>{ if(q.length) out.push(q.shift()); });
  return out;
}
async function startReview(ids){
  UI.sel=null;
  const list=interleave((ids||dueList()).slice(0,12));
  if(!list.length) return;
  enter('review');
  const rv=UI.review={ids:list, state:'loading', items:null, i:0, res:[], t0:Date.now()};
  render(); window.scrollTo(0,0);
  await READY; if(UI.review===rv) genReview(rv);
}
async function genReview(rv){
  if(!ENV.sample){ rv.state='nosample'; render(); return; }
  const ctl=new AbortController(); rv.ctl=ctl; rv.state='loading'; rv.t0=Date.now(); render();
  try{
    const by={};
    for(const x of asArray(await ENV.sample.json(reviewPrompt(rv.ids),{signal:ctl.signal, cache:false}))){
      if(!x||!rv.ids.includes(x.id)||by[x.id]) continue;
      const it=normItem(x,NODE[x.id].obj.length); if(it&&it.type!=='short') by[x.id]={...it,id:x.id};
    }
    rv.items=rv.ids.filter(id=>by[id]).map(id=>by[id]);
    if(!rv.items.length) throw {code:'invalid_json'};
    rv.state='ready';
  }catch(e){ rv.state='error'; rv.err=sampleErr(e); }
  if(UI.review===rv&&UI.view==='review') render();
}
function reviewAnswer(correct, sure, val){
  const rv=UI.review, it=rv.items[rv.i], r=(rv.res[rv.i] ||= {});
  r.done=true; r.score=correct?1:0; r.sure=sure;
  if(it.type==='mcq') r.choice=r.pick; else r.val=val;
  onReview(it.id,correct,sure);
  bump('r'); if(correct) bump('c');
  if(!correct){
    const a=it.type==='mcq'?`${MARKS[r.choice]} ${it.choices[r.choice]}`:`${val} ${it.unit}`;
    const c=it.type==='mcq'?`${MARKS[it.answer]} ${it.choices[it.answer]}`:`${fmtNum(it.answer)} ${it.unit}`;
    logMistake(it.id,it.q,a,c,it.why);
  }
  save('progress'); save('stats'); render(); if(!correct) focusCopy();
}
async function sendChat(text){
  const sv=UI.study; text=text.trim(); if(!sv||sv.chatBusy||!text) return;
  if(!ENV.sample){ toast(NOSAMPLE); return; }
  sv.chat.push({role:'user',content:text});
  const a={role:'assistant',content:'',pending:true}; sv.chat.push(a); sv.chatBusy=true; paintChat();
  const n=NODE[sv.id];
  const hist=sv.chat.slice(0,-1).filter(t=>t.content).slice(-8).map(t=>({role:t.role,content:t.content}));
  try{
    const r=await ENV.sample([{role:'user',content:chatRules(n,sv.lesson.md)},...hist],{cache:false, onText:({text})=>{ a.content=text; a.pending=false; paintChat(); }});
    a.content=r.text;
  }catch(e){ a.content=e.text||''; a.err=sampleErr(e); }
  a.pending=false; sv.chatBusy=false; paintChat();
}
async function runIdea(k){
  if(!ENV.sample){ toast(NOSAMPLE); return; }
  UI.idea?.ctl?.abort();
  const ns=NODES.filter(n=>n.ideas.includes(k)&&known(n.id)).sort(byNo);
  const ctl=new AbortController(), I=UI.idea={k, md:'', state:'writing', t0:Date.now(), ctl};
  render();
  const el=$('#idea-out'); if(el) el.scrollIntoView({block:'nearest'});
  try{
    const r=await ENV.sample(ideaPrompt(k,ns),{signal:ctl.signal, cache:false, onText:({text})=>{ if(UI.idea!==I) return; I.md=text; I.state='streaming'; paintIdea(); }});
    I.md=r.text; I.state='done';
  }catch(e){ I.md=e.text||I.md; I.state='error'; I.err=sampleErr(e); }
  if(UI.idea===I) paintIdea();
}
function goStep(sv, step){
  if(step==='quiz'&&!rec(sv.id)?.cd){ toast('암기를 먼저 끝내야 해.'); return; }
  if(step==='cards'&&sv.mode!=='test'&&!(rec(sv.id)?.rd||rec(sv.id)?.lv||known(sv.id))){ toast('설명을 끝까지 넘겨 읽어야 암기로 갈 수 있어.'); return; }
  sv.step=step; UI.cedit=null;
  if(step==='lesson'&&!sv.lesson.md&&!['writing','streaming','loading'].includes(sv.lesson.state)) loadLesson(sv,false);
  if(step==='cards'&&(!sv.cards||sv.cards.state==='error')) loadCards(sv,false,false);
  if(step==='quiz'&&(!sv.quiz||sv.quiz.state==='error')) genQuiz(sv,false);
  render(); window.scrollTo(0,0); if(step==='cards') focusCard();
}
function dropCard(u, cid){
  const items=CARDS[u]; if(!items) return;
  const c=items.find(x=>x.id===cid); if(!c) return;
  if(liveItems(u).length<=3){ toast('카드는 최소 3장은 남겨야 해.'); return; }
  c.x=true; delete cst(u)[cid]; putCards(u); save('cards');
  if(UI.cs){ const h=UI.cs.queue[0]; if(h&&h.u===u&&h.id===cid){ UI.cs.copy=null; UI.cs.revealed=false; UI.cs.typed=''; } if(UI.cs.recall) delete UI.cs.recall[u+'/'+cid]; UI.cs.queue=UI.cs.queue.filter(q=>!(q.u===u&&q.id===cid)); }
  UI.cedit=null; checkCardsDone(u); render(); toast('카드를 뺐어.');
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const act=el.dataset.act, id=el.dataset.id, sv=UI.study, rv=UI.review;
  switch(act){
    case 'nav': UI.sel=null; go(el.dataset.view); break;
    case 'sel': select(id); break;
    case 'close': select(null); break;
    case 'filter': UI.filter=el.dataset.d; UI.filterTouched=true; render(); break;
    case 'learn': openStudy(id,'learn'); break;
    case 'test': openStudy(id,'test'); break;
    case 'back': UI.sel=null; go(UI.prev); break;
    case 'step': if(sv) goStep(sv,el.dataset.step); break;
    case 'regen': if(sv) loadLesson(sv,true); break;
    case 'stop-lesson': sv?.lesson?.ctl?.abort(); break;
    case 'stop-cards': sv?.cards?.ctl?.abort(); break;
    case 'stop-quiz': sv?.quiz?.ctl?.abort(); break;
    case 'stop-review': rv?.ctl?.abort(); break;
    case 'stop-idea': UI.idea?.ctl?.abort(); break;
    case 'retry-cards': sv.cards=null; loadCards(sv,false,false); break;
    case 'regen-cards': if(sv&&!cardEntries(sv.id).length){ delete CARDS[sv.id]; sv.cards=null; if(UI.cs?.unit===sv.id) UI.cs=null; loadCards(sv,false,true); } break;
    case 'to-lesson': sv.mode='learn'; goStep(sv,'lesson'); break;
    case 'retry-quiz': { const q=sv.quiz;
      if(q?.state==='ready'&&!sv.result){ const miss=[...new Set(q.items.map((it,j)=>{ const x=q.res[j]; return x?.done&&!x.void&&x.score<1?it.obj:-1; }).filter(v=>v>=0))];
        if(miss.length){ const r=ensure(sv.id); r.miss=miss; r.at=(r.at||0)+1; bump('q',q.res.filter(x=>x?.done&&!x.void).length); save('progress'); save('stats'); } }
      sv.quiz=null; sv.result=null; goStep(sv,'quiz'); break; }
    case 'next': UI.sel=null; runNext(); break;
    case 'rd-next': rdNext(); break;
    case 'rd-prev': rdPrev(); break;
    case 'rd-ok': if(sv?.reader){ sv.reader.passed[sv.reader.i]=true; rdNext(); } break;
    case 'rd-again': if(sv?.reader) rdAgain(); break;
    case 'rd-go': if(sv?.reader){ const R=sv.reader, j=+el.dataset.i; if(R.free||j<=R.max){ R.i=j; R.toc=false; R.revealed=false; R.typed=''; paintLesson(); scrollToReader(); } } break;
    case 'rd-toc': if(sv?.reader){ sv.reader.toc=!sv.reader.toc; paintLesson(); } break;
    case 'rd-whole': if(sv?.reader){ sv.reader.whole=!sv.reader.whole; paintLesson(); scrollToReader(); } break;
    case 'cg': gradeCard(+el.dataset.g); break;
    case 'card-edit': UI.cedit={u:el.dataset.u, id:el.dataset.c, list:!!el.dataset.list}; render(); { const f=$('#ce-a'); if(f) f.focus(); } break;
    case 'card-edit-cancel': UI.cedit=null; render(); focusCard(); break;
    case 'card-drop': dropCard(el.dataset.u, el.dataset.c); break;
    case 'card-review': startCardReview(); break;
    case 'q-pick': { const q=sv.quiz; (q.res[q.i] ||= {}).pick=+el.dataset.i; render(); break; }
    case 'q-submit': { const q=sv.quiz, it=q.items[q.i], r=(q.res[q.i] ||= {}); if(r.pick==null) break;
      r.choice=r.pick; r.score=r.choice===it.answer?1:0; r.done=true;
      if(!r.score) logMistake(sv.id,it.q,`${MARKS[r.choice]} ${it.choices[r.choice]}`,`${MARKS[it.answer]} ${it.choices[it.answer]}`,it.why);
      render(); if(!r.score) focusCopy(); break; }
    case 'q-void': { const q=sv.quiz, r=q.res[q.i]; if(!r) break; r.void=true; const qt=String(q.items[q.i].q).slice(0,500); S.mistakes.items=S.mistakes.items.filter(m=>!(m.n===sv.id&&m.q===qt)); save('mistakes'); render(); toast('이 문제는 채점에서 뺐어.'); break; }
    case 'q-next': { const q=sv.quiz; if(needCopy(q.items[q.i],q.res[q.i])){ toast('먼저 핵심을 따라 써.'); focusCopy(); break; } if(q.i>=q.items.length-1) finishQuiz(); else { q.i++; render(); } break; }
    case 'review': startReview(); break;
    case 'review-one': startReview([id]); break;
    case 'retry-review': genReview(rv); break;
    case 'rv-pick': (rv.res[rv.i] ||= {}).pick=+el.dataset.i; render(); break;
    case 'rv-submit': { const it=rv.items[rv.i], r=rv.res[rv.i]; if(r?.pick==null) break; reviewAnswer(r.pick===it.answer, el.dataset.sure==='1'); break; }
    case 'rv-next': if(needCopy(rv.items[rv.i],rv.res[rv.i])){ toast('먼저 핵심을 따라 써.'); focusCopy(); break; } if(rv.i>=rv.items.length-1){ rv.state='done'; } else rv.i++; render(); window.scrollTo(0,0); break;
    case 'card-giveup': cardRecall('',true); break;
    case 'idea': runIdea(el.dataset.k); break;
    case 'mis-del': S.mistakes.items=S.mistakes.items.filter(m=>m.id!==el.dataset.k); save('mistakes'); render(); break;
    case 'reset-ask': UI.resetAsk=true; render(); break;
    case 'reset-no': UI.resetAsk=false; render(); break;
    case 'reset-do': S.profile=null; S.progress={nodes:{}}; S.cards={u:{}}; S.stats={days:{}}; S.mistakes={items:[]}; DOCS.forEach(save); UI.resetAsk=false; UI.cs=null; go('today'); toast('학습 기록을 모두 지웠어.'); break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target; e.preventDefault();
  if(f.id==='ob-form'){
    const fd=new FormData(f);
    S.profile={focus:fd.get('focus')||'all', daily:+(fd.get('daily')||1), started:Date.now()};
    save('profile'); render(); window.scrollTo(0,0);
    return;
  }
  if(f.id==='chat-form'){ const t=$('#chat-input'); const v=t.value; t.value=''; sendChat(v); return; }
  if(f.id==='chk-form'){ const R=UI.study?.reader; if(R){ R.typed=$('#chk-typed')?.value.trim()||''; R.revealed=true; paintLesson(); } return; }
  if(f.id==='reveal-form'){ if(UI.cs){ UI.cs.typed=$('#card-typed')?.value.trim()||''; UI.cs.revealed=true; render(); } return; }
  if(f.id==='card-copy-form'){ cardCopy($('#card-copy')?.value||''); return; }
  if(f.id==='card-recall-form'){ cardRecall($('#card-recall')?.value||'',false); return; }
  if(f.id==='copy-form'){
    const ns=f.dataset.ns, box=ns==='q'?UI.study?.quiz:UI.review; if(!box?.items) return;
    const it=box.items[box.i], r=box.res[box.i]; if(!needCopy(it,r)) return;
    if(!sameKey(f.querySelector('.copy-in')?.value||'',itemKey(it))){ toast('아직 달라. 보이는 그대로 써 봐.'); return; }
    r.copied=true; render(); requestAnimationFrame(()=>$(`[data-act="${ns}-next"]`)?.focus({preventScroll:true}));
    return;
  }
  if(f.id==='card-edit-form'){
    const u=f.dataset.u, c=(CARDS[u]||[]).find(x=>x.id===f.dataset.c); if(!c) return;
    const q=f.elements.q.value.trim(), a=f.elements.a.value.trim();
    if(!q||!a){ toast('앞면과 뒷면은 비울 수 없어.'); return; }
    c.q=q; c.a=a; c.t=deTex(f.elements.t.value).slice(0,150); c.h=f.elements.h.value.trim(); putCards(u); UI.cedit=null; render(); focusCard(); toast('카드를 고쳤어.');
    return;
  }
  if(f.classList.contains('ans-form')){
    const ns=f.dataset.ns, kind=f.dataset.kind;
    if(kind==='short'){ gradeShort(UI.study,f.elements.short.value); return; }
    const raw=f.elements.num.value, v=parseNum(raw);
    if(isNaN(v)){ toast('숫자로 써 줘. 예: 12.5, 3e8, 6.0×10^23'); return; }
    if(ns==='q'){
      const sv=UI.study, q=sv.quiz, it=q.items[q.i], r=(q.res[q.i] ||= {});
      r.val=raw; r.score=Math.abs(v-it.answer)<=Math.max(Math.abs(it.answer)*it.tol,1e-12)?1:0; r.done=true;
      if(!r.score) logMistake(sv.id,it.q,`${raw} ${it.unit}`,`${fmtNum(it.answer)} ${it.unit}`,it.why);
      render(); if(!r.score) focusCopy();
    } else {
      const it=UI.review.items[UI.review.i];
      reviewAnswer(Math.abs(v-it.answer)<=Math.max(Math.abs(it.answer)*it.tol,1e-12), e.submitter?.value==='1', raw);
    }
  }
});
document.addEventListener('change',e=>{
  const t=e.target; if(!S.profile||t.type!=='radio') return;
  if(t.name==='pf-focus'){ S.profile.focus=t.value; save('profile'); }
  else if(t.name==='pf-daily'){ S.profile.daily=+t.value; save('profile'); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.sel){ select(null); return; }
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chat-input'){ e.preventDefault(); $('#chat-form').requestSubmit(); return; }
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const rdOn=UI.view==='study'&&UI.study?.step==='lesson'&&UI.study.reader&&!UI.study.reader.whole;
  if(rdOn&&!inField&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==='ArrowLeft'){ e.preventDefault(); rdPrev(); return; }
    if(e.key==='ArrowRight'||((e.key===' '||e.key==='Enter')&&e.target.tagName!=='BUTTON')){ e.preventDefault(); const b=$('.rd-next'); if(b&&!b.disabled) rdNext(); return; }
  }
  const cardOn=UI.cs&&UI.cs.queue?.length&&!UI.cedit&&((UI.view==='cards')||(UI.view==='study'&&UI.study?.step==='cards'));
  if(!cardOn||e.metaKey||e.ctrlKey||e.altKey) return;
  if(!UI.cs.revealed){ if(!inField&&e.target.tagName!=='BUTTON'&&$('#reveal-form')&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); $('#reveal-form').requestSubmit(); } return; }
  if(!inField&&['1','2','3'].includes(e.key)){ e.preventDefault(); gradeCard(+e.key); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='chk-typed'&&UI.study?.reader) UI.study.reader.typed=e.target.value;
  if(e.target.classList?.contains('copy-in')){ const f=e.target.form; if(f) f.classList.toggle('ok',sameKey(e.target.value,f.dataset.key)); }
});
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(ROUTES.includes(h)&&h!==UI.view){ UI.view=h; render(); } });
let rsT; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(UI.view==='map') drawLinks(); },120); });
setInterval(()=>{ document.querySelectorAll('[data-t0]').forEach(el=>{ const o=el.querySelector('.el'); if(o) o.textContent=Math.max(0,Math.round((Date.now()-(+el.dataset.t0))/1000))+'초'; }); },1000);

{ const h=location.hash.slice(1); if(ROUTES.includes(h)) UI.view=h; }
READY=boot();
</script>
