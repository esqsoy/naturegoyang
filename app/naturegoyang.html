<title>과학고양</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{
  /* Layout: sticky top bar + one working column. The unit map is a periodic-table grid: 5 domain blocks (19 tile columns) x 4 tiers. */
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9;
  --ink:#111923; --ink-2:#465364; --ink-3:#7C8998; --line:#D0D7E0; --line-2:#E2E7ED;
  --focus:#1F5EFF; --on-fill:#FFFFFF;
  --d-f:#5A687B; --d-p:#2A58D6; --d-c:#C25F0C; --d-b:#1D8653; --d-e:#7444C2;
  --good:#1B8348; --warn:#A5680F; --bad:#C2352A;
  --shadow:0 12px 32px rgb(16 26 38 / .14);
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-read:"Noto Serif KR","AppleMyungjo","Batang",serif;
  --font-mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1218; --surface:#151C25; --surface-2:#1B2430;
  --ink:#E4EBF3; --ink-2:#A3AFBD; --ink-3:#6E7B8A; --line:#2B3644; --line-2:#222C38;
  --focus:#7FA4FF; --on-fill:#0D1218;
  --d-f:#98A6B8; --d-p:#7495FF; --d-c:#F09A4E; --d-b:#4FC68A; --d-e:#B391F2;
  --good:#4CC57E; --warn:#E3AA3E; --bad:#F06C60;
  --shadow:0 12px 32px rgb(0 0 0 / .5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#151C25; --surface-2:#1B2430;
  --ink:#E4EBF3; --ink-2:#A3AFBD; --ink-3:#6E7B8A; --line:#2B3644; --line-2:#222C38;
  --focus:#7FA4FF; --on-fill:#0D1218;
  --d-f:#98A6B8; --d-p:#7495FF; --d-c:#F09A4E; --d-b:#4FC68A; --d-e:#B391F2;
  --good:#4CC57E; --warn:#E3AA3E; --bad:#F06C60;
  --shadow:0 12px 32px rgb(0 0 0 / .5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
h1,h2,h3{text-wrap:balance}
kbd{font:500 10.5px/1 var(--font-mono); padding:2px 4px; border:1px solid currentColor; border-radius:3px; opacity:.6}

/* top bar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1440px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; align-items:center; gap:20px; min-height:58px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; font:700 16px/1 var(--font-ui); color:var(--ink); background:none; border:0; padding:0; cursor:pointer; white-space:nowrap}
.brand-tile{position:relative; width:32px; height:35px; border:1.5px solid var(--ink); border-radius:3px; display:grid; place-items:center; font:700 14px/1 var(--font-ui); padding-top:4px}
.brand-tile i{position:absolute; top:3px; left:4px; font:500 8px/1 var(--font-mono); font-style:normal}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin-left:auto; max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; border:0; background:none; padding:9px 12px; font:500 14px/1 var(--font-ui); color:var(--ink-2); border-radius:6px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
.tab:hover{color:var(--ink); background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--ink); font-weight:600; box-shadow:inset 0 -2px 0 var(--ink); border-radius:6px 6px 0 0}
.badge{font:600 11px/1 var(--font-mono); padding:3px 6px; border-radius:99px; background:var(--warn); color:var(--surface)}
@media (max-width:720px){ .tabs{margin-left:0; width:100%; padding-bottom:4px} .topbar-in{gap:6px; padding-block:10px 0} }
.banner{background:color-mix(in srgb,var(--warn) 13%,var(--surface)); border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,var(--surface)); font-size:13.5px; color:var(--ink)}
.banner-in{max-width:1440px; margin:0 auto; padding-block:9px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}

main{max-width:1240px; margin:0 auto; padding-block:28px 72px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
main.view-map{max-width:1480px}

/* type */
h1{font:700 clamp(25px,3vw,33px)/1.25 var(--font-ui); letter-spacing:-.015em; margin:0}
.eyebrow{font:500 12px/1.4 var(--font-mono); letter-spacing:.05em; color:var(--ink-3); margin:0 0 8px}
.lede{color:var(--ink-2); max-width:64ch; margin:10px 0 0; font-size:15.5px}
.hint{font-size:13px; color:var(--ink-3); margin:8px 0 0}
.label{font:600 12px/1.4 var(--font-ui); color:var(--ink-3); letter-spacing:.03em; margin:0 0 8px; display:block}
.pagehead{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px}

/* controls */
.btn{appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 14px/1.2 var(--font-ui); padding:11px 16px; border-radius:7px; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 84%,var(--surface))}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px; font-size:13px}
.btn.danger{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.linkbtn{appearance:none; background:none; border:0; padding:0; font:500 13px/1.4 var(--font-ui); color:var(--ink-3); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:16px}
.pill{display:inline-flex; align-items:center; font:600 11.5px/1 var(--font-ui); padding:5px 8px; border-radius:99px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line-2); white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 13%,var(--surface)); color:var(--good); border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface)); color:var(--warn); border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface)); color:var(--bad); border-color:transparent}
.note{padding:12px 14px; border-radius:8px; background:var(--surface-2); color:var(--ink-2); font-size:14px; margin:0 0 12px}
.note.bad{background:color-mix(in srgb,var(--bad) 9%,var(--surface)); color:var(--ink)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:22px}
.busy{display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px dashed var(--line); border-radius:8px; color:var(--ink-2); font-size:14px; flex-wrap:wrap; background:var(--surface)}
.busy .el{color:var(--ink-3); font-size:12.5px}
.spin{display:inline-block; width:15px; height:15px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--ink); animation:spin .9s linear infinite; flex:none; vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:11px 16px; border-radius:8px; font-size:14px; z-index:60; max-width:calc(100% - 32px); box-shadow:var(--shadow)}
textarea,input[type="text"],input:not([type]){width:100%; font:15px/1.6 var(--font-ui); color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:8px; padding:10px 12px; resize:vertical}
textarea:focus,input:focus{outline:none; border-color:var(--ink)}

/* element tiles */
.tile{--dc:var(--d-f); position:relative; width:var(--tw,68px); height:var(--th,76px); display:flex; flex-direction:column; justify-content:space-between; padding:5px 6px 6px; border-radius:4px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink-3); font-family:var(--font-ui); text-align:left; cursor:pointer; transition:opacity .15s, transform .15s, border-color .15s}
button.tile:hover{transform:translateY(-1px); border-color:var(--dc)}
.t-no{font:500 10px/1 var(--font-mono)}
.t-sym{font:700 calc(var(--tw,68px) * .33)/1 var(--font-ui); letter-spacing:-.02em}
.t-name{font:500 10px/1.15 var(--font-ui); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.t-due{position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--warn); box-shadow:0 0 0 2px var(--surface)}
.tile.s-locked{border-style:dashed}
.tile.s-ready{border-color:var(--dc); background:var(--surface); color:var(--ink)}
.tile.s-ready .t-sym{color:var(--dc)}
.tile.s-learning{border-color:var(--dc); color:var(--ink); background:linear-gradient(to top,color-mix(in srgb,var(--dc) 26%,var(--surface)) 50%,var(--surface) 50%)}
.tile.s-learning .t-sym{color:var(--dc)}
.tile.s-mastered,.tile.s-shaky,.tile.s-solid{border-color:var(--dc); background:var(--dc); color:var(--on-fill)}
.tile.s-solid{box-shadow:inset 0 0 0 2px var(--dc), inset 0 0 0 3.5px var(--on-fill)}
.tile.s-shaky::after{content:""; position:absolute; left:-1.5px; bottom:-1.5px; border-style:solid; border-width:14px 0 0 14px; border-color:transparent transparent transparent var(--bad)}
.tile.lg{--tw:104px; --th:116px; cursor:default; padding:8px 10px 10px; flex:none}
.tile.lg .t-no{font-size:12px}
.tile.lg .t-name{font-size:12px}
.tile.lg .t-due{top:8px; right:8px}
.tile.lg.s-solid{box-shadow:inset 0 0 0 3px var(--dc), inset 0 0 0 5px var(--on-fill)}

.chip{--dc:var(--d-f); display:inline-flex; align-items:center; gap:8px; padding:3px 10px 3px 3px; border:1px solid var(--line); border-radius:6px; background:var(--surface); font:500 13px/1.3 var(--font-ui); color:var(--ink); cursor:pointer; max-width:100%; text-align:left}
.chip:hover{border-color:var(--dc)}
.chip .c-sym{width:27px; height:27px; border-radius:4px; display:grid; place-items:center; font:700 11.5px/1 var(--font-ui); border:1.5px solid var(--dc); color:var(--dc); flex:none; background:var(--surface)}
.chip .c-t{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip small{display:block; font-size:11px; color:var(--ink-3)}
.chip.s-mastered .c-sym,.chip.s-shaky .c-sym,.chip.s-solid .c-sym{background:var(--dc); color:var(--on-fill)}
.chip.s-solid .c-sym{box-shadow:inset 0 0 0 1.5px var(--on-fill)}
.chip.s-shaky .c-sym{box-shadow:inset -4px -4px 0 -2px var(--bad)}
.chip.s-learning .c-sym{background:linear-gradient(to top,color-mix(in srgb,var(--dc) 30%,var(--surface)) 50%,var(--surface) 50%)}
.chip.s-locked .c-sym{border-style:dashed; border-color:var(--line); color:var(--ink-3)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.more{align-self:center; font-size:13px; color:var(--ink-3)}

/* today */
.today-grid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start}
.col{display:grid; gap:20px; min-width:0}
@media (max-width:920px){ .today-grid{grid-template-columns:minmax(0,1fr)} }
.step-h{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.step-h h2{font:700 18px/1.2 var(--font-ui); margin:0}
.step-h .pill{margin-left:auto}
.step-n{font:600 12px/1 var(--font-mono); width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ink); display:grid; place-items:center; flex:none}
.newc{display:grid; grid-template-columns:auto minmax(0,1fr); gap:22px; align-items:start}
@media (max-width:520px){ .newc{grid-template-columns:minmax(0,1fr)} }
.newc-t{font:700 22px/1.3 var(--font-ui); margin:0}
.newc-q{font:600 17px/1.6 var(--font-read); color:var(--ink-2); margin:6px 0 12px}
.objs-mini{margin:0; padding-left:1.15em; color:var(--ink-2); font-size:14px}
.objs-mini li{margin:3px 0}
.phase{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0; padding:0; list-style:none; font-size:12.5px}
.phase li{padding:4px 9px; border-radius:99px; border:1px solid var(--line); color:var(--ink-3)}
.phase li.done{border-color:transparent; background:color-mix(in srgb,var(--good) 13%,var(--surface)); color:var(--good)}
.phase li.on{border-color:var(--ink); color:var(--ink); font-weight:600}
.alt{margin-top:20px; padding-top:16px; border-top:1px solid var(--line-2)}
.hero{border-color:color-mix(in srgb,var(--ink) 45%,var(--line))}
.next-t{font:700 22px/1.35 var(--font-ui); margin:0}
.next-s{font:600 16px/1.6 var(--font-read); color:var(--ink-2); margin:6px 0 0}
.strip{display:flex; gap:4px; overflow-x:auto; padding:6px 4px 10px; margin:18px -4px 0; --tw:58px; --th:64px}
.strip .tile{flex:none}
.lprog{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; font-size:12.5px; color:var(--ink-2); margin-top:6px}
.side h3{font:700 15px/1.3 var(--font-ui); margin:0 0 14px}
.big-line{margin:0 0 14px; font-size:14px; color:var(--ink-2)}
.big-line b{font-size:26px; color:var(--ink); font-weight:600; margin-right:2px}
.prows{display:grid; gap:10px}
.prow{display:grid; grid-template-columns:74px minmax(0,1fr) 44px; gap:10px; align-items:center; font-size:13px}
.prow.cur span:first-child{font-weight:700}
.pr-c{text-align:right; color:var(--ink-2); font-size:12px}
.dbar{display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--line-2)}
.dbar i{display:block; height:100%}
.dbar .s{background:var(--ink)}
.dbar .m{background:color-mix(in srgb,var(--ink) 55%,var(--surface))}
.dbar .l{background:color-mix(in srgb,var(--ink) 22%,var(--surface))}
.legend-s{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; font-size:12px; color:var(--ink-3)}
.legend-s span{display:inline-flex; align-items:center; gap:5px}
.sw{display:inline-block; width:10px; height:10px; border-radius:2px}
.sw.s{background:var(--ink)}
.sw.m{background:color-mix(in srgb,var(--ink) 55%,var(--surface))}
.sw.l{background:color-mix(in srgb,var(--ink) 22%,var(--surface))}
.act{display:grid; grid-template-columns:repeat(14,1fr); gap:4px; align-items:end; height:78px; border-bottom:1px solid var(--line)}
.act-col{position:relative; display:flex; flex-direction:column-reverse; height:100%}
.act-col i{display:block; width:100%; border-radius:2px 2px 0 0}
.act-col .a-q{background:var(--ink)}
.act-col .a-k{background:color-mix(in srgb,var(--ink) 30%,var(--surface))}
.act-col .a-n{position:absolute; top:-2px; left:50%; transform:translateX(-50%); font:600 10px/1 var(--font-mono); color:var(--good)}
.act-x{display:flex; justify-content:space-between; font:500 11px/1 var(--font-mono); color:var(--ink-3); margin-top:6px}
.sw.a-q{background:var(--ink)}
.sw.a-k{background:color-mix(in srgb,var(--ink) 30%,var(--surface))}

/* onboarding */
.onboard{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:32px; align-items:start}
@media (max-width:920px){ .onboard{grid-template-columns:minmax(0,1fr)} }
.onboard h1{font-size:clamp(26px,3.4vw,36px)}
.loop{list-style:none; padding:0; margin:26px 0 0; display:grid; gap:2px; counter-reset:lp}
.loop li{display:grid; grid-template-columns:30px 54px minmax(0,1fr); gap:10px; align-items:baseline; padding:12px 0; border-top:1px solid var(--line); counter-increment:lp}
.loop li::before{content:counter(lp); font:600 13px/1 var(--font-mono); color:var(--ink-3)}
.loop span{color:var(--ink-2); font-size:14.5px}
.mini-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:22px}
fieldset{border:0; padding:0; margin:0 0 20px; min-width:0}
legend{font:700 14.5px/1.3 var(--font-ui); margin-bottom:10px; padding:0}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{position:relative; display:block}
.opt input{position:absolute; opacity:0; pointer-events:none}
.opt-b{display:flex; flex-direction:column; gap:2px; padding:10px 13px; border:1.5px solid var(--line); border-radius:8px; cursor:pointer; background:var(--surface); font-size:14px}
.opt input:checked + .opt-b{border-color:var(--ink); background:var(--surface-2)}
.opt input:focus-visible + .opt-b{outline:2px solid var(--focus); outline-offset:2px}

/* map */
.map-tools{display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px 24px; align-items:center; margin-bottom:18px}
.filters{display:flex; flex-wrap:wrap; gap:6px}
.fbtn{--dc:var(--ink); display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font:500 13px/1 var(--font-ui); cursor:pointer}
.fbtn i{width:9px; height:9px; border-radius:2px; background:var(--dc)}
.fbtn[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); font-weight:600}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--ink-3); align-items:center}
.legend span{display:inline-flex; align-items:center; gap:6px}
.lgd{--dc:var(--ink-2); display:inline-block; width:14px; height:15px; border-radius:2px; border:1.5px solid var(--line); background:var(--bg)}
.lgd.s-locked{border-style:dashed}
.lgd.s-ready{border-color:var(--dc); background:var(--surface)}
.lgd.s-learning{border-color:var(--dc); background:linear-gradient(to top,color-mix(in srgb,var(--dc) 35%,var(--surface)) 50%,var(--surface) 50%)}
.lgd.s-mastered{border-color:var(--dc); background:var(--dc)}
.lgd.s-solid{border-color:var(--dc); background:var(--dc); box-shadow:inset 0 0 0 1.5px var(--surface)}
.lgd.s-shaky{border-color:var(--dc); background:linear-gradient(45deg,var(--bad) 30%,var(--dc) 30%)}
.lg-due{width:8px; height:8px; border-radius:50%; background:var(--warn)}
.pt-wrap{--tg:4px; --tierw:46px; --tw:clamp(54px, calc((min(100vw, 1480px) - 56px - var(--tierw) - 70px - 16 * var(--tg)) / 21), 74px); --th:calc(var(--tw) * 1.12); position:relative; overflow-x:auto; padding:4px 4px 10px; margin-inline:-4px}
.pt{position:relative; z-index:1; display:grid; column-gap:14px; row-gap:16px; width:max-content}
.pt-links{position:absolute; top:0; left:0; pointer-events:none; z-index:0; overflow:visible}
.lk{fill:none; stroke-width:1.7}
.lk.pre{stroke:var(--ink-2); stroke-dasharray:4 3}
.lk.post{stroke:var(--ink)}
.pt-dh{--dc:var(--ink); border-top:3px solid var(--dc); padding-top:7px; display:flex; justify-content:space-between; align-items:baseline; gap:6px; font:700 13px/1.2 var(--font-ui); white-space:nowrap}
.pt-dh .mono{font-weight:500; font-size:11.5px; color:var(--ink-3)}
.pt-tier{display:flex; flex-direction:column; gap:3px; padding-top:6px; border-top:1px solid var(--line)}
.pt-tier b{font:600 22px/1 var(--font-mono)}
.pt-tier span{font-size:11px; color:var(--ink-3)}
.pt-cell{display:grid; gap:var(--tg); align-content:start}
.pt.has-sel .tile{opacity:.3}
.pt.has-sel .tile.rel{opacity:1}
.tile.sel{outline:2.5px solid var(--ink); outline-offset:2px}

/* drawer */

.dr-top{display:flex; justify-content:flex-end; margin-bottom:6px}

.dr-q{font:600 17px/1.6 var(--font-read); color:var(--ink-2); margin:18px 0 14px}
.facts{display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; margin:0 0 6px; font-size:13.5px}

.drawer section{margin-top:22px}
.drawer h3{font:700 13.5px/1.3 var(--font-ui); margin:0 0 10px; color:var(--ink-2)}

.objs li{margin:5px 0}
.idea-tag{display:inline-block; font-size:12.5px; padding:4px 9px; border-radius:99px; border:1px solid var(--line); color:var(--ink-2)}

/* study */

.study-q{font:600 clamp(17px,2.1vw,21px)/1.55 var(--font-read); color:var(--ink-2); margin:8px 0 0}
.stepper{display:flex; flex-wrap:wrap; gap:6px; list-style:none; padding:0; margin:16px 0 0; font-size:13px}
.stepper li{display:flex; align-items:center; gap:6px}
.stepper li + li::before{content:""; width:18px; height:1px; background:var(--line); margin-right:2px}
.stepper button{appearance:none; background:none; border:0; padding:3px 4px; display:flex; align-items:center; gap:6px; color:var(--ink-3); font:500 13px/1 var(--font-ui); cursor:pointer; border-radius:6px}

.stepper button:not(:disabled):hover{color:var(--ink)}

.study-grid{display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:36px; align-items:start}

.lesson{min-width:0; max-width:74ch}

.side-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px}
.side-card h3{font:700 13.5px/1.3 var(--font-ui); margin:0 0 10px; color:var(--ink-2)}
.lesson-foot{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:28px; padding-top:20px; border-top:1px solid var(--line)}
.stream-note{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-3); margin-top:10px}
.chat-log{display:grid; gap:8px; max-height:380px; overflow-y:auto; margin-bottom:10px}
.msg{padding:9px 11px; border-radius:8px; font-size:14px; line-height:1.6}
.msg.me{background:var(--surface-2); justify-self:end; max-width:92%; white-space:pre-wrap}
.msg.ai{border:1px solid var(--line-2)}
.msg.ai.md{font-family:var(--font-ui); font-size:14px; line-height:1.65}
.chat-form{display:grid; gap:8px}
.chat-btns{display:flex; gap:8px; flex-wrap:wrap}
.chat-btns .btn{flex:1 1 auto}
.fix-list{display:grid; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line-2)}
.fix-h{margin:0; font:600 12px/1.3 var(--font-ui); color:var(--ink-3)}
.fix-i{font-size:13px; line-height:1.55; color:var(--ink)}

/* reading */
.md{font-family:var(--font-read); font-size:17px; line-height:1.9; color:var(--ink); counter-reset:sec; overflow-wrap:break-word}
@media (max-width:600px){ .md{font-size:16px} }

.md h2:first-child{border-top:0; padding-top:0}
.md h3{font:700 17.5px/1.45 var(--font-ui); margin:1.8em 0 .7em}
.md h4{font:600 15px/1.45 var(--font-ui); margin:1.3em 0 .4em}
.md p{margin:0 0 1em}
.md ul,.md ol{padding-left:1.3em; margin:0 0 1em}

.md.sum ul{list-style:none; padding:0}
.md.sum li{padding:10px 14px; margin:.55em 0; border-left:3px solid var(--dc,var(--ink)); background:var(--surface-2); border-radius:0 8px 8px 0}
.preview{margin-top:1.4em; padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2)}

.term-chips{display:flex; flex-wrap:wrap; gap:6px; margin:0}
.tchip{font:600 13.5px/1.2 var(--font-ui); padding:6px 10px; border-radius:99px; background:var(--surface); border:1px solid var(--line)}
.recap{margin:18px 0 6px; padding:14px 16px; border-radius:10px; border:1px solid color-mix(in srgb,var(--dc,var(--ink)) 35%,var(--line)); background:color-mix(in srgb,var(--dc,var(--ink)) 5%,var(--surface)); font-size:16px; line-height:1.75}
.recap .eyebrow{margin:0 0 6px}
.recap .recap-d{margin:0; padding-left:1.1em}
.recap .recap-d li{margin:.3em 0}
.md .layer{margin:0 0 1.3em; padding:2px 0 2px 16px; border-left:3px solid var(--line)}
.md .layer > :last-child{margin-bottom:0}
.md .layer.l-int{border-left-color:color-mix(in srgb,var(--dc,var(--ink)) 35%,var(--surface))}
.md .layer.l-std{border-left-color:color-mix(in srgb,var(--dc,var(--ink)) 75%,var(--surface))}

.md .ly-h{margin:0 0 .35em; display:flex; flex-wrap:wrap; gap:6px; align-items:center}

math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math",math; font-size:1.06em}
.md .math-block math{font-size:1.15em}
.xref{--dc:var(--ink); display:inline-flex; align-items:center; gap:5px; padding:0 7px 0 2px; margin:0 1px; border:1px solid var(--line); border-radius:5px; background:var(--surface); font:600 .82em/1.7 var(--font-ui); color:var(--ink); cursor:pointer; vertical-align:baseline}
.xref span{font:700 .85em/1 var(--font-ui); color:var(--on-fill); background:var(--dc); border-radius:3px; padding:2px 4px}
.xref:hover{border-color:var(--dc)}
.xref.xnum{padding:0 5px; border-color:color-mix(in srgb,var(--dc) 45%,var(--line)); font-variant-numeric:tabular-nums}

/* one-screen reader */

.graph{margin:18px 0}

.g-c0{--gc:var(--ink-2)} .g-c1{--gc:var(--d-p)} .g-c2{--gc:var(--d-c)} .g-c3{--gc:var(--d-b)} .g-c4{--gc:var(--d-e)} .g-c5{--gc:var(--bad)}
.g-line{fill:none; stroke:var(--gc); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.g-line.dash{stroke-dasharray:7 6} .g-line.dot{stroke-dasharray:1.5 5} .g-line.thin{stroke-width:1.5} .g-line.bold{stroke-width:4}
.g-fill{fill:var(--gc); opacity:.22}
.g-bar{fill:var(--gc); fill-opacity:.22; stroke:var(--gc); stroke-width:1}
.g-head{fill:var(--gc)}

.g-ctl{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:10px}

.graph figcaption{margin-top:8px; font:13.5px/1.55 var(--font-ui); color:var(--ink-2)}

.rd-obj{margin:-6px 0 16px; padding:8px 12px; border-left:3px solid var(--dc,var(--d-p)); background:var(--surface-2); border-radius:0 8px 8px 0; font:14px/1.55 var(--font-ui); color:var(--ink-2)}

.rd-bar .seg.bk{flex:0 0 16px}

const GREEK_NAME={}; for(const [k,v] of Object.entries(GREEK)) if(!GREEK_NAME[v]) GREEK_NAME[v]=k.replace(/^var/,'');
function texPlain(t){
  t=t.replace(/\\([A-Za-z]+)/g,(m,w)=>GREEK[w]??TEXSYM[w]??m); // symbols first, before unwrapping glues letters onto them (\circ\text{C})
  for(let i=0,prev='';i<8&&prev!==t;i++){ // innermost braces first, so nested fractions and scripts unwrap
    prev=t;
    t=t.replace(/\\(?:mathrm|text|textrm|mathbf|mathit|mathsf|operatorname|vec|boldsymbol|bar|hat|tilde|dot|ddot|overline|underline)\s*\{([^{}]*)\}/g,'$1')
      .replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(m,a,b)=>[a,b].map(x=>/^[^\s+\-−=/]+$/.test(x)?x:`(${x})`).join('/'))
      .replace(/\\sqrt\s*\{([^{}]*)\}/g,'√($1)')
      .replace(/([_^])\{([^{}]*)\}/g,'$1$2');
  }
  return t.replace(/\\([A-Za-z]+)/g,(m,w)=>GREEK[w]??TEXSYM[w]??w)
    .replace(/\\[,;:! ]/g,' ').replace(/\\\\/g,' ').replace(/\\([%#&])/g,'$1').replace(/[{}]/g,'').replace(/([_^])\s+/g,'$1');
}
function deTex(s){
  return String(s||'')
    .replace(/\$\$?([^$]+)\$\$?/g,(m,t)=>texPlain(t))
    .replace(/\[\[([a-z]-[a-z]+)(?:\|([^\]]+))?\]\]/g,(m,id,l)=>l==='#'?(NODE[id]?`${NODE[id].no}번`:id):l||NODE[id]?.t||id)
    .replace(/\*\*|__|`/g,'').replace(/\s+/g,' ').trim();
}

function typeKey(s){
  let x=String(s||'').normalize('NFKC');
  for(const [re,to] of SYM_ASCII) x=x.replace(re,to);
  return x.replace(/[Ͱ-Ͽ]/g,c=>GREEK_NAME[c]||c)
    .replace(/[−–—]/g,'-').replace(/[×*]/g,'x')
    .replace(/\.(?!\d)/g,'')
    .replace(/[\s,;:!?'"“”‘’()[\]{}「」『』《》〈〉_^°·⋅ㆍᆞ・•‧…]/g,'');

    .replace(/^[\s·,]+|[\s·,]+$/g,'');

function dueCards(){ const t=dnum(), out=[]; for(const [u,m] of Object.entries(S.cards.u)){ if(!NODE[u]) continue; for(const [id,v] of Object.entries(m)) if(v[2]<=t) out.push({u,id,nx:v[2]}); } return out.sort((a,b)=>a.nx-b.nx); }
function nextCardDay(){ let min=Infinity, c=0; const t=dnum(); for(const m of Object.values(S.cards.u)) for(const v of Object.values(m)){ if(v[2]>t){ if(v[2]<min){min=v[2]; c=1;} else if(v[2]===min) c++; } } return isFinite(min)?{t:dnumTime(min),count:c}:null; }
function nextReview(){
  let min=Infinity;
  for(const n of NODES){ if(known(n.id)&&!isDue(n.id)) min=Math.min(min,rec(n.id).nx||Infinity); }
  if(!isFinite(min)) return null;
  const ds=dayStart(min);
  return {nx:min, count:NODES.filter(n=>known(n.id)&&dayStart(rec(n.id).nx)===ds).length};
}
function counts(filter){
  const ns=NODES.filter(filter||(()=>true));
  const c={total:ns.length, solid:0, mastered:0, shaky:0, learning:0};
  ns.forEach(n=>{ const s=st(n.id); if(s in c) c[s]++; });
  c.done=c.solid+c.mastered+c.shaky;
  return c;
}
function currentTier(){ for(const t of [1,2,3,4]){ const c=counts(n=>n.tier===t); if(c.done<c.total) return t; } return 4; }
function candidates(){
  const focus=S.profile?.focus||'all';
  const pool=NODES.filter(n=>{const s=st(n.id); return s==='ready'||s==='learning';});
  const feeds=new Set();
  if(focus!=='all'){
    const stack=NODES.filter(n=>n.d===focus&&!known(n.id)).map(n=>n.id);
    while(stack.length){ const x=stack.pop(); for(const p of NODE[x].pre){ if(!feeds.has(p)){ feeds.add(p); stack.push(p); } } }
  }
  const ratio={};
  for(const d of DKEYS){ const ns=NODES.filter(n=>n.d===d); ratio[d]=ns.filter(n=>known(n.id)).length/ns.length; }
  const grp=n=> st(n.id)==='learning'?0 : focus==='all'?1 : n.d===focus?1 : feeds.has(n.id)?2 : 3;
  return pool.sort((a,b)=>grp(a)-grp(b)||a.tier-b.tier||(focus==='all'?ratio[a.d]-ratio[b.d]:0)||a.no-b.no);
}
/* the straight line: 1 -> TOTAL, reviews and repairs first */
function lineUnit(){

  const n=ORDER.find(n=>!known(n.id)); return n?{n, how:st(n.id)==='learning'?'resume':'new'}:null;
}

  const gt=mixGateTier(); if(gt&&!ORDER.some(n=>rec(n.id)?.s==='shaky')) return {kind:'mix', count:tierMixLeft(gt), all:true};
  const mq=mixQuotaLeft(); if(mq>0){ const p=mixPool(false).count; if(p) return {kind:'mix', count:Math.min(mq,p)}; }

  if(l&&l.how==='new'){ const k=ideaDue(); if(k) return {kind:'idea', k}; } // 큰 개념 잇기는 단원을 마치고 새 단원을 열기 직전에만

}

/* 공부 시간(분): 공부 화면(설명·카드·확인·교재, 카드 복습, 응용 복습)이 보이고 3분 안에 손을 댔을 때만 15초씩 센다.

function streak(){

  let t=dayStart(), n=0;
  if(!has(t)) t-=DAY;
  while(has(t)){ n++; t-=DAY; }

/* mastery and spaced repetition */
function applyCheck(id, score, missed){
  const lockedBefore=new Set(NODES.filter(n=>st(n.id)==='locked').map(n=>n.id));
  const r=ensure(id); r.at=(r.at||0)+1; r.sc=score; r.ls=Date.now();
  const wasKnown=known(id), passed=score>=PASS-1e-9;
  // a unit with textbook problems is mastered only when they are all solved alone too (PRINCIPLES 2-5)
  if(passed){ r.qp=1; r.miss=[]; if(wasKnown||bookDone(id)) grantMastery(id); else r.s='learning'; }
  else { if(known(id)){ r.s='shaky'; r.nx=dayStart()+DAY; } else { r.s='learning'; r.qp=0; } r.miss=missed; } // 다시 친 확인에서 떨어지면 예전 통과도 지운다
  const unlocked=NODES.filter(n=>lockedBefore.has(n.id)&&st(n.id)==='ready').map(n=>n.id);
  save('progress'); save('stats');
  return {passed, mastered:known(id), unlocked};
}
function onReview(id, correct, sure){
  const r=ensure(id); r.ls=Date.now();
  if(!correct){ r.lp=(r.lp||0)+1; r.ez=Math.max(1.3,(r.ez||2.5)-0.2); r.rp=0; r.iv=1; r.s='shaky'; r.nx=dayStart()+DAY; return; }
  r.rp=(r.rp||0)+1;
  if(sure){ r.ez=Math.min(3,(r.ez||2.5)+0.05); r.iv=Math.max((r.iv||1)+1,Math.round((r.iv||1)*r.ez)); }
  else { r.ez=Math.max(1.3,(r.ez||2.5)-0.15); r.iv=Math.max(1,Math.round((r.iv||1)*1.2)); }
  if(r.s!=='shaky') r.s='mastered'; r.nx=dayStart()+r.iv*DAY; // 흔들림은 응용 복습 하나로 풀리지 않고 확인 100점으로만 풀린다(3절)
}
/* 카드 간격: FSRS-5(기본 매개변수, 다음 복습 때 떠올릴 확률 90 %에 맞춤, 26.11.25). 예전 SM-2 꼴은 '알았어'에도 쉬움 계수가
   오르지 않아 간격이 줄기만 했고, 늦게 한 복습을 셈하지 못했다(팀원 검토). FSRS는 카드마다 안정도 S(이만큼 지나면 떠올릴 확률 90 %)와
   어려움 D(1~10)를 두고, 실제로 지난 날 수에서 떠올릴 확률을 계산해 다음 간격을 정한다(Ye 외 2022, 오픈소스 FSRS 벤치마크).
   기록: [간격, D, 다음 날, 이어 맞힌 수, 잊은 수, S, 마지막 날]. 예전 5칸 기록도 읽는다. 1 몰랐어=Again, 2 헷갈렸어=Hard, 3 알았어=Good. */
const FW=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const F_DECAY=-0.5, F_FACTOR=19/81, F_RET=0.9;
const fClampD=d=>Math.min(10,Math.max(1,d));
const fD0=g=>fClampD(FW[4]-Math.exp(FW[5]*(g-1))+1);
const fIvl=S=>Math.min(3650,Math.max(1,Math.round(S/F_FACTOR*(Math.pow(F_RET,1/F_DECAY)-1))));
const fFuzz=iv=>{ if(iv<3) return iv; const f=Math.max(1,Math.round(iv*0.05)); return iv+Math.round((Math.random()*2-1)*f); }; // 같은 날 몰리지 않게
function fsrsNext(S,D,t,g){
  const R=Math.pow(1+F_FACTOR*Math.max(0,t)/S,F_DECAY);
  const S2=g===1? Math.min(S, FW[11]*Math.pow(D,-FW[12])*(Math.pow(S+1,FW[13])-1)*Math.exp(FW[14]*(1-R)))
                 : S*(1+Math.exp(FW[8])*(11-D)*Math.pow(S,-FW[9])*(Math.exp(FW[10]*(1-R))-1)*(g===2?FW[15]:1));
  const D1=D+(-FW[6]*(g-3))*(10-D)/9;
  return {S:Math.max(0.1,S2), D:fClampD(FW[7]*fD0(4)+(1-FW[7])*D1)};
}
// 처음 외울 때: 그 회차에서 받은 가장 낮은 채점으로 시작한다(처음에 '알았어'면 3일, 몇 번 만에 떠올렸으면 1일)
function cardFirst(g0){
  const S=g0===3?FW[2]:g0===2?FW[1]:FW[0]*Math.exp(FW[17]*FW[18]), D=fD0(g0), iv=fIvl(S), t=dnum();
  return [iv,+D.toFixed(2),t+iv,1,0,+S.toFixed(2),t];
}
function applyCardReview(m,id,g){
  const v=m[id]||cardFirst(3), t0=dnum();
  let [iv,D,due,rp,lp,S,last]=v;
  if(v.length<6||!(S>0)){ S=Math.max(0.5,iv||1); D=5; last=(due||t0)-(iv||1); } // 예전 SM-2 기록
  const nx=fsrsNext(S,D,t0-(last??t0),g);
  if(g===1){ lp=(lp||0)+1; rp=0; } else rp=(rp||0)+1;
  iv=fFuzz(fIvl(nx.S));
  m[id]=[iv,+nx.D.toFixed(2),t0+iv,rp,lp,+nx.S.toFixed(2),t0];
}
/* 오답 다시 보기(영신 26.11.26 "이어하기하면 중간중간 큰개념과 오답노트도 필요한걸 다 보고 갈 수 있게"):
   틀린 문제는 다음 날, 그다음 3일, 7일 뒤에 이어하기가 다시 보여 준다. 세 번 이어 맞히면 졸업(노트에는 남는다), 또 틀리면 처음부터. */
const MIS_GAPS=[1,3,7], MIS_MAX=10;
const misDay=m=>m.d??(dnum(m.t)+MIS_GAPS[0]);
function dueMistakes(){ const t=dnum(); return S.mistakes.items.filter(m=>NODE[m.n]&&!m.ok&&misDay(m)<=t); }
function logMistake(nid, q, a, c, why){
  S.mistakes.items.unshift({id:Math.random().toString(36).slice(2,10), n:nid, q:String(q).slice(0,500), a:String(a??'').slice(0,400), c:String(c??'').slice(0,500), why:String(why??'').slice(0,700), t:Date.now(), d:dnum()+MIS_GAPS[0], k:0});
  if(S.mistakes.items.length>100) S.mistakes.items.length=100;
  // a document holds at most 256 KiB and Korean takes 3 bytes a letter: drop the oldest past ~200 KB
  while(S.mistakes.items.length>1&&new TextEncoder().encode(JSON.stringify(S.mistakes)).length>200000) S.mistakes.items.pop();
  save('mistakes');
}

/* ============ persistence ============ */
const DOCS=['profile','progress','cards','stats','mistakes','book1','book2','book3','book4']; // bookN: textbook problem records by tier
const W={busy:{}, again:{}, dirty:{}, loadedAt:0};
const docRef=name=>ENV.db.doc(`data/users/${ENV.uid}/${name}`);
async function save(name){
  if(/^book/.test(name)) MIXC=null;
  if(!ENV.live) return;
  W.dirty[name]=true;
  if(W.busy[name]){ W.again[name]=true; return; }
  W.busy[name]=true;
  try{
    do{ W.again[name]=false; W.dirty[name]=false; await docRef(name).set(/^book\d$/.test(name)?packBook(S[name]):JSON.parse(JSON.stringify(S[name]??{}))); }while(W.again[name]);
  }catch(e){
    W.dirty[name]=true;
    // 끊김 같은 일시적 실패는 몇 초 뒤 다시 쓴다(db 계약: unavailable은 한 번 더). 크기·권한 문제는 다시 써도 안 된다.
    if(!['quota_exceeded','invalid_argument','revoked','not_granted'].includes(e?.code)) setTimeout(()=>{ if(W.dirty[name]&&!W.busy[name]) save(name); },3000+Math.random()*4000);
    toast(e?.code==='quota_exceeded'?'저장 공간이 가득 찼어. 오답 노트를 좀 정리해 줘.':'진행 상황을 저장하지 못했어. 잠시 뒤 다시 저장해 볼게.');
  }finally{ W.busy[name]=false; }
}
addEventListener('beforeunload',e=>{ if(Object.values(W.dirty).some(Boolean)){ e.preventDefault(); e.returnValue=''; } });
/* 두 기기(맥·PC)나 두 탭에서 열어 두면, 오래된 쪽이 새 기록을 통째로 덮을 수 있다. 화면으로 돌아올 때(30초 넘게 지났고
   저장할 것이 없을 때) 기록을 다시 읽는다. 카드·교재·진도 코드는 매번 S에서 새로 찾으므로 중간에 바꿔도 된다. */

/* 교재 기록은 단계마다 한 문서라 문제가 수천 개면 문서 한도(256 KiB)를 넘는다(2·3단계 약 6천 문제).
   저장할 때만 한 문제를 "상태|횟수|시각(초, 36진)|힌트|다시 풀 날" 한 줄로 줄이고(약 25바이트), 읽을 때 되푼다. 예전 꼴도 읽는다. */
const BK_CODE={solo:'o',self:'f',help:'h',wrong:'w',hold:'d',void:'v'}, BK_DECODE=Object.fromEntries(Object.entries(BK_CODE).map(([k,v])=>[v,k]));
function packBook(d){
  const u={};
  for(const [unit,m] of Object.entries(d?.u||{})){ const o=u[unit]={};
    for(const [k,e] of Object.entries(m||{})){ if(!e) continue; o[k]=[BK_CODE[e.s]||'w', e.n||0, e.t?Math.round(e.t/1000).toString(36):'', e.h||'', e.d||''].join('|'); } }
  return {v:2, u};
}
function unpackBook(d){
  if(!d||typeof d.u!=='object') return {u:{}};
  const u={};
  for(const [unit,m] of Object.entries(d.u)){ const o=u[unit]={};
    for(const [k,e] of Object.entries(m||{})){
      if(typeof e!=='string'){ if(e&&typeof e==='object') o[k]=e; continue; }
      const [s,n,t,h,dd]=e.split('|'), x={s:BK_DECODE[s]||'wrong', n:+n||0};
      if(t) x.t=parseInt(t,36)*1000; if(h) x.h=+h; if(dd) x.d=+dd; o[k]=x; } }
  return {u};
}
function normalize(){
  MIXC=null;
  if(!S.profile||!S.profile.started) S.profile=null;
  for(const t of [1,2,3,4]){ const d=S['book'+t]; if(d&&d.v===2) S['book'+t]=unpackBook(d); }
  if(!S.progress||typeof S.progress.nodes!=='object') S.progress={nodes:{}};
  if(!S.cards||typeof S.cards.u!=='object') S.cards={u:{}};
  if(!S.stats||typeof S.stats.days!=='object') S.stats={days:{}};
  if(!S.mistakes||!Array.isArray(S.mistakes.items)) S.mistakes={items:[]};
  for(const t of [1,2,3,4]){ const d=S['book'+t]; if(!d||typeof d.u!=='object') S['book'+t]={u:{}}; }
  // 모르는 단원 id의 기록은 지우지 않는다(지도를 고치다 생긴 오타 하나로 기록이 사라지지 않게). 읽는 코드는 모두 NODES를 거친다.
  for(const [id,r] of Object.entries(S.progress.nodes)){ if(r?.s==='credited') delete S.progress.nodes[id]; }
  // 지도를 고쳐 단원의 단계가 바뀌면 교재 기록을 새 단계 문서로 옮긴다(나중 기록이 이긴다)
  for(const t of [1,2,3,4]){ for(const [u,m] of Object.entries(S['book'+t].u)){ const nt=NODE[u]?.tier; if(!nt||nt===t) continue;
    const dst=(S['book'+nt].u[u] ||= {}); for(const [k,e] of Object.entries(m)) if(!dst[k]||(e.t||0)>(dst[k].t||0)) dst[k]=e;
    delete S['book'+t].u[u]; W.moved=true; } }
}
const LESSONS={}, CARDS={};
const LESSON_VERS=['v3','v2']; // v3 is also where the pre-made, reviewed lessons are uploaded (content/)
const STORED=new Set(); // 'lessons/<id>' and 'cards/<id>' that came from the store: reviewed content, never regenerated from the app
const lessonCached=id=>{ for(const v of LESSON_VERS){ const m=LESSONS[`${id}--${v}`]; if(m) return m; } return null; };
/* 읽기가 실패(끊김·8초 넘김)한 것과 '저장소에 없음'을 가른다. 예전에는 실패도 '없음'으로 보아 그 자리에서 새로 만들고
   검수한 lessons/·cards/를 덮을 수 있었다(26.11.25 검토). 실패면 던지고, 모든 판을 다 읽고 없을 때만 null이다. */
const LOADFAIL={code:'unavailable', message:'저장소에서 불러오지 못했어. 연결을 확인하고 다시 불러와 줘.'};
async function getLesson(id){
  if(lessonCached(id)) return lessonCached(id);
  if(!ENV.db) return null;
  let failed=false;
  for(const v of LESSON_VERS){
    try{ const s=await withTimeout(ENV.db.doc(`lessons/${id}--${v}`).get(),8000); const d=s.exists?s.data():null; if(d&&typeof d.md==='string'&&d.md.length>200){ LESSONS[`${id}--${v}`]=d.md; STORED.add(`lessons/${id}`); return d.md; } }
    catch(e){ failed=true; }
  }
  if(failed) throw LOADFAIL;
  return null;
}
// 그 자리에서 만든 설명은 아직 아무것도 없을 때만 쓴다(다시 쓰기 regen은 자기가 만든 것을 덮는다)

const CARD_META={}; // 저장소 문서의 다른 칸(src 등)을 앱이 고쳐 쓸 때도 남긴다
async function getCards(u){

  let s;
  try{ s=await withTimeout(ENV.db.doc('cards/'+u).get(),8000); }catch(e){ throw LOADFAIL; }

async function putCards(u, fresh){

// Every call asks for the most capable model tier (영신 26.11.13: "가장 유능한 등급"). A call that names its own tier keeps it.
// The platform answers with a nearby tier when the plan lacks this one. The platform's function is wrapped, never changed.
const MODEL_TIER='complex';
function strongest(s){
  const f=(input,opts={})=>s(input,{modelTier:MODEL_TIER,...opts});
  f.json=(input,opts={})=>s.json(input,{modelTier:MODEL_TIER,...opts});

/* ============ markdown + math ============ */
function tex(s,d){
  try{ if(window.katex) return katex.renderToString(String(s),{displayMode:d, output:'mathml', throwOnError:false, strict:'ignore', trust:false}); }catch(e){}
  return `<code class="tex">${esc(s)}</code>`;
}
function inl(s){
  s=String(s??''); const keep=[];
  const put=h=>{ keep.push(h); return `\u0001${keep.length-1}\u0002`; };
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,a)=>put(tex(a,true)))
     .replace(/\\\((.+?)\\\)/g,(m,a)=>put(tex(a,false)))
     .replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g,(m,a)=>put(tex(a,false)));
  s=esc(s)
    // a defined term "**가속도**(加速度, acceleration)": marked term, quiet gloss (PRINCIPLES 2-2-1)
    .replace(/\*\*([^*]+?)\*\*\s?\(([^()]{0,80}[A-Za-z㐀-鿿][^()]{0,80})\)/g,'<strong class="term">$1</strong><span class="gloss">($2)</span>')
    .replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?![*\w])/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[\[([a-z]-[a-z]+)(?:\|([^\]]+))?\]\]/g,(m,id,label)=>{
      const n=NODE[id]; if(!n) return label&&label!=='#'?label:id;
      // [[id|#]]: the unit's number as the app counts it now, so references survive map changes (26.11.14)
      if(label==='#') return `<button type="button" class="xref xnum" data-act="sel" data-id="${id}" title="${esc(n.t)}" style="--dc:var(${DOM[n.d].c})">${n.no}번</button>`;
      return `<button type="button" class="xref" data-act="sel" data-id="${id}" style="--dc:var(${DOM[n.d].c})"><span>${n.sym}</span>${label||esc(n.t)}</button>`;
    });
  return s.replace(/\u0001(\d+)\u0002/g,(m,i)=>keep[+i]);
}
function tableHTML(rows){
  const isSep=r=>/^[\s|:\-]+$/.test(r)&&r.includes('-');
  // the "|" inside [[id|#]] or [[id|이름]] is not a cell border
  const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').replace(/\[\[([a-z]-[a-z]+)\|/g,'[[$1\u0003').split('|').map(c=>c.trim().replace(/\u0003/g,'|'));
  const rs=rows.filter(r=>!isSep(r)).map(cells); if(!rs.length) return '';
  const [h,...b]=rs;
  return `<div class="tbl"><table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${b.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function layerOf(txt){
  const parts=txt.match(/직관|통상|엄밀/g); if(!parts) return null;
  const rest=txt.replace(/직관|통상|엄밀/g,'').replace(/적으로는|적으로|하게는|하게|으로는|으로|에서는|의|은|는|=|·|,|\/|\(|\)|:|\s|\*/g,'');
  if(rest) return null;
  const uniq=[...new Set(parts)];
  return {parts:uniq, cls:uniq.includes('엄밀')?'rig':uniq.includes('통상')?'std':'int'};
}
function md(src){
  const L=String(src??'').replace(/\r/g,'').split('\n'); const out=[];
  let para=[], list=null, quote=[], table=[], layer=false;
  const fp=()=>{ if(para.length){ out.push(`<p>${inl(para.join(' '))}</p>`); para=[]; } };
  // "- **오해:** … → **사실:** …" becomes a two-line item with the fact in front of the eye
  const li=x=>{ const m=x.match(/^\*\*오해\s*:?\s*\*\*\s*:?\s*([\s\S]*?)\s*(?:→|->)\s*\*\*사실\s*:?\s*\*\*\s*:?\s*([\s\S]*)$/);
    return m?`<li class="mis"><span class="mis-x"><span class="mis-k">오해</span>${inl(m[1])}</span><span class="mis-o"><span class="mis-k">사실</span>${inl(m[2])}</span></li>`:`<li>${inl(x)}</li>`; };
  const fl=()=>{ if(list){ out.push(list.t==='ol'?`<ol start="${list.start}">`:'<ul>'); out.push(list.items.map(li).join('')); out.push(`</${list.t}>`); list=null; } };
  const fq=()=>{ if(quote.length){ out.push(`<blockquote>${md(quote.join('\n'))}</blockquote>`); quote=[]; } };
  const ft=()=>{ if(table.length){ out.push(tableHTML(table)); table=[]; } };
  const flush=()=>{ fp(); fl(); fq(); ft(); };
  const closeLayer=()=>{ if(layer){ flush(); out.push('</div>'); layer=false; } };
  for(let i=0;i<L.length;i++){
    const raw=L[i], l=raw.trim(); let m;
    if(!l){ flush(); continue; }
    if(l.startsWith('```')){ // ```graph … ``` draws a figure; any other fence shows as code
      flush(); const kind=l.slice(3).trim(), acc=[];
      while(i+1<L.length){ i++; if(L[i].trim().startsWith('```')) break; acc.push(L[i]); }
      out.push(kind==='graph'?graphHTML(acc.join('\n')):kind==='img'?imgHTML(acc.join('\n')):kind==='link'?linkHTML(acc.join('\n')):`<pre class="code">${esc(acc.join('\n'))}</pre>`); continue;
    }
    const open = l.startsWith('$$') ? ['$$','$$'] : l.startsWith('\\[') ? ['\\[','\\]'] : null;
    if(open){
      flush(); let body=l.slice(2).trimEnd();
      if(body.endsWith(open[1])) body=body.slice(0,-2);
      else{ const acc=[body]; while(i+1<L.length){ i++; const t=L[i].trim(); if(t.endsWith(open[1])){ acc.push(t.slice(0,-2)); break; } acc.push(L[i]); } body=acc.join('\n'); }
      out.push(`<div class="math-block">${tex(body,true)}</div>`); continue;
    }
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){
      flush(); closeLayer();
      const txt=m[2].replace(/\s#+$/,'').trim(), lv=Math.min(4,Math.max(2,m[1].length));
      const ly=lv>=3?layerOf(txt):null;
      if(ly){ out.push(`<div class="layer l-${ly.cls}"><p class="ly-h">${ly.parts.map(p=>`<span class="ly">${p}</span>`).join('<span class="ly-eq">=</span>')}</p>`); layer=true; }
      else out.push(`<h${lv}>${inl(txt)}</h${lv}>`);
      continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){ flush(); out.push('<hr>'); continue; }
    if(l.startsWith('>')){ fp(); fl(); ft(); quote.push(l.replace(/^>\s?/,'')); continue; }
    if(l.startsWith('|')){ fp(); fl(); fq(); table.push(l); continue; }
    if((m=l.match(/^[-*•]\s+(.*)$/))){ fp(); fq(); ft(); if(!list||list.t!=='ul'){ fl(); list={t:'ul',items:[]}; } list.items.push(m[1]); continue; }
    if((m=l.match(/^(\d+)[.)]\s+(.*)$/))){ fp(); fq(); ft(); if(!list||list.t!=='ol'){ fl(); list={t:'ol',items:[],start:+m[1]}; } list.items.push(m[2]); continue; }
    if(list&&/^\s{2,}/.test(raw)){ list.items[list.items.length-1]+=' '+l; continue; }
    fl(); fq(); ft(); para.push(l);
  }
  flush(); closeLayer(); return out.join('');
}

/* ============ figures: ```graph blocks (26.11.16, 영신 "시각적 설명이 필요하지 않을까? 3blue1brown의 유튜브를 참조해줘") ============
   The app draws a figure from formulas, so the picture is computed, not hand-drawn. One item per line, no blank lines,
   expressions without spaces (x^2, 2*sin(x), sqrt(k)), '|' starts the label. tools/content-check.py checks the same grammar.
     x a b · y a b · h 260 · equal · nogrid · numline · cap 설명
     slider k 0 3 1 [0.1] [play] | 라벨      f expr [from a to b] | 라벨      par xexpr yexpr t0 t1 | 라벨
     pt x y [open] | 라벨   seg x1 y1 x2 y2 | 라벨   vec x1 y1 x2 y2 | 라벨   area expr a b   bars expr a b n
     iv a b [] | 라벨 (numline; a, b may be -inf, inf; ends [] [) (] ())   text x y | 라벨   hline y   vline x
     (17판) fn F expr (F(…) in any later expr, x is its argument) · dots expr a b [step] (points at x=a, a+step, …)
     hband a b · vband a b (shaded strip) · area expr a b [lower] (between two curves) · par … fill (filled closed curve)
     noaxes (no axes, grid or tick numbers) · xticks 0 1 2 | 1 10 100 (tick places | their labels) · yticks …
     x a b and y a b may use slider names (zoom) · f expr … at X | 라벨 (label at x=X)
   style words on any item: c0~c5 (색), dash, dot, thin, bold, fill. A label may hold {expr}: the value, at most two decimals.
   ```img blocks (17판, 영신 "그림을 찾아서 넣는건 어때?"): src img/… · alt · cap · credit · url — a freely licensed picture
   published next to the app, its credit always shown (sources/images.json). */
const GFN={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp,ln:Math.log,log:Math.log10,floor:Math.floor,ceil:Math.ceil,sign:Math.sign,min:Math.min,max:Math.max};
const GSTYLE=new Set(['c0','c1','c2','c3','c4','c5','dash','dot','thin','bold','open','fill']);
function gExpr(src, names, fns){
  const s=String(src); let i=0;
  const err=m=>{ throw new Error(`식 "${s}": ${m}`); };
  const atom=()=>{
    if(s[i]==='('){ i++; const e=add(); if(s[i]!==')') err('닫는 괄호가 없다'); i++; return e; }
    let m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i);
    if(m){ i+=m[0].length; const v=+m[0]; return ()=>v; }
    m=s.slice(i).match(/^[A-Za-z_][A-Za-z_0-9]*/); if(!m) err(`${i+1}번째 글자 '${s[i]??''}'`);
    i+=m[0].length; const id=m[0];
    if(s[i]==='('){ const f=GFN[id], uf=fns&&fns[id]; if(!f&&!uf) err(`모르는 함수 ${id}`); i++; const args=[add()]; while(s[i]===','){ i++; args.push(add()); } if(s[i]!==')') err('닫는 괄호가 없다'); i++; return uf?v=>uf(args[0](v),v):v=>f(...args.map(a=>a(v))); }
    if(id==='pi') return ()=>Math.PI;
    if(id==='e') return ()=>Math.E;
    if(names&&!names.has(id)) err(`모르는 이름 ${id}`);
    return v=>v[id];
  };
  const power=()=>{ const b=atom(); if(s[i]==='^'){ i++; const p=unary(); return v=>Math.pow(b(v),p(v)); } return b; };
  const unary=()=>{ if(s[i]==='-'){ i++; const a=unary(); return v=>-a(v); } if(s[i]==='+'){ i++; return unary(); } return power(); };
  const mul=()=>{ let a=unary(); while(s[i]==='*'||s[i]==='/'){ const op=s[i++], l=a, b=unary(); a=op==='*'?v=>l(v)*b(v):v=>l(v)/b(v); } return a; };
  const add=()=>{ let a=mul(); while(s[i]==='+'||s[i]==='-'){ const op=s[i++], l=a, b=mul(); a=op==='+'?v=>l(v)+b(v):v=>l(v)-b(v); } return a; };
  const e=add(); if(i<s.length) err(`${i+1}번째 글자 '${s[i]}'`);
  return e;
}
function gParse(text){
  const G={x:[-5,5], y:null, h:0, equal:false, grid:true, axes:true, numline:false, cap:'', items:[], sliders:[]};
  const lines=String(text).split('\n').map(l=>l.trim()).filter(Boolean), names=new Set(['x','t']);
  const split=l=>{ const j=l.indexOf('|'); return j<0?[l,'']:[l.slice(0,j).trim(), l.slice(j+1).trim()]; };
  for(const l of lines){ const [b,lab]=split(l), tk=b.split(/\s+/); if(tk[0]!=='slider') continue;
    const [, name, lo, hi, v0, st]=tk; if(!/^[A-Za-z_]\w*$/.test(name||'')||GFN[name]||['x','t','pi','e'].includes(name)) throw new Error(`슬라이더 이름 "${name}"`);
    const c=k=>gExpr(k,new Set())({}); const s={name, lo:c(lo), hi:c(hi), v:c(v0??lo), step:st&&st!=='play'?c(st):0, play:tk.includes('play'), label:lab};
    if(!(s.hi>s.lo)) throw new Error(`슬라이더 ${name}: 범위`); G.sliders.push(s); names.add(name); }

    if(tk[2]==null) throw new Error(`fn ${name}: 식이 없다`);

    const it={k:cmd, st, label};
    switch(cmd){

      case 'hband': case 'vband': it.a=E(a[0]); it.b=E(a[1]); break;
      case 'x': case 'y': { const e0=E(a[0]), e1=E(a[1]), v={...Object.fromEntries(G.sliders.map(s=>[s.name,s.v])), x:0, t:0};
        G[cmd]=[e0(v),e1(v)]; if(!(G[cmd][1]>G[cmd][0])) throw new Error(`${cmd} 범위`); if(/[A-Za-z]/.test(a[0]+a[1])) G[cmd+'E']=[e0,e1]; continue; }
      case 'noaxes': G.axes=false; continue;
      case 'xticks': case 'yticks': { const v=a.map(C), lab=label?label.split(/\s+/):v.map(gFmt); G[cmd==='xticks'?'xt':'yt']={v, lab}; continue; }
      case 'h': G.h=Math.max(60,Math.min(640,C(a[0]))); continue;
      case 'equal': G.equal=true; continue;
      case 'nogrid': G.grid=false; continue;
      case 'numline': G.numline=true; continue;

      case 'slider': continue;
      case 'f': { it.e=E(a[0]); const fi=a.indexOf('from'), ti=a.indexOf('to'), ai=a.indexOf('at'); if(fi>0) it.a=E(a[fi+1]); if(ti>0) it.b=E(a[ti+1]); if(ai>0) it.at=E(a[ai+1]); break; }
      case 'par': it.ex=E(a[0]); it.ey=E(a[1]); it.t0=E(a[2]); it.t1=E(a[3]); break;
      case 'pt': it.ex=E(a[0]); it.ey=a[1]!=null?E(a[1]):()=>0; break;
      case 'text': it.ex=E(a[0]); it.ey=E(a[1]); break;
      case 'seg': case 'vec': it.x1=E(a[0]); it.y1=E(a[1]); it.x2=E(a[2]); it.y2=E(a[3]); break;
      case 'area': it.e=E(a[0]); it.a=E(a[1]); it.b=E(a[2]); if(a[3]!=null) it.lo=E(a[3]); break;
      case 'bars': it.e=E(a[0]); it.a=E(a[1]); it.b=E(a[2]); it.n=E(a[3]); break;

const gNice=r=>{ const raw=r/7, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; };
const gFmt=v=>{ if(!isFinite(v)) return v>0?'∞':'−∞'; const r=Math.round(v*100)/100; return String(Object.is(r,-0)?0:r).replace('-','−'); };
function gSVG(G, vals){

  const rng=(c,E)=>{ if(!E) return c; try{ const r=E.map(f=>f(Object.assign({},vals))); return isFinite(r[0])&&isFinite(r[1])&&r[1]>r[0]?r:c; }catch(e){ return c; } };

  const V=Object.assign({},vals), ev=(fn,ex)=>{ try{ return fn(Object.assign(V,ex||{})); }catch(e){ return NaN; } };
  const lab=s=>{ let nan=false; const t=String(s||'').replace(/\{([^}]+)\}/g,(_,k)=>{ try{ const v=gExpr(k,null,G.fns)(V); if(Number.isNaN(v)){ nan=true; return ''; } return gFmt(v); }catch(e){ return '?'; } }); return nan?'':esc(t); }; // a value that is not a number hides the whole label (18판)
  const cls=it=>'g-'+(it.st.find(s=>/^c\d$/.test(s))||'c1'), mod=it=>it.st.filter(s=>['dash','dot','thin','bold','open'].includes(s)).join(' ');

const GR={};
const gHash=s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return 'g'+(h>>>0).toString(36); };
function graphHTML(text){
  const key=gHash(text);
  try{
    if(!GR[key]){ const G=gParse(text); GR[key]={G, vals:Object.fromEntries(G.sliders.map(s=>[s.name,s.v]))}; }
    const {G,vals}=GR[key];
    const ctl=G.sliders.map(s=>`<label class="g-sl"><span>${esc(s.label||s.name)}</span><input type="range" min="${s.lo}" max="${s.hi}" step="${s.step||(s.hi-s.lo)/200}" value="${vals[s.name]}" data-g="${key}" data-gv="${s.name}"><output>${gFmt(vals[s.name])}</output>${s.play?`<button type="button" class="btn sm ghost" data-act="g-play" data-g="${key}" data-gv="${s.name}">움직이기</button>`:''}</label>`).join('');
    return `<figure class="graph" data-g="${key}"><div class="g-svg">${gSVG(G,vals)}</div>${ctl?`<div class="g-ctl">${ctl}</div>`:''}${G.cap?`<figcaption>${inl(G.cap)}</figcaption>`:''}</figure>`;
  }catch(e){ return `<div class="note bad g-err">그림을 그리지 못했어: ${esc(e.message||e)}</div>`; }
}
function imgHTML(text){
  const o={}; for(const l of String(text).split('\n')){ const m=l.trim().match(/^(\w+)\s+(.*)$/); if(m) o[m[1]]=m[2].trim(); }
  if(!/^img\/[\w.\/-]+\.(jpg|jpeg|png|webp|svg)$/i.test(o.src||'')) return `<div class="note bad g-err">사진을 넣지 못했어: src "${esc(o.src||'')}"</div>`;
  const link=/^https:\/\/[^\s"<>]+$/.test(o.url||'')?o.url:'';
  return `<figure class="graph g-photo"><img src="${esc(o.src)}" alt="${esc(o.alt||'')}" loading="lazy"><figcaption>${o.cap?inl(o.cap):''}<span class="g-credit">${esc(o.credit||'')}${link?` · <a href="${esc(link)}" target="_blank" rel="noopener">출처</a>`:''}</span></figcaption></figure>`;
}
/* ```link blocks (18판, 영신 "영상은 봐야하는거라면 설명에 녹여서 보고 지나가게 하자 … 블로그 링크든 뭐든 링크로 보게해도 됨"):
   url · title · kind (영상, 글, 시뮬레이션, 자료) · who · min · note · why — a card in the reading flow, opened in a new window. */
function linkHTML(text){
  const o={}; for(const l of String(text).split('\n')){ const m=l.trim().match(/^(\w+)\s+(.*)$/); if(m) o[m[1]]=m[2].trim(); }
  if(!/^https:\/\/[^\s"<>]+$/.test(o.url||'')) return `<div class="note bad g-err">링크를 넣지 못했어: url "${esc(o.url||'')}"</div>`;
  const kind=o.kind||'자료', ic={'영상':'▶','글':'¶','시뮬레이션':'◐'}[kind]||'↗';
  const meta=[kind, o.who, o.min?`${o.min}분`:'', o.note].filter(Boolean).join(' · ');
  return `<aside class="g-link"><a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer"><span class="g-lk-ic" aria-hidden="true">${ic}</span><span class="g-lk-t"><b>${esc(o.title||o.url)}</b><span class="g-lk-m">${esc(meta)}</span>${o.why?`<span class="g-lk-w">${inl(o.why)}</span>`:''}</span><span class="g-lk-go">새 창 ↗</span></a></aside>`;
}
function gPaint(key){
  const R=GR[key]; if(!R) return;
  document.querySelectorAll(`figure.graph[data-g="${key}"]`).forEach(f=>{
    const box=f.querySelector('.g-svg'); if(box) box.innerHTML=gSVG(R.G,R.vals);
    f.querySelectorAll('input[data-gv]').forEach(inp=>{ const v=R.vals[inp.dataset.gv]; if(document.activeElement!==inp) inp.value=v; const o=inp.nextElementSibling; if(o?.tagName==='OUTPUT') o.textContent=gFmt(v); });
  });
}
document.addEventListener('input',e=>{ const t=e.target; if(!t?.dataset?.g||!t.dataset.gv) return; const R=GR[t.dataset.g]; if(!R) return; R.vals[t.dataset.gv]=+t.value; gPaint(t.dataset.g); });
function gPlay(key,name){
  const R=GR[key], s=R?.G.sliders.find(x=>x.name===name); if(!s) return;
  if(R.anim) cancelAnimationFrame(R.anim);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ R.vals[name]=R.vals[name]>=s.hi-1e-9?s.lo:s.hi; gPaint(key); return; }
  const from=R.vals[name]>=s.hi-1e-9?s.lo:R.vals[name], t0=performance.now(), dur=3500*(s.hi-from)/(s.hi-s.lo)+300;
  const step=now=>{ const k=Math.min(1,(now-t0)/dur); R.vals[name]=from+(s.hi-from)*k; gPaint(key); R.anim=k<1?requestAnimationFrame(step):0; };
  R.anim=requestAnimationFrame(step);
}

function related(n){
  const set=new Set();
  n.pre.forEach(p=>{ set.add(p); NODE[p].pre.forEach(q=>set.add(q)); });
  UNLOCKS[n.id].forEach(u=>set.add(u));
  NODES.filter(m=>m.id!==n.id&&m.d!==n.d&&m.ideas.some(i=>n.ideas.includes(i))&&!set.has(m.id)).slice(0,8).forEach(m=>set.add(m.id));
  set.delete(n.id);
  return [...set].map(id=>NODE[id]).sort(byNo);
}

설명의 층위
- "원리"에서 각 학습 목표는 아래 세 층으로 설명한다. 각 층은 #### 제목으로 시작한다.
  #### 직관 — 머릿속에 그림이 그려지는 이해. 일상의 장면이나 비유를 쓰되, 그 비유가 어디까지 맞고 어디서 틀리는지도 밝힌다.
  #### 통상 — 교과서 수준의 표준 설명. 정확한 정의, 핵심 식, 기호와 단위.
  #### 엄밀 — 정확한 진술. 전제와 적용 범위, 성립하지 않는 경우, 짧은 유도나 근거, 더 정확한 이론에서 어떻게 고쳐지는지.

용어와 정의
- 용어는 처음 나올 때 **한글**(漢字, English) 꼴로 쓴다. 예: **가속도**(加速度, acceleration), **알짜힘**(net force). 한자어가 아니면 한자를 빼고, 한자는 정확한 표준 자형으로 쓴다.
- 정의는 짧아도 철저하게 쓴다. 정의 문장 하나만 떼어 읽어도 무엇을 가리키는지, 어떤 조건에서 성립하는지 완결되어야 한다. 그대로 외울 수 있게 한 문장으로 쓰고, 앞뒤 문맥에 기대지 않는다.
- 한정어를 지킨다. "주로", "대개", "일반적으로", "~일 수 있다", "이상 기체에서", "온도가 일정할 때"처럼 사실이 요구하는 한정어와 조건은 빼지 않는다. 한정어를 빼서 단정하면 틀린 문장이다.

- 기호를 처음 쓸 때 뜻과 SI 단위를 밝힌다. 수식은 LaTeX로, 문장 안은 $...$, 따로 보일 때는 한 줄에 $$...$$.

function normItem(x, nobj){
  if(!x||typeof x.q!=='string'||!x.q.trim()) return null;
  const obj=Number.isInteger(+x.obj)&&+x.obj>=0&&+x.obj<nobj? +x.obj : 0;
  const level=String(x.level||''), key=cleanKey(x.key);
  if(x.type==='mcq'&&Array.isArray(x.choices)&&x.choices.length>=2&&x.choices.length<=6&&Number.isInteger(+x.answer)&&+x.answer>=0&&+x.answer<x.choices.length)
    return {type:'mcq', obj, level, q:x.q, choices:x.choices.map(String), answer:+x.answer, why:String(x.why||''), key};
  if(x.type==='num'&&x.answer!==''&&x.answer!=null&&isFinite(+x.answer))
    return {type:'num', obj, level, q:x.q, answer:+x.answer, tol:Math.min(0.2,Math.max(0.001,+x.tol||0.02)), unit:String(x.unit||''), why:String(x.why||''), key};
  if(x.type==='short')
    return {type:'short', obj, level, q:x.q, rubric:Array.isArray(x.rubric)?x.rubric.map(String):[], model:String(x.model||''), key};
  return null;
}
const asArray=a=>Array.isArray(a)?a:(a?.items||a?.questions||a?.cards||[]);
// 수 하나만 받는다. "1/2", "10^5"처럼 앞자리만 읽히면 틀림이 되던 것을 '다시 써 줘'로 돌린다(26.11.25 검토). 분수 a/b는 계산해 받는다.
function parseNum(s){
  s=String(s).normalize('NFKC').trim().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/,/g,'').replace(/[×x*]10\^?\(?([-+]?\d+)\)?/i,'e$1').replace(/^\+/,'');
  const num='[-]?(?:\\d+\\.?\\d*|\\.\\d+)(?:e[-+]?\\d+)?';
  let m=s.match(new RegExp(`^(${num})\\/(${num})$`,'i')); if(m){ const v=parseFloat(m[1])/parseFloat(m[2]); return isFinite(v)?v:NaN; }
  m=s.match(new RegExp(`^(${num})([a-zA-Zµμ°%/²³·.\\-^0-9()]*)$`,'i')); if(!m) return NaN;
  if(m[2]&&/^[\d.^\/(]/.test(m[2])) return NaN;
  const v=parseFloat(m[1]); return isFinite(v)?v:NaN;
}

/* one-screen reader: the lesson is cut into chunks; a new chunk needs reading time, each goal ends with a checkpoint */
let rdTimer=0;
function plainLen(s){ return String(s||'').replace(/```[\s\S]*?```/g,'그림'.repeat(30)).replace(/\$\$[\s\S]*?\$\$/g,'수식수식수식').replace(/\$[^$\n]+\$/g,'수식').replace(/[#*>|`\-:]/g,'').replace(/\s+/g,'').length; }
const dwellOf=c=>c.type!=='text'?0:Math.min(35,Math.max(3,Math.round(plainLen(c.body)/10)));
const opensMath=l=>(l.startsWith('$$')&&!(l.length>2&&l.endsWith('$$')))||(l.startsWith('\\[')&&!l.endsWith('\\]'));
function chunkLesson(src){
  const lines=String(src||'').replace(/\r/g,'').split('\n'), out=[];
  let sec='', sub='', cur=null, inMath=false, inFence=false;
  const push=()=>{
    if(!cur) return;
    if(cur.type==='check'){ if(cur.q&&cur.a) out.push(cur); else if(cur.q||cur.a){ cur.type='text'; cur.body=[`**Q.** ${cur.q}`,'',`**A.** ${cur.a}`]; out.push(cur); } }
    else if(cur.body.join('').trim()) out.push(cur);
    cur=null;
  };
  const start=type=>{ push(); cur={type, sec, sub, grp:sec+'|'+sub, body:[], q:'', a:'', mode:''}; };
  for(const raw of lines){
    const l=raw.trim();
    if(inMath){ cur.body.push(raw); if(l.includes('$$')||l.includes('\\]')) inMath=false; continue; }
    if(inFence){ cur.body.push(raw); if(l.startsWith('```')) inFence=false; continue; }
    if(l.startsWith('```')&&cur?.type!=='check'){ if(!cur) start('text'); inFence=true; cur.body.push(raw); continue; }
    const m=l.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const lv=m[1].length, txt=m[2].replace(/\s#+$/,'').trim();
      if(lv<=2){ sec=txt; sub=''; start('text'); continue; }
      if(lv===3){ sub=txt; start('text'); continue; }
      if(/^점검/.test(txt)){ start('check'); continue; }
      start('text'); cur.body.push(raw); continue;
    }
    if(!cur) start('text');
    if(cur.type==='check'){
      const q=l.match(/^(?:\*\*)?Q\s*[.:)]\s*(?:\*\*)?\s*(.*)$/i), a=l.match(/^(?:\*\*)?A\s*[.:)]\s*(?:\*\*)?\s*(.*)$/i);
      if(q){ cur.q=q[1]; cur.mode='q'; } else if(a){ cur.a=a[1]; cur.mode='a'; } else if(l){ if(cur.mode==='a') cur.a+=' '+l; else if(cur.mode==='q') cur.q+=' '+l; }
      continue;
    }
    if(opensMath(l)) inMath=true;
    cur.body.push(raw);
  }
  push();
  const res=[];
  for(const c of out){
    if(c.type!=='text'||plainLen(c.body.join('\n'))<=900){ res.push({...c, body:c.type==='text'?c.body.join('\n'):''}); continue; }
    const head=/^#{4,}\s/.test((c.body[0]||'').trim())?c.body[0]:null;
    const paras=[]; let p=[], im=false;
    for(const raw of (head?c.body.slice(1):c.body)){
      const l=raw.trim();
      if(im){ p.push(raw); if(l.includes('$$')||l.includes('\\]')) im=false; continue; }
      if(opensMath(l)) im=true;
      if(!l){ if(p.length){ paras.push(p.join('\n')); p=[]; } continue; }
      p.push(raw);
    }
    if(p.length) paras.push(p.join('\n'));
    let acc=[], len=0;
    const flush=()=>{ if(acc.length){ res.push({...c, body:(head?head+'\n\n':'')+acc.join('\n\n')}); acc=[]; len=0; } };
    for(const para of paras){ const pl=plainLen(para); if(len&&len+pl>650) flush(); acc.push(para); len+=pl; }
    flush();
  }
  return res;
}
/* 교재 문제 pages inside the lesson (PRINCIPLES 2-5, 26.11.16 영신 "목표마다 맞물리기"): objective k's problems come right
   after objective k; the last objective's after the examples and misconceptions, so every worked example is read first.
   A page needs every one of its problems tried once before the next page opens. */
function objOfChunk(chunks){
  const om={}; let n=0;
  for(const c of chunks){ if(c.sec!=='원리'||!c.sub||c.sub in om) continue; const k=+(c.sub.match(/^(\d)\s*[.)]/)?.[1]||0); n=k||n+1; om[c.sub]=n; }
  return c=>c.sec==='원리'&&c.sub?om[c.sub]||0:0;
}
function withBooks(u, chunks){
  if(!NODE[u]||!hasObj(u)) return chunks;
  const L=gateList(u), of=objOfChunk(chunks), last={}; let K=0, ex=-1, mis=-1;
  chunks.forEach((c,j)=>{ const k=of(c); if(k){ last[k]=j; K=Math.max(K,k); } if(/오개념/.test(c.sec)) mis=j; else if(/^예제/.test(c.sec)) ex=j; });
  const tail=mis>=0?mis:ex>=0?ex:K?last[K]:-1, at={};
  for(const k of [1,2,3]){ if(!L.some(p=>p.o===k)) continue; const j=k<K&&last[k]!=null?last[k]:tail; if(j>=0) (at[j] ||= []).push(k); }
  const out=[];
  chunks.forEach((c,j)=>{ out.push(c); for(const k of (at[j]||[])) out.push({type:'book', o:k, sec:'교재 문제', sub:'', grp:'book|'+k, body:'', q:'', a:''}); });
  return out;
}

  const state=!s.fresh?`<p class="bk-ok">이 목표의 문제를 모두 한 번씩 풀었어.${s.due?` 오늘 다시 풀 문제 ${s.due}개는 교재 문제에서 이어 풀 수 있어.`:''}${isNew?' 다음 장으로 넘어가.':''}</p>`

function tocHTML(chunks,R){

async function ensureChecks(sv){
  const L=sv.lesson;
  if(!L.md||/^####\s*점검/m.test(L.md)||sv.checksBusy||!ENV.sample||L.state!=='done') return;
  const subs=[...L.md.matchAll(/^###\s+(.+)$/gm)].map(m=>m[1].trim()); if(!subs.length) return;
  sv.checksBusy=true;
  try{
    const arr=asArray(await ENV.sample.json(checksPrompt(NODE[sv.id],subs,L.md),{cache:false}));
    const items=arr.filter(x=>x&&x.q&&x.a&&x.sub).map(x=>({sub:String(x.sub).trim(), q:String(x.q).trim(), a:String(x.a).trim()}));
    if(!items.length||sv.lesson!==L) return;
    const find=s=>items.find(x=>x.sub===s)||items.find(x=>x.sub.includes(s)||s.includes(x.sub));
    const out=[]; let pending=null;
    const flushCheck=()=>{ if(pending){ const x=find(pending); if(x) out.push('','#### 점검',`**Q.** ${x.q}`,`**A.** ${x.a}`,''); pending=null; } };
    for(const line of L.md.split('\n')){ const m=line.match(/^(#{2,3})\s+(.+)$/); if(m){ flushCheck(); if(m[1]==='###') pending=m[2].trim(); } out.push(line); }
    flushCheck();
    const before=withBooks(sv.id,chunkLesson(L.md)), R=sv.reader, cur=R?before[R.i]:null, top=R?before[Math.min(R.max,before.length-1)]:null;
    L.md=out.join('\n'); putLesson(sv.id,L.md);
    if(R&&cur){ const after=withBooks(sv.id,chunkLesson(L.md)), at=x=>x?after.findIndex(c=>c.type===x.type&&c.body===x.body&&c.q===x.q):-1; const i=at(cur), mx=at(top); if(i>=0){ R.shown={[i]:R.shown[R.i]}; R.i=i; R.max=Math.max(i,mx); } }
    if(UI.study===sv) paintLesson();
  }catch(e){}
  finally{ sv.checksBusy=false; }
}
